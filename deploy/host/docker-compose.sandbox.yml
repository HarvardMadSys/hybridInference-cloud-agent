# Agent runners on a machine that is not the gateway's.
#
# Standalone, not an overlay on docker-compose.yml, and that is the point.
# `docker-compose.agent-runner.yml` declares `depends_on: backend`, so pointing
# it at a machine with no gateway does not fail — it *starts one*, along with
# whatever else the base file brings, on a box that was only ever meant to run
# jobs. This file contains exactly what a remote runner host needs: the
# runners, their sandbox manager, three purpose-scoped tunnels, and the
# network the sandbox groups discover their two relays on.
#
#   sandbox ──→ gateway-tunnel ──ssh──→ inference gateway
#           ├─→ mcp-tunnel ─────ssh──→ MCP-only relay
#           └─→ host rules and NAT ───→ public IPv4, TCP 80/443
#   runner  ──→ control-plane-tunnel ─ssh──→ control-plane API
#
# Every sandbox group gets its own routable bridge, created outside Compose by
# the runner and the sandbox manager. Before anything joins one, they install this
# deployment's host nftables table, which admits public IPv4 on TCP 80/443,
# the named resolver, and the two relays' service ports, and refuses the host,
# private and special-purpose addresses, other groups, and IPv6. There is no
# proxy and no second network for setup: preparing and running a task share
# the group's one bridge.
#
# Both sides address the tunnel by the same name, because they have to: the
# runner claims over AGENT_GATEWAY_URL and the sandbox is handed that same
# value for its model calls. The alias resolves on the runner's network and on
# every group bridge the relay is attached to.
#
# Start it with deploy/host/sandbox_host.sh, which checks the pieces that
# fail confusingly when missing.

services:
  gateway-tunnel:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-gateway-tunnel
    restart: unless-stopped
    environment:
      # user@host of the gateway machine — the only address anything here can
      # reach through this container.
      TUNNEL_SSH_DESTINATION: ${AGENT_TUNNEL_SSH_DESTINATION:?user@gateway-host for the tunnel}
      TUNNEL_SSH_PORT: ${AGENT_TUNNEL_SSH_PORT:-22}
      # Where the gateway listens *on that machine*. Loopback by default, which
      # is the setup this design keeps intact: the gateway need not be exposed
      # to the network at all.
      TUNNEL_REMOTE_HOST: ${AGENT_TUNNEL_REMOTE_HOST:-127.0.0.1}
      TUNNEL_REMOTE_PORT: ${AGENT_TUNNEL_REMOTE_PORT:-8080}
      TUNNEL_LISTEN_PORT: ${AGENT_TUNNEL_LISTEN_PORT:-8080}
    volumes:
      # Read-only, and its own key: this one may open a single forwarded port
      # and nothing else. Restrict it on the gateway host's authorized_keys
      # with command="" plus permitopen — a shell on the gateway is not part of
      # what a runner host needs — and give its account the Match block in
      # deploy/host/sshd-tunnels.conf.example, which refuses remote forwards.
      - ${AGENT_TUNNEL_SSH_KEY:?path to the tunnel's ssh private key}:/etc/agent-tunnel/id:ro
      - ${AGENT_TUNNEL_SSH_KNOWN_HOSTS:?path to a known_hosts for the gateway host}:/etc/agent-tunnel/known_hosts:ro
    networks:
      # The alias is declared on BOTH networks, and it has to be. The runner is
      # only on `internal` and is handed AGENT_GATEWAY_URL pointing at
      # this name; group lifecycle discovers this alias on the relay network
      # and attaches the tunnel, under the same name, to each group's bridge.
      # An alias missing from either network resolves for one side and
      # NXDOMAINs for the other — which is what this file did until it was
      # caught in review, while the comment above already claimed both.
      internal:
        aliases:
          - ${AGENT_GATEWAY_HOSTNAME:-agent-gateway}
      # Together with the MCP-only tunnel below, one of the two endpoints
      # lifecycle code attaches to every group bridge.
      agent-relays:
        aliases:
          - ${AGENT_GATEWAY_HOSTNAME:-agent-gateway}

  # The second narrow destination. MCP moved to the cloud agent's own relay, so
  # a sandbox now needs two addresses and reaches nothing else: the gateway for
  # model calls, this for tools. Two tunnels rather than one wider one, because
  # "the sandbox may reach the control plane" is a much bigger permission than
  # "the sandbox may reach the MCP relay" — and the control plane is where jobs
  # are created and cancelled.
  mcp-tunnel:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-gateway-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_SSH_DESTINATION: ${AGENT_MCP_TUNNEL_SSH_DESTINATION:?user@control-plane-host for the MCP tunnel}
      TUNNEL_SSH_PORT: ${AGENT_MCP_TUNNEL_SSH_PORT:-22}
      # Where the control plane listens *on that machine*. Loopback by default,
      # for the same reason the gateway's is: the service need not be exposed
      # to the network at all.
      TUNNEL_REMOTE_HOST: ${AGENT_MCP_TUNNEL_REMOTE_HOST:-127.0.0.1}
      # **8001, the MCP-only listener — never 8000.** A sandbox reaches the far
      # end of this tunnel; 8000 serves jobs, sessions, host registration and
      # admin, and no longer the relay at all. Pointing here fails every tool
      # call, and it would put the entire trusted control plane one
      # authorization bug away from untrusted code — a reachability decision
      # that should not rest on an authorization one.
      TUNNEL_REMOTE_PORT: ${AGENT_MCP_TUNNEL_REMOTE_PORT:-8001}
      TUNNEL_LISTEN_PORT: ${AGENT_MCP_TUNNEL_LISTEN_PORT:-8000}
    volumes:
      # Its own key, restricted the same way. A key that can open both tunnels
      # would make the separation above cosmetic.
      - ${AGENT_MCP_TUNNEL_SSH_KEY:?path to the MCP tunnel's ssh private key}:/etc/agent-tunnel/id:ro
      - ${AGENT_MCP_TUNNEL_SSH_KNOWN_HOSTS:?path to a known_hosts for the control-plane host}:/etc/agent-tunnel/known_hosts:ro
    networks:
      # On both, and aliased on both, for the same reason the gateway tunnel
      # is: the runner resolves this name on `internal`, lifecycle discovers it
      # on the relay network, and an alias declared on one NXDOMAINs on the
      # other.
      internal:
        aliases:
          - ${AGENT_MCP_HOSTNAME:-agent-mcp}
      agent-relays:
        aliases:
          - ${AGENT_MCP_HOSTNAME:-agent-mcp}

  # The third destination, and the one no sandbox may reach. The runner claims
  # jobs, registers this host and heartbeats against the control plane's main
  # listener — the same 8000 the MCP tunnel deliberately stopped pointing at.
  #
  # **Not on the relay network, and that is the entire point.** Splitting the
  # MCP relay onto 8001 was worth nothing if a second alias put 8000 on a group
  # bridge under a different name. Its address on `internal` is a private one,
  # which the host rules refuse from every group. A sandbox reaches the gateway
  # and the MCP relay; the machine that runs it reaches the control plane;
  # those are three permissions and three tunnels.
  control-plane-tunnel:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-gateway-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_SSH_DESTINATION: ${AGENT_CONTROL_PLANE_TUNNEL_SSH_DESTINATION:?user@control-plane-host for the control-plane tunnel}
      TUNNEL_SSH_PORT: ${AGENT_CONTROL_PLANE_TUNNEL_SSH_PORT:-22}
      TUNNEL_REMOTE_HOST: ${AGENT_CONTROL_PLANE_TUNNEL_REMOTE_HOST:-127.0.0.1}
      # 8000 — jobs, host registration, sessions and admin. The listener the
      # MCP tunnel must never reach.
      TUNNEL_REMOTE_PORT: ${AGENT_CONTROL_PLANE_TUNNEL_REMOTE_PORT:-8000}
      TUNNEL_LISTEN_PORT: ${AGENT_CONTROL_PLANE_TUNNEL_LISTEN_PORT:-8000}
      # The way back, on this same connection. Required by this standalone
      # topology even when both stacks happen to run on one physical machine:
      # their Compose networks remain separate, so the control plane cannot
      # resolve or dial `sandbox-manager` directly.
      #
      # Without it every call that touches the sandbox manager (terminal suspend, file
      # listing, git status) reaches the control plane, which then tries to
      # resolve a compose service name that means nothing on its machine, and
      # answers 503. Jobs die at their first such call, every attempt, until
      # they run out. That is not hypothetical — it is what the first real job
      # on this deployment did, three times.
      #
      # Bind the far host's docker bridge gateway, not 0.0.0.0: the audience is
      # the containers on that bridge, and a sandbox manager published to the LAN is one
      # shared token away from anyone on it.
      TUNNEL_REVERSE_BIND: ${AGENT_SANDBOX_MANAGER_REVERSE_BIND:-${AGENT_BROKER_REVERSE_BIND:-}}
      TUNNEL_REVERSE_PORT: ${AGENT_SANDBOX_MANAGER_REVERSE_PORT:-${AGENT_BROKER_REVERSE_PORT:-}}
      TUNNEL_REVERSE_TARGET_HOST: ${AGENT_SANDBOX_MANAGER_REVERSE_TARGET_HOST:-${AGENT_BROKER_REVERSE_TARGET_HOST:-sandbox-manager}}
      TUNNEL_REVERSE_TARGET_PORT: ${AGENT_SANDBOX_MANAGER_REVERSE_TARGET_PORT:-${AGENT_BROKER_REVERSE_TARGET_PORT:-8092}}
    volumes:
      # Its own key again. One key that opens both this and the MCP tunnel
      # would let anything holding it reach 8000 from the sandbox's side. It
      # is the only key whose authorized_keys line carries permitlisten, for
      # exactly the reverse bind address and port above.
      - ${AGENT_CONTROL_PLANE_TUNNEL_SSH_KEY:?path to the control-plane tunnel's ssh private key}:/etc/agent-tunnel/id:ro
      - ${AGENT_CONTROL_PLANE_TUNNEL_SSH_KNOWN_HOSTS:?path to a known_hosts for the control-plane host}:/etc/agent-tunnel/known_hosts:ro
    networks:
      internal:
        aliases:
          - ${AGENT_CONTROL_PLANE_HOSTNAME:-agent-control-plane}

  sandbox-manager:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-runner
    restart: unless-stopped
    # sandbox_host.sh drains runner replicas and then stops this exact container
    # without a forced deadline, so archive finalizers normally finish before
    # Compose replaces or removes it. Keep a longer fallback than Docker's
    # default for direct Compose operations, but do not use it as the archive
    # lifecycle bound: multiple retained groups are finalized serially.
    stop_grace_period: ${AGENT_SANDBOX_MANAGER_STOP_GRACE:-${AGENT_BROKER_STOP_GRACE:-30s}}
    environment:
      # Both host processes read these, and neither was reachable from this
      # file — setting them in the host's .env was a no-op. `json` renders the
      # structured fields these services already log.
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_LOG_FORMAT: ${AGENT_LOG_FORMAT:-text}
      AGENT_OPERATION_PROFILING_ENABLED: ${AGENT_OPERATION_PROFILING_ENABLED:-false}
      AGENT_OPERATION_PROFILING_RUN: ${AGENT_OPERATION_PROFILING_RUN:-}
      AGENT_OPERATION_PROFILING_SINK: ${AGENT_OPERATION_PROFILING_SINK:-}
      # `admin` lets the Admin page's Start and Stop reach this producer
      # without a redeploy. Unset keeps the legacy semantics. The sandbox manager needs
      # it as well as the runner: it is a separate container, and it will not
      # honour a selection the runner hands it unless its own mode says a
      # control plane may decide what to collect.
      AGENT_OPERATION_PROFILING_MODE: ${AGENT_OPERATION_PROFILING_MODE:-}
      # A sandbox-manager-only secret. Host enrollment/claim uses its persisted host
      # credential; neither credential is accepted at the other's surface.
      AGENT_SANDBOX_MANAGER_TOKEN: ${AGENT_SANDBOX_MANAGER_TOKEN:?a secret for this host's sandbox manager}
      AGENT_SHARED_RESIDENT_CAPACITY: ${AGENT_SHARED_RESIDENT_CAPACITY:-8}
      # Daemon-side path, observed through `docker info`; it is deliberately
      # not mounted into this container. Leave the default. A durable disk is
      # bind-mounted onto /var/lib/docker, not selected as a custom data-root.
      AGENT_RETAINED_DOCKER_DATA_ROOT: ${AGENT_RETAINED_DOCKER_DATA_ROOT:-/var/lib/docker}
      # Sandbox Manager-only archival receipts and temporary exports survive service
      # replacement. No sandbox or runner mounts this directory.
      AGENT_SANDBOX_ARCHIVE_STATE_DIR: /var/lib/hybridinference/broker-archives
      # Product inactivity timeout: after the latest settled turn (and after
      # all terminals close), docker stop retains the chat writable layer.
      # This is distinct from the per-turn AGENT_TIMEOUT_S watchdog.
      AGENT_CHAT_IDLE_TIMEOUT_S: ${AGENT_CHAT_IDLE_TIMEOUT_S:-1800}
      # Fork can wake and native-resume a source without a runner turn.  The
      # sandbox manager therefore needs the same sandbox-reachable relay addresses the
      # runner hands to ordinary resident processes.
      AGENT_GATEWAY_URL: http://${AGENT_GATEWAY_HOSTNAME:-agent-gateway}:${AGENT_TUNNEL_LISTEN_PORT:-8080}
      AGENT_SANDBOX_MCP_URL: http://${AGENT_MCP_HOSTNAME:-agent-mcp}:${AGENT_MCP_TUNNEL_LISTEN_PORT:-8000}
      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-kata}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:?name the sandbox image this deployment runs}
      # The sandbox manager wakes groups on its own (Fork, files, terminals), so it
      # builds and guards group bridges exactly as the runner does, from the
      # same four values. See the runner below for what each one decides.
      AGENT_RELAY_NETWORK: ${AGENT_RELAY_NETWORK:-${COMPOSE_PROJECT:?the unique host Compose project}-agent-relays}
      AGENT_EGRESS_CHAT_NETWORK_POOL: ${AGENT_EGRESS_CHAT_NETWORK_POOL:?this deployment's own RFC1918 pool for group bridges}
      AGENT_EGRESS_DNS_SERVER: ${AGENT_EGRESS_DNS_SERVER:?the one IPv4 resolver sandboxes may reach}
      AGENT_EGRESS_PROTECTED_CIDRS: ${AGENT_EGRESS_PROTECTED_CIDRS:-}
      # Immutable owner label for daemon-wide retained-container discovery, and
      # the name of this deployment's host rules. Sibling staging/production
      # Compose projects must never adopt each other's chat processes during
      # sandbox manager startup reconciliation, nor rewrite each other's tables.
      AGENT_SANDBOX_NAMESPACE: ${COMPOSE_PROJECT:?the unique host Compose project}
    command:
      - python
      - -m
      - cloud_agent_host.sandbox_manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}/sandbox-archives:/var/lib/hybridinference/broker-archives
    networks:
      internal:
        # Keep old runner images able to reach the renamed service during upgrades.
        aliases: [workspace-broker]

  runner:
    # Fallback grace period for direct, out-of-band Compose operations. The
    # supported host activation path calls Engine `stop --time=-1` for this
    # service's exact container IDs: the service stops claiming on SIGTERM,
    # lets every child turn finish, and a deployment never converts that drain
    # into SIGKILL.
    stop_grace_period: ${AGENT_RUNNER_STOP_GRACE:-5m}
    # One container per host, on purpose. It runs one service that enrolls,
    # heartbeats and claims, and starts a process per turn as it claims one —
    # up to the limit the control plane last asked for (the admin Servers
    # page), or AGENT_HOST_SLOTS until one has been set. Concurrency is that
    # limit, not a fleet size fixed at deploy time, and scaling this service
    # would enroll the same host twice.
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-runner
    restart: unless-stopped
    environment:
      # Both host processes read these, and neither was reachable from this
      # file — setting them in the host's .env was a no-op. `json` renders the
      # structured fields these services already log.
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_LOG_FORMAT: ${AGENT_LOG_FORMAT:-text}
      AGENT_OPERATION_PROFILING_ENABLED: ${AGENT_OPERATION_PROFILING_ENABLED:-false}
      AGENT_OPERATION_PROFILING_RUN: ${AGENT_OPERATION_PROFILING_RUN:-}
      AGENT_OPERATION_PROFILING_SINK: ${AGENT_OPERATION_PROFILING_SINK:-}
      # `admin` lets the Admin page's Start and Stop reach this producer
      # without a redeploy. Unset keeps the legacy semantics.
      AGENT_OPERATION_PROFILING_MODE: ${AGENT_OPERATION_PROFILING_MODE:-}
      # The tunnel, by the name both this container and the sandboxes resolve.
      # Overriding it with the gateway's real address is a mistake worth naming:
      # a sandbox reaches the gateway only through the tunnel attached to its
      # group bridge, so the runner refuses a relay given by address, or one it
      # cannot find on the relay network, before it claims anything.
      AGENT_GATEWAY_URL: http://${AGENT_GATEWAY_HOSTNAME:-agent-gateway}:${AGENT_TUNNEL_LISTEN_PORT:-8080}
      # The control plane the runner claims against — its own tunnel, not the
      # MCP one. They were the same relay until MCP moved to the control
      # plane's 8001 listener; the default was left pointing at it, which sent
      # every claim, registration and heartbeat to a listener that serves only
      # MCP. Jobs would simply never start, and the 404 names a path rather
      # than a port, so it reads as a routing bug in the control plane.
      AGENT_CONTROL_PLANE_URL: ${AGENT_CONTROL_PLANE_URL:-http://${AGENT_CONTROL_PLANE_HOSTNAME:-agent-control-plane}:${AGENT_CONTROL_PLANE_TUNNEL_LISTEN_PORT:-8000}}
      # The sandbox's second destination, handed down with its own token. A
      # separate name and port from the gateway's, so "may call models" and
      # "may call tools" stay two permissions rather than one.
      AGENT_SANDBOX_MCP_URL: http://${AGENT_MCP_HOSTNAME:-agent-mcp}:${AGENT_MCP_TUNNEL_LISTEN_PORT:-8000}
      # --- Enrolled host identity (required) ---
      # A one-time token, spent at first start for a lasting per-host
      # credential. Once that credential exists the runner claims with it and
      # the control plane reads the host from the credential rather than from
      # the request body. The token may then be removed from configuration.
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-}
      # Where that credential is kept. **On the persisted volume below**, not
      # in the container's own filesystem: a credential that dies with the
      # container spends a fresh enrollment token on every restart, and
      # enrollment tokens are single-use.
      AGENT_HOST_CREDENTIAL_FILE: ${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}/credential
      # The host script writes this exact commit only after every runner,
      # sandbox manager, tunnel and Docker storage check succeeds. The control-plane
      # deploy waits for the matching heartbeat before replacing its service.
      AGENT_DEPLOYMENT_SHA: ${AGENT_DEPLOYMENT_SHA:-}
      AGENT_SHARED_LIVE_READY_FILE: /run/cloud-agent/shared-live-ready
      # Turns at once until an admin sets a number on the Servers page.
      # At least two: shared native forks run a sibling beside its parent.
      AGENT_HOST_SLOTS: ${AGENT_HOST_SLOTS:-3}
      # How this runner reaches its own sandbox manager: a service name on this stack's
      # network, which is exactly right here and meaningless anywhere else.
      AGENT_SANDBOX_MANAGER_URL: http://sandbox-manager:8092
      # How the *control plane* reaches it, when that is somewhere else. This
      # is the address the runner reports at enrolment and the one stored on
      # the host row, so it has to be resolvable from the control plane's
      # machine — the far end of the reverse forward configured on
      # `control-plane-tunnel` above.
      #
      # Required by the supported standalone topology. Even on the same
      # physical machine, the control-plane stack does not share this Compose
      # network and cannot resolve `sandbox-manager`; the reverse forward is
      # its authenticated route back. A reported address with no tunnel behind
      # it is a 503 on every sandbox manager call.
      AGENT_SANDBOX_MANAGER_ADVERTISE_URL: ${AGENT_SANDBOX_MANAGER_ADVERTISE_URL:-${AGENT_WORKSPACE_BROKER_ADVERTISE_URL:-}}
      # Must match the sandbox manager service above. It is independent from the
      # enrollment-issued host credential used for heartbeat and claim.
      AGENT_SANDBOX_MANAGER_TOKEN: ${AGENT_SANDBOX_MANAGER_TOKEN:?a secret for this host's sandbox manager}

      # Every registered runtime has an exact pinned native-resume adapter;
      # the host advertises capability only after conformance.
      AGENT_RETAINED_DOCKER_DATA_ROOT: ${AGENT_RETAINED_DOCKER_DATA_ROOT:-/var/lib/docker}
      AGENT_SHARED_RESIDENT_CAPACITY: ${AGENT_SHARED_RESIDENT_CAPACITY:-8}
      AGENT_CHAT_IDLE_TIMEOUT_S: ${AGENT_CHAT_IDLE_TIMEOUT_S:-1800}
      # Largest first-turn checkout, in MiB, counting its Git objects as well
      # as its files. Spooled through this container's disk, not its memory.
      AGENT_SOURCE_IMPORT_MAX_MIB: ${AGENT_SOURCE_IMPORT_MAX_MIB:-1024}
      # Container sizes are bootstrap values; admin settings take over on heartbeat.
      AGENT_SANDBOX_CPU_MILLICORES: ${AGENT_SANDBOX_CPU_MILLICORES:-2000}
      AGENT_SANDBOX_MEMORY_MIB: ${AGENT_SANDBOX_MEMORY_MIB:-4096}
      AGENT_SANDBOX_DISK_MIB: ${AGENT_SANDBOX_DISK_MIB:-0}

      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-kata}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:?name the sandbox image this deployment runs}

      AGENT_GIT_AUTHOR_NAME: ${AGENT_GIT_AUTHOR_NAME:-}
      AGENT_GIT_AUTHOR_EMAIL: ${AGENT_GIT_AUTHOR_EMAIL:-}

      # --- The sandbox network (one, with nothing to select) ---
      # Where lifecycle finds the two relays. Sandboxes never join it; each
      # group's own bridge gets the relays attached under their aliases.
      AGENT_RELAY_NETWORK: ${AGENT_RELAY_NETWORK:-${COMPOSE_PROJECT:?the unique host Compose project}-agent-relays}
      # This deployment's RFC1918 pool, cut into one /29 per active group. No
      # default: two deployments on one machine must hold disjoint pools, and
      # the host rules refuse the later of two that overlap.
      AGENT_EGRESS_CHAT_NETWORK_POOL: ${AGENT_EGRESS_CHAT_NETWORK_POOL:?this deployment's own RFC1918 pool for group bridges}
      # The one IPv4 resolver a sandbox may reach, on TCP and UDP 53 — also
      # when it sits on a private address or on this host.
      AGENT_EGRESS_DNS_SERVER: ${AGENT_EGRESS_DNS_SERVER:?the one IPv4 resolver sandboxes may reach}
      # Extra IPv4 blocks to refuse on top of the built-in private and
      # special-purpose ones: an institution's public ranges, say. Only adds.
      AGENT_EGRESS_PROTECTED_CIDRS: ${AGENT_EGRESS_PROTECTED_CIDRS:-}
      AGENT_SANDBOX_NAMESPACE: ${COMPOSE_PROJECT:?the unique host Compose project}
      # Host capacity sampling: the machine's own CPU, memory and retained
      # container count, reported on the heartbeat the runner already sends.
      # Enabled unless an operator turns it off; a deployment that has not
      # mounted the proc files below reports the fields as missing rather than
      # failing, so the default costs nothing where it cannot work.
      AGENT_HOST_CAPACITY_ENABLED: ${AGENT_HOST_CAPACITY_ENABLED:-1}
      # Which storage probe measures the filesystem holding sandbox writable
      # layers. `overlay_root` reads this runner's own root filesystem, whose
      # upper layer sits on that disk; `off` disables the metric and is the
      # rollback. An unrecognized name reports "unsupported" rather than
      # measuring something else under the right label.
      AGENT_HOST_STORAGE_PROBE: ${AGENT_HOST_STORAGE_PROBE:-overlay_root}

      AGENT_LEASE_TTL: ${AGENT_LEASE_TTL:-120}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-3600}
      # Which machine this is, for the admin host switch. Filled in by
      # sandbox_host.sh from the host's own name — the whole reason a
      # second machine is worth adding is being able to select it.
      AGENT_RUNNER_HOST: ${AGENT_RUNNER_HOST:-}
      AGENT_PHYSICAL_HOST: ${AGENT_PHYSICAL_HOST:-}
    command:
      - python
      - -m
      - cloud_agent_host.runner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The host credential, and the lock enrollment is taken under. On the
      # machine, not in a container: an enrollment token is single-use, so a
      # credential that dies with the container needs a new token on every
      # restart. The lock is taken on this directory, so a replaced container
      # and its predecessor cannot both spend a token during a rollout.
      - ${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}:${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}
      # Host-wide Kata updates invalidate every deployment's cached probe.
      # Bind the directory so atomic epoch replacements remain visible. An
      # empty directory never qualifies a runtime: it requires full probes.
      - type: bind
        source: /var/lib/freeinference/kata-runtime
        target: /run/agent-kata-runtime
        read_only: true
        bind:
          create_host_path: true
      # The deploy user owns the readiness file; runners only read it. Keep it
      # separate from the container-owned enrollment directory. Refuse a missing
      # file instead of letting Docker create a root-owned directory in its place.
      - type: bind
        source: ../../.shared-live-ready
        target: /run/cloud-agent/shared-live-ready
        read_only: true
        bind:
          create_host_path: false
      # The deployment's verdict on which filesystem holds the sandbox writable
      # layers, and whether measuring it there is sound. `sandbox_host.sh`
      # writes it before `up` and refreshes it on every `check`; the runner
      # withholds a storage reading that no matching entry attests, because a
      # project quota and a small disk look identical from inside the
      # container. Bind the dedicated directory, not the file: deleting or
      # replacing verdict.json must be visible to already-running replicas.
      # The deployment creates this directory before up; nothing else from
      # the checkout is exposed, and the runner cannot write it.
      - type: bind
        source: ../../.storage-probe
        target: /run/cloud-agent/storage-probe
        read_only: true
        bind:
          create_host_path: false
      # The host machine's own load, as three named files and nothing more.
      #
      # **Not `/proc`, and not `pid: host`.** A container's `/proc/stat`
      # describes the container, so mounting the directory would produce a
      # number that looks like a machine and is not one; and a shared pid
      # namespace would hand this process — which sits beside untrusted
      # repository code — a view of every process on the host. Three read-only
      # files answer the only question asked here: how busy is the box, and how
      # much memory is left.
      #
      # `create_host_path: false` so a host without them fails loudly rather
      # than getting an empty file Docker invented. The collector treats a
      # missing file as a missing measurement and never falls back to reading
      # an unscoped `/proc`.
      - type: bind
        source: /proc/stat
        target: /run/host-metrics/stat
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /proc/meminfo
        target: /run/host-metrics/meminfo
        read_only: true
        bind:
          create_host_path: false
      # The boot id is what makes a reading provably this machine's: a restart
      # changes it, so a CPU delta spanning one is discarded instead of being
      # averaged across two different uptimes.
      - type: bind
        source: /proc/sys/kernel/random/boot_id
        target: /run/host-metrics/boot_id
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal
    depends_on:
      # Not the correctness barrier — the runner's live network probes are.
      # This only spares an operator the first crash-loop while a narrow
      # destination is still starting.
      gateway-tunnel:
        condition: service_started

networks:
  internal:
    # Local to this host. Nothing here talks to the gateway's compose network;
    # the tunnel is the only path off the machine.
    driver: bridge
  agent-relays:
    name: ${AGENT_RELAY_NETWORK:-${COMPOSE_PROJECT:?the unique host Compose project}-agent-relays}
    # Discovery only: the two relays, and never a sandbox. Group lifecycle reads
    # the relays' identities here and attaches them to each group's own bridge.
    # `internal` because nothing on it needs a route, and the runner refuses to
    # start if it has one.
    internal: true

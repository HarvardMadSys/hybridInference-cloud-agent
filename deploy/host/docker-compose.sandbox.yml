# Agent runners on a machine that is not the gateway's.
#
# Standalone, not an overlay on docker-compose.yml, and that is the point.
# `docker-compose.agent-runner.yml` declares `depends_on: backend`, so pointing
# it at a machine with no gateway does not fail — it *starts one*, along with
# whatever else the base file brings, on a box that was only ever meant to run
# jobs. This file contains exactly what a remote runner host needs: the
# runners, their workspace broker, one tunnel to the real gateway, and the two
# networks.
#
#   sandbox ─┐
#            ├─→ gateway-tunnel ──ssh──→ gateway host, 127.0.0.1:8080
#   runner  ─┘
#
# Both sides address the tunnel by the same name, because they have to: the
# runner claims over AGENT_GATEWAY_URL and the sandbox is handed that same
# value for its model calls. The alias resolves on both networks.
#
# Start it with deploy/host/sandbox_host.sh, which checks the pieces that
# fail confusingly when missing.

services:
  gateway-tunnel:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-gateway-tunnel
    restart: unless-stopped
    environment:
      # user@host of the gateway machine — the only address anything here can
      # reach through this container.
      TUNNEL_SSH_DESTINATION: ${AGENT_TUNNEL_SSH_DESTINATION:?user@gateway-host for the tunnel}
      TUNNEL_SSH_PORT: ${AGENT_TUNNEL_SSH_PORT:-22}
      # Where the gateway listens *on that machine*. Loopback by default, which
      # is the setup this design keeps intact: the gateway need not be exposed
      # to the network at all.
      TUNNEL_REMOTE_HOST: ${AGENT_TUNNEL_REMOTE_HOST:-127.0.0.1}
      TUNNEL_REMOTE_PORT: ${AGENT_TUNNEL_REMOTE_PORT:-8080}
      TUNNEL_LISTEN_PORT: ${AGENT_TUNNEL_LISTEN_PORT:-8080}
    volumes:
      # Read-only, and its own key: this one may open a single forwarded port
      # and nothing else. Restrict it on the gateway host's authorized_keys
      # with command="" plus permitopen — a shell on the gateway is not part of
      # what a runner host needs.
      - ${AGENT_TUNNEL_SSH_KEY:?path to the tunnel's ssh private key}:/etc/agent-tunnel/id:ro
      - ${AGENT_TUNNEL_SSH_KNOWN_HOSTS:?path to a known_hosts for the gateway host}:/etc/agent-tunnel/known_hosts:ro
    networks:
      # The alias is declared on BOTH networks, and it has to be. The runner is
      # only on `internal` and is handed AGENT_GATEWAY_URL pointing at
      # this name; the sandbox is only on the egress network and is handed the same
      # value. An alias on one network resolves for one of them and NXDOMAINs
      # for the other — which is what this file did until it was caught in
      # review, while the comment above already claimed both.
      internal:
        aliases:
          - ${AGENT_GATEWAY_HOSTNAME:-agent-gateway}
      # On the closed network too — that is the whole trick. The sandbox can
      # reach this container and nothing else, exactly as it reaches a local
      # gateway and nothing else.
      agent-egress:
        aliases:
          - ${AGENT_GATEWAY_HOSTNAME:-agent-gateway}

  # The second narrow destination. MCP moved to the cloud agent's own relay, so
  # a sandbox now needs two addresses and reaches nothing else: the gateway for
  # model calls, this for tools. Two tunnels rather than one wider one, because
  # "the sandbox may reach the control plane" is a much bigger permission than
  # "the sandbox may reach the MCP relay" — and the control plane is where jobs
  # are created and cancelled.
  mcp-tunnel:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-gateway-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_SSH_DESTINATION: ${AGENT_MCP_TUNNEL_SSH_DESTINATION:?user@control-plane-host for the MCP tunnel}
      TUNNEL_SSH_PORT: ${AGENT_MCP_TUNNEL_SSH_PORT:-22}
      # Where the control plane listens *on that machine*. Loopback by default,
      # for the same reason the gateway's is: the service need not be exposed
      # to the network at all.
      TUNNEL_REMOTE_HOST: ${AGENT_MCP_TUNNEL_REMOTE_HOST:-127.0.0.1}
      # **8001, the MCP-only listener — never 8000.** A sandbox reaches the far
      # end of this tunnel; 8000 serves jobs, sessions, host registration and
      # admin as well as the relay. Those refuse an `mcp`-scoped token, so
      # pointing here was not exploitable — it put the entire trusted control
      # plane one authorization bug away from untrusted code, which is a
      # reachability decision and should not rest on an authorization one.
      TUNNEL_REMOTE_PORT: ${AGENT_MCP_TUNNEL_REMOTE_PORT:-8001}
      TUNNEL_LISTEN_PORT: ${AGENT_MCP_TUNNEL_LISTEN_PORT:-8000}
    volumes:
      # Its own key, restricted the same way. A key that can open both tunnels
      # would make the separation above cosmetic.
      - ${AGENT_MCP_TUNNEL_SSH_KEY:?path to the MCP tunnel's ssh private key}:/etc/agent-tunnel/id:ro
      - ${AGENT_MCP_TUNNEL_SSH_KNOWN_HOSTS:?path to a known_hosts for the control-plane host}:/etc/agent-tunnel/known_hosts:ro
    networks:
      # On both, and aliased on both, for the same reason the gateway tunnel
      # is: the runner resolves this name on `internal` and the sandbox
      # on the egress network, and an alias declared on one NXDOMAINs on the other.
      internal:
        aliases:
          - ${AGENT_MCP_HOSTNAME:-agent-mcp}
      agent-egress:
        aliases:
          - ${AGENT_MCP_HOSTNAME:-agent-mcp}

  # The third destination, and the one no sandbox may reach. The runner claims
  # jobs, registers this host and heartbeats against the control plane's main
  # listener — the same 8000 the MCP tunnel deliberately stopped pointing at.
  #
  # **Not on the egress network, and that is the entire point.** Splitting the MCP
  # relay onto 8001 was worth nothing if a second alias put 8000 back on the
  # closed network under a different name. A sandbox reaches the gateway and
  # the MCP relay; the machine that runs it reaches the control plane; those
  # are three permissions and three tunnels.
  control-plane-tunnel:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-gateway-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_SSH_DESTINATION: ${AGENT_CONTROL_PLANE_TUNNEL_SSH_DESTINATION:?user@control-plane-host for the control-plane tunnel}
      TUNNEL_SSH_PORT: ${AGENT_CONTROL_PLANE_TUNNEL_SSH_PORT:-22}
      TUNNEL_REMOTE_HOST: ${AGENT_CONTROL_PLANE_TUNNEL_REMOTE_HOST:-127.0.0.1}
      # 8000 — jobs, host registration, sessions and admin. The listener the
      # MCP tunnel must never reach.
      TUNNEL_REMOTE_PORT: ${AGENT_CONTROL_PLANE_TUNNEL_REMOTE_PORT:-8000}
      TUNNEL_LISTEN_PORT: ${AGENT_CONTROL_PLANE_TUNNEL_LISTEN_PORT:-8000}
      # The way back, on this same connection. Unset on a co-located
      # deployment, where the control plane is already on the broker's network
      # and needs nothing; required when it is on another machine, because the
      # route is one-way — this host can open a connection to it, and it cannot
      # open one to this host.
      #
      # Without it every call that touches the broker (terminal suspend, file
      # listing, git status) reaches the control plane, which then tries to
      # resolve a compose service name that means nothing on its machine, and
      # answers 503. Jobs die at their first such call, every attempt, until
      # they run out. That is not hypothetical — it is what the first real job
      # on this deployment did, three times.
      #
      # Bind the far host's docker bridge gateway, not 0.0.0.0: the audience is
      # the containers on that bridge, and a broker published to the LAN is one
      # shared token away from anyone on it.
      TUNNEL_REVERSE_BIND: ${AGENT_BROKER_REVERSE_BIND:-}
      TUNNEL_REVERSE_PORT: ${AGENT_BROKER_REVERSE_PORT:-}
      TUNNEL_REVERSE_TARGET_HOST: ${AGENT_BROKER_REVERSE_TARGET_HOST:-workspace-broker}
      TUNNEL_REVERSE_TARGET_PORT: ${AGENT_BROKER_REVERSE_TARGET_PORT:-8092}
    volumes:
      # Its own key again. One key that opens both this and the MCP tunnel
      # would let anything holding it reach 8000 from the sandbox's side.
      - ${AGENT_CONTROL_PLANE_TUNNEL_SSH_KEY:?path to the control-plane tunnel's ssh private key}:/etc/agent-tunnel/id:ro
      - ${AGENT_CONTROL_PLANE_TUNNEL_SSH_KNOWN_HOSTS:?path to a known_hosts for the control-plane host}:/etc/agent-tunnel/known_hosts:ro
    networks:
      internal:
        aliases:
          - ${AGENT_CONTROL_PLANE_HOSTNAME:-agent-control-plane}

  workspace-broker:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-runner
    restart: unless-stopped
    environment:
      # Its own secret, never the dispatcher token. These two authorize
      # different things — the broker serves workspace files and terminals,
      # the dispatcher token claims jobs — and setting them to one value means
      # anything that reaches the broker's credential can also claim work as
      # this host. Required rather than defaulted for the same reason: a
      # fallback to the dispatcher token is the bug written as a default.
      AGENT_WORKSPACE_BROKER_TOKEN: ${AGENT_WORKSPACE_BROKER_TOKEN:?a secret for this host's workspace broker, distinct from AGENT_DISPATCHER_TOKEN}
      # Preview gate for the Docker-owned chat Session Supervisor. Keep the
      # legacy workspace routes active during rollout; turning this on adds
      # retained create/start/stop RPC without changing their public shapes.
      AGENT_RESTARTABLE_SANDBOX: ${AGENT_RESTARTABLE_SANDBOX:-0}
      AGENT_SHARED_LIVE_SANDBOX: ${AGENT_SHARED_LIVE_SANDBOX:-0}
      AGENT_SHARED_RESIDENT_CAPACITY: ${AGENT_SHARED_RESIDENT_CAPACITY:-8}
      # Daemon-side path, observed through `docker info`; it is deliberately
      # not mounted into this container. Production points Docker itself at a
      # durable block volume and sets this to that exact data-root.
      AGENT_RETAINED_DOCKER_DATA_ROOT: ${AGENT_RETAINED_DOCKER_DATA_ROOT:-/var/lib/docker}
      # Product inactivity timeout: after the latest settled turn (and after
      # all terminals close), docker stop retains the chat writable layer.
      # This is distinct from AGENT_TIMEOUT_S and the legacy residency lease.
      # The nested fallback keeps deployments using the preview-era
      # AGENT_SESSION_IDLE_TIMEOUT_S name working during the rename.
      AGENT_CHAT_IDLE_TIMEOUT_S: ${AGENT_CHAT_IDLE_TIMEOUT_S:-${AGENT_SESSION_IDLE_TIMEOUT_S:-1800}}
      # Fork can wake and native-resume a source without a runner turn.  The
      # broker therefore needs the same sandbox-reachable relay addresses the
      # runner hands to ordinary resident processes.
      AGENT_GATEWAY_URL: http://${AGENT_GATEWAY_HOSTNAME:-agent-gateway}:${AGENT_TUNNEL_LISTEN_PORT:-8080}
      AGENT_SANDBOX_MCP_URL: http://${AGENT_MCP_HOSTNAME:-agent-mcp}:${AGENT_MCP_TUNNEL_LISTEN_PORT:-8000}
      AGENT_WORKDIR_ROOT: ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-kata}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:?name the sandbox image this deployment runs}
      AGENT_EGRESS_NETWORK_PLATFORM_ONLY: ${AGENT_EGRESS_NETWORK_PLATFORM_ONLY:-agent-egress}
      AGENT_EGRESS_SETUP_TIER: ${AGENT_EGRESS_SETUP_TIER:-platform_only}
      AGENT_EGRESS_AGENT_TIER: ${AGENT_EGRESS_AGENT_TIER:-platform_only}
      AGENT_EGRESS_NETWORK_TRUSTED: ${AGENT_EGRESS_NETWORK_TRUSTED:-}
      AGENT_EGRESS_NETWORK_CUSTOM: ${AGENT_EGRESS_NETWORK_CUSTOM:-}
      AGENT_EGRESS_NETWORK_FULL: ${AGENT_EGRESS_NETWORK_FULL:-}
      AGENT_EGRESS_ALLOWLIST: ${AGENT_EGRESS_ALLOWLIST:-}
    command:
      - python
      - -m
      - cloud_agent_host.workspace_broker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}:${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
    networks:
      - internal

  runner:
    # How long docker waits after SIGTERM before SIGKILL, and therefore how
    # long a job gets to finish when this container is replaced. The runner
    # stops claiming on SIGTERM and exits after the job in hand.
    #
    # Bounded on purpose. A job may run up to AGENT_TIMEOUT_S (an hour by
    # default) and a deploy cannot wait that long, so past this the container
    # is killed, the lease expires and the control plane supersedes the
    # attempt — the behaviour every job through a deploy used to get, now
    # narrowed to the jobs that genuinely outlast the window.
    stop_grace_period: ${AGENT_RUNNER_STOP_GRACE:-5m}
    deploy:
      replicas: ${AGENT_RUNNER_REPLICAS:-3}
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-runner
    restart: unless-stopped
    environment:
      AGENT_RESTARTABLE_SANDBOX: ${AGENT_RESTARTABLE_SANDBOX:-0}
      AGENT_SHARED_LIVE_SANDBOX: ${AGENT_SHARED_LIVE_SANDBOX:-0}
      # The tunnel, by the name both this container and the sandboxes resolve.
      # Overriding it with the gateway's real address is a mistake worth naming:
      # the runner would reach it and the sandbox — on the closed network —
      # would not, so jobs would be claimed and then die at their first model
      # call.
      AGENT_GATEWAY_URL: http://${AGENT_GATEWAY_HOSTNAME:-agent-gateway}:${AGENT_TUNNEL_LISTEN_PORT:-8080}
      # The control plane the runner claims against — its own tunnel, not the
      # MCP one. They were the same relay until MCP moved to the control
      # plane's 8001 listener; the default was left pointing at it, which sent
      # every claim, registration and heartbeat to a listener that serves only
      # MCP. Jobs would simply never start, and the 404 names a path rather
      # than a port, so it reads as a routing bug in the control plane.
      AGENT_CONTROL_PLANE_URL: ${AGENT_CONTROL_PLANE_URL:-http://${AGENT_CONTROL_PLANE_HOSTNAME:-agent-control-plane}:${AGENT_CONTROL_PLANE_TUNNEL_LISTEN_PORT:-8000}}
      # The sandbox's second destination, handed down with its own token. A
      # separate name and port from the gateway's, so "may call models" and
      # "may call tools" stay two permissions rather than one.
      AGENT_SANDBOX_MCP_URL: http://${AGENT_MCP_HOSTNAME:-agent-mcp}:${AGENT_MCP_TUNNEL_LISTEN_PORT:-8000}
      AGENT_DISPATCHER_TOKEN: ${AGENT_DISPATCHER_TOKEN:?dispatcher credential is required}

      # --- Pool membership (optional; unset is the single-host shape) ---
      # A one-time token, spent at first start for a lasting per-host
      # credential. Once that credential exists the runner claims with it
      # instead of the dispatcher token above, and the control plane reads the
      # host from the credential rather than from the request body — which is
      # what makes drain, pin and revoke per-host decisions rather than
      # suggestions.
      #
      # Leave it unset and nothing enrolls: the runner behaves exactly as a
      # single-host deployment always has. That shape predates the pool and
      # stays supported.
      AGENT_ENROLL_TOKEN: ${AGENT_ENROLL_TOKEN:-}
      # Where that credential is kept. **On the persisted volume below**, not
      # in the container's own filesystem: a credential that dies with the
      # container spends a fresh enrollment token on every restart, and
      # enrollment tokens are single-use.
      AGENT_HOST_CREDENTIAL_FILE: ${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}/credential
      # Shared native forks require this to be explicitly set to at least 2.
      # Unset preserves the legacy host's unmetered scheduling behavior while
      # also preventing it from advertising shared-sandbox-v1 by accident.
      AGENT_HOST_SLOTS: ${AGENT_HOST_SLOTS:-}
      # How this runner reaches its own broker: a service name on this stack's
      # network, which is exactly right here and meaningless anywhere else.
      AGENT_WORKSPACE_BROKER_URL: http://workspace-broker:8092
      # How the *control plane* reaches it, when that is somewhere else. This
      # is the address the runner reports at enrolment and the one stored on
      # the host row, so it has to be resolvable from the control plane's
      # machine — the far end of the reverse forward configured on
      # `control-plane-tunnel` above.
      #
      # Unset on a co-located deployment: there the line above is already an
      # address the control plane can use, and reporting anything else would
      # break what works. Set it and the tunnel together or neither; a reported
      # address with no tunnel behind it is a 503 on every broker call.
      AGENT_WORKSPACE_BROKER_ADVERTISE_URL: ${AGENT_WORKSPACE_BROKER_ADVERTISE_URL:-}
      # Must match the broker service above, and must differ from the
      # dispatcher token beside it. Two credentials for two permissions.
      AGENT_WORKSPACE_BROKER_TOKEN: ${AGENT_WORKSPACE_BROKER_TOKEN:?a secret for this host's workspace broker, distinct from AGENT_DISPATCHER_TOKEN}

      # Retained/shared execution. The broker and runner must agree on the
      # gate. Every default runtime below has an exact pinned native-resume
      # adapter and the host advertises capability only after conformance.
      AGENT_RETAINED_DOCKER_DATA_ROOT: ${AGENT_RETAINED_DOCKER_DATA_ROOT:-/var/lib/docker}
      AGENT_RESTARTABLE_RUNTIMES: ${AGENT_RESTARTABLE_RUNTIMES:-claude-code,codex,pi,opencode,kilo}
      AGENT_SHARED_LIVE_RUNTIMES: ${AGENT_SHARED_LIVE_RUNTIMES:-claude-code,codex,pi,opencode,kilo}
      AGENT_SHARED_RESIDENT_CAPACITY: ${AGENT_SHARED_RESIDENT_CAPACITY:-8}
      AGENT_CHAT_IDLE_TIMEOUT_S: ${AGENT_CHAT_IDLE_TIMEOUT_S:-${AGENT_SESSION_IDLE_TIMEOUT_S:-1800}}

      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-kata}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:?name the sandbox image this deployment runs}

      AGENT_GIT_AUTHOR_NAME: ${AGENT_GIT_AUTHOR_NAME:-}
      AGENT_GIT_AUTHOR_EMAIL: ${AGENT_GIT_AUTHOR_EMAIL:-}

      AGENT_WORKDIR_ROOT: ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
      AGENT_WORKSPACE_TTL_S: ${AGENT_WORKSPACE_TTL_S:-604800}

      AGENT_EGRESS_NETWORK_PLATFORM_ONLY: ${AGENT_EGRESS_NETWORK_PLATFORM_ONLY:-agent-egress}
      AGENT_EGRESS_SETUP_TIER: ${AGENT_EGRESS_SETUP_TIER:-platform_only}
      AGENT_EGRESS_AGENT_TIER: ${AGENT_EGRESS_AGENT_TIER:-platform_only}
      AGENT_EGRESS_NETWORK_TRUSTED: ${AGENT_EGRESS_NETWORK_TRUSTED:-}
      AGENT_EGRESS_NETWORK_CUSTOM: ${AGENT_EGRESS_NETWORK_CUSTOM:-}
      AGENT_EGRESS_NETWORK_FULL: ${AGENT_EGRESS_NETWORK_FULL:-}
      AGENT_EGRESS_ALLOWLIST: ${AGENT_EGRESS_ALLOWLIST:-}

      AGENT_SNAPSHOT_ROOT: ${AGENT_SNAPSHOT_ROOT:-/var/lib/hybridinference/agent-snapshots}
      AGENT_SNAPSHOT_TTL_S: ${AGENT_SNAPSHOT_TTL_S:-604800}

      AGENT_LEASE_TTL: ${AGENT_LEASE_TTL:-120}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-3600}
      # Which machine this is, for the admin host switch. Filled in by
      # sandbox_host.sh from the host's own name — the whole reason a
      # second machine is worth adding is being able to select it.
      AGENT_RUNNER_HOST: ${AGENT_RUNNER_HOST:-}
    command:
      - python
      - -m
      - cloud_agent_host.runner
      - --loop
      - --workdir-root
      - ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}:${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
      - ${AGENT_SNAPSHOT_ROOT:-/var/lib/hybridinference/agent-snapshots}:${AGENT_SNAPSHOT_ROOT:-/var/lib/hybridinference/agent-snapshots}
      # The host credential, and the lock the replicas enroll under. On the
      # machine, not in a container: an enrollment token is single-use, so a
      # credential that dies with the container needs a new token on every
      # restart. Shared by all three replicas, which is also what makes the
      # lock work — it is taken on this directory.
      - ${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}:${AGENT_HOST_STATE_ROOT:-/var/lib/hybridinference/agent-host}
    networks:
      - internal
    depends_on:
      # Not a correctness barrier — the runner's own preflight is, and it fails
      # loudly if the tunnel is not up. This only spares an operator the first
      # crash-loop while the forward is still being established.
      - gateway-tunnel

networks:
  internal:
    # Local to this host. Nothing here talks to the gateway's compose network;
    # the tunnel is the only path off the machine.
    driver: bridge
  agent-egress:
    name: ${AGENT_EGRESS_NETWORK_PLATFORM_ONLY:-agent-egress}
    # No route to the outside world, exactly as on the gateway's own host. What
    # a sandbox can reach on it is the tunnel, and the tunnel goes one place.
    internal: true

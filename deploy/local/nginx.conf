map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream cloud_agent_api {
    server control-plane:8000;
}

upstream cloud_agent_web {
    server web:3000;
}

upstream local_gateway {
    server local-gateway:8080;
}

server {
    listen 8088;
    server_name _;

    # The browser and API deliberately share one origin so the HttpOnly
    # session cookie never needs cross-origin credentials or SameSite=None.
    location /api/ {
        proxy_pass http://cloud_agent_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /authorize {
        proxy_pass http://local_gateway;
        proxy_set_header Host $host;
    }

    location = /authorize/continue {
        proxy_pass http://local_gateway;
        proxy_set_header Host $host;
    }

    location ^~ /v1/identity/ {
        proxy_pass http://local_gateway;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://local_gateway;
    }

    location / {
        proxy_pass http://cloud_agent_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

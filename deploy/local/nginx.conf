map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Compose may replace a service container without replacing this edge. Resolve
# service names through Docker's embedded DNS continuously so a new container
# IP does not leave the browser on a stale 502 until nginx is restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream cloud_agent_api {
    zone cloud_agent_api 64k;
    server control-plane:8000 resolve;
}

upstream cloud_agent_web {
    zone cloud_agent_web 64k;
    server web:3000 resolve;
}

upstream local_gateway {
    zone local_gateway 64k;
    server local-gateway:8080 resolve;
}

server {
    listen 8088;
    server_name _;

    # The browser and API deliberately share one origin so the HttpOnly
    # session cookie never needs cross-origin credentials or SameSite=None.
    location /api/ {
        proxy_pass http://cloud_agent_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /authorize {
        proxy_pass http://local_gateway;
        proxy_set_header Host $host;
    }

    location = /authorize/continue {
        proxy_pass http://local_gateway;
        proxy_set_header Host $host;
    }

    location ^~ /v1/identity/ {
        proxy_pass http://local_gateway;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://local_gateway;
    }

    location / {
        proxy_pass http://cloud_agent_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

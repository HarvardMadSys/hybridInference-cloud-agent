services:
  control-plane:
    environment:
      AGENT_EGRESS_SETUP_TIER: platform_only
      AGENT_EGRESS_AGENT_TIER: platform_only
      # The production compose has an optional host-file mount for a GitHub
      # App key. Local development configures no App and replaces that target
      # with an unused Docker volume, keeping this topology free of host data
      # mappings.
      AGENT_GITHUB_APP_PRIVATE_KEY_PATH: ""
    volumes:
      - local-empty-github-key:/etc/cloud-agent/github-app.pem:ro

  # Local implementation of the gateway's HTTP contracts. It is reachable by
  # the control plane on its private network and by sandboxes on the closed
  # egress network; no port is published directly to the host.
  local-gateway:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.gateway
    restart: unless-stopped
    environment:
      LOCAL_GATEWAY_DISPATCH_TOKEN: ${GATEWAY_GRANT_DISPATCH_TOKEN:?generated by deploy/local/dev.sh}
      LOCAL_EDGE_PORT: ${LOCAL_EDGE_PORT:-13002}
      LOCAL_IDENTITY_ALLOWED_REDIRECTS: ${LOCAL_IDENTITY_ALLOWED_REDIRECTS:-}
      LOCAL_STACK_ID: ${LOCAL_PROJECT_NAME:-freeinference-local}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      control-plane:
        aliases: [local-gateway]
      agent-egress:
        aliases: [local-gateway]

  # One same-origin browser entrypoint: web, API, OAuth, SSE, and terminal
  # WebSockets all cross this edge. Only loopback is published.
  # Keep this name distinct from the optional profiled `edge` service in the
  # production control-plane file. Compose merges same-named services before
  # applying profiles; reusing `edge` here would inherit that profile, bind
  # mount, image and extra port and leave the default local stack unreachable.
  local-edge:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.edge
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_EDGE_PORT:-13002}:8088"
    depends_on:
      local-gateway:
        condition: service_healthy
      control-plane:
        condition: service_started
      web:
        condition: service_started
    networks: [control-plane]

  # A tiny read-only repository served over the private Docker network. The
  # trusted runner clones this; it is never exposed to the browser or sandbox.
  local-repo:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.repo
    restart: unless-stopped
    networks: [control-plane]

  # Re-open the generated one-time host token on each local stack start. The
  # lasting credential lives in the Docker volume below, so a normal restart
  # does not spend it again. These are generated local values, never production
  # credentials.
  local-bootstrap:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${AGENT_POSTGRES_USER:-cloudagent}
      PGPASSWORD: ${AGENT_POSTGRES_PASSWORD:?generated by deploy/local/dev.sh}
      PGDATABASE: ${AGENT_POSTGRES_DB:-cloudagent}
      LOCAL_ENROLL_TOKEN_SHA256: ${LOCAL_ENROLL_TOKEN_SHA256:?generated by deploy/local/dev.sh}
      AGENT_DEPLOYMENT_SHA: ${AGENT_DEPLOYMENT_SHA:?derived by deploy/local/dev.sh}
    command:
      - sh
      - -ec
      - >-
        psql -v ON_ERROR_STOP=1 -c "INSERT INTO agent_host_enroll_tokens
        (token_hash, host, issued_by, expires_at, consumed_at)
        VALUES ('$$LOCAL_ENROLL_TOKEN_SHA256', 'local-docker', 'local-bootstrap',
        NOW() + INTERVAL '365 days', NULL)
        ON CONFLICT (token_hash) DO UPDATE SET host = EXCLUDED.host,
        expires_at = EXCLUDED.expires_at, consumed_at = NULL" &&
        printf '%s\n' "$$AGENT_DEPLOYMENT_SHA" >
        /var/lib/freeinference/agent-host/shared-live-ready
    volumes:
      - local-host-state:/var/lib/freeinference/agent-host
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  workspace-broker:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-runner
    restart: unless-stopped
    command: ["python", "-m", "cloud_agent_host.workspace_broker"]
    environment: &host_environment
      AGENT_WORKSPACE_BROKER_TOKEN: ${AGENT_WORKSPACE_BROKER_TOKEN:?generated by deploy/local/dev.sh}
      AGENT_SHARED_RESIDENT_CAPACITY: "8"
      AGENT_RETAINED_DOCKER_DATA_ROOT: ${AGENT_RETAINED_DOCKER_DATA_ROOT:-/var/lib/docker}
      AGENT_CHAT_IDLE_TIMEOUT_S: ${LOCAL_CHAT_IDLE_TIMEOUT_S:-15}
      AGENT_GATEWAY_URL: http://local-gateway:8080
      AGENT_SANDBOX_MCP_URL: http://mcp-relay:8001
      AGENT_SANDBOX_BACKEND: container
      AGENT_SANDBOX_IMAGE: ${LOCAL_SANDBOX_IMAGE:?derived by deploy/local/dev.sh}
      AGENT_SANDBOX_NAMESPACE: ${LOCAL_PROJECT_NAME:-freeinference-local}
      AGENT_DEPLOYMENT_SHA: ${AGENT_DEPLOYMENT_SHA:?derived by deploy/local/dev.sh}
      AGENT_SHARED_LIVE_READY_FILE: /var/lib/freeinference/agent-host/shared-live-ready
      AGENT_EGRESS_NETWORK_PLATFORM_ONLY: ${LOCAL_AGENT_EGRESS_NETWORK:-freeinference-local-agent-egress}
      AGENT_EGRESS_CHAT_NETWORK_POOL: ${LOCAL_CHAT_NETWORK_POOL:-10.240.0.0/16}
      AGENT_EGRESS_SETUP_TIER: platform_only
      AGENT_EGRESS_AGENT_TIER: platform_only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control-plane]

  runner:
    build:
      context: ../..
      dockerfile: deploy/host/Dockerfile.agent-runner
    restart: unless-stopped
    command:
      - python
      - -m
      - cloud_agent_host.runner
    environment:
      <<: *host_environment
      AGENT_CONTROL_PLANE_URL: http://control-plane:8000
      AGENT_GATEWAY_URL: http://local-gateway:8080
      AGENT_SANDBOX_MCP_URL: http://mcp-relay:8001
      AGENT_ENROLL_TOKEN: ${LOCAL_ENROLL_TOKEN:?generated by deploy/local/dev.sh}
      AGENT_HOST_CREDENTIAL_FILE: /var/lib/freeinference/agent-host/credential
      AGENT_HOST_SLOTS: ${LOCAL_RUNNER_REPLICAS:-2}
      AGENT_RUNNER_REPLICAS: ${LOCAL_RUNNER_REPLICAS:-2}
      AGENT_RUNNER_HOST: local-docker
      AGENT_WORKER_ID: local-runner
      AGENT_WORKSPACE_BROKER_URL: http://workspace-broker:8092
      AGENT_WORKSPACE_BROKER_ADVERTISE_URL: http://workspace-broker:8092
      AGENT_REPO_CLONE_BASE_URL: git://local-repo
      AGENT_TIMEOUT_S: ${LOCAL_AGENT_TIMEOUT_S:-600}
      AGENT_LEASE_TTL: "120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - local-host-state:/var/lib/freeinference/agent-host
    depends_on:
      local-bootstrap:
        condition: service_completed_successfully
      local-gateway:
        condition: service_healthy
      local-repo:
        condition: service_started
      control-plane:
        condition: service_started
      workspace-broker:
        condition: service_started
    networks: [control-plane]

  # Build target only. Explicitly built by dev.sh before the services start;
  # the profile prevents a pointless long-running container for an image whose
  # consumers are spawned through the Docker socket.
  sandbox-image:
    profiles: [image]
    image: ${LOCAL_SANDBOX_IMAGE:?derived by deploy/local/dev.sh}
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile.agent-sandbox

  # The second fixed relay on the discovery backplane. Chat lifecycle copies
  # this endpoint and local-gateway onto each sandbox-private internal bridge.
  mcp-relay:
    networks:
      - control-plane
      - agent-egress

networks:
  agent-egress:
    name: ${LOCAL_AGENT_EGRESS_NETWORK:-freeinference-local-agent-egress}
    # Discovery only. `internal` removes an internet route but does not isolate
    # peers, so chat containers are never left together on this bridge.
    internal: true

volumes:
  local-empty-github-key:
  local-host-state:

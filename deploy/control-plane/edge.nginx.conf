# The edge for a deployment that owns its own hostname.
#
# Under the gateway's hostname the console proxies `/agents/api/*` to the
# control plane and `/agents/*` to the web app, and this file has no job. On a
# standalone hostname (agents.example.org) something still has to split one
# origin into the two services — the browser must reach the API at the same
# origin as the page, or the session cookie never travels — and that is all
# this does. No TLS: the tunnel or load balancer in front terminates it.
#
# `/api/` proxies with a trailing slash on purpose: nginx then strips the
# prefix, and the control plane keeps serving `/v1/...` at its root exactly as
# it does behind the console. Buffering is off and the read timeout long
# because the control plane streams events over SSE.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=5s ipv6=off;

upstream cloud_agent_api {
    zone cloud_agent_api 64k;
    server control-plane:8000 resolve;
}

upstream cloud_agent_web {
    zone cloud_agent_web 64k;
    server web:3000 resolve;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://cloud_agent_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;

        # A 5 MiB attachment is sent as base64 JSON (about 6.7 MiB).
        # Keep nginx's smaller default for other API requests.
        location /api/v1/agent/uploads {
            client_max_body_size 8m;
            proxy_pass http://cloud_agent_api/v1/agent/uploads;
        }
    }

    location / {
        proxy_pass http://cloud_agent_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

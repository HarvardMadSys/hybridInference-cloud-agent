# The control plane and its database — one machine, no runners.
#
# Runners live in `deploy/host/docker-compose.sandbox.yml` and are
# deliberately not here. They are a different trust tier (they execute
# untrusted code and mount a docker socket) and a different scaling unit; a
# single file that started both would make "add a runner host" mean "add a
# second control plane".
#
#   browser ──→ web / edge ──→ control-plane :8000 ──→ postgres
#
# Accounts, sessions and administration live in this deployment's own
# database. Models run on each owner's own model connections, reached from the
# sandboxes over public egress; this machine holds no provider key of its own.
#
# A new installation needs no env file: the `keys` service generates the
# deployment's keys into their own volume, and everything else is set from the
# web app (`/setup/administrator`, then Admin). Start it with `deploy.sh`, or by
# hand with:
#   AGENT_DEPLOYMENT_SHA=$(git rev-parse HEAD) \
#     docker compose -f deploy/control-plane/docker-compose.yml up -d
# ENVIRONMENT.md lists the optional overrides; `docs/developer/smoke.md` walks
# through a first run.

services:
  # Runs to completion before anything that needs a key. It stores each
  # deployment key the environment sets, keeps the stored ones, and generates
  # the missing ones only while the bundled database volume holds no database
  # (apps/backend/cloud_agent/deployment/deployment_keys.py). Root, to give
  # each file to the one user that reads it, but with no network and only the
  # capabilities that needs.
  keys:
    # The one service that builds the control-plane image; migrate, the API and
    # both relays run that same image and never build or pull it. Five builds
    # would be five images: Compose labels each with its service, so the API and
    # the MCP relay would differ, and automatic Server setup refuses a control
    # plane whose two listeners do not run one image. It is this service because
    # everything else depends on it, so any `up` builds it first. The project
    # name keeps two stacks on one machine from sharing a tag, and the commit
    # keeps an image built for another one from being started as this one.
    image: ${COMPOSE_PROJECT_NAME}-control-plane:${AGENT_DEPLOYMENT_SHA:-unknown}
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
      args:
        SOURCE_COMMIT: ${AGENT_DEPLOYMENT_SHA:-unknown}
    entrypoint: ["python", "-m", "cloud_agent.deployment.deployment_keys"]
    command: ["prepare"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      AGENT_POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-}
      AGENT_POSTGRES_USER: ${AGENT_POSTGRES_USER:-cloudagent}
      AGENT_POSTGRES_DB: ${AGENT_POSTGRES_DB:-cloudagent}
      AGENT_LOCAL_SESSION_SECRET: ${AGENT_LOCAL_SESSION_SECRET:-}
      AGENT_SETTINGS_ENCRYPTION_KEY: ${AGENT_SETTINGS_ENCRYPTION_KEY:-}
      AGENT_SESSION_SECRET: ${AGENT_SESSION_SECRET:-}
    volumes:
      - agent-keys:/run/cloud-agent/keys
      - agent-postgres:/run/cloud-agent/database:ro
    restart: "no"

  # Runs to completion before the API is allowed to start. Alembic owns the
  # schema — the service creates no tables at startup — so an API container
  # racing an unmigrated database is not a slow start, it is a crash loop
  # against tables that do not exist.
  migrate:
    # The image `keys` builds; see there.
    image: ${COMPOSE_PROJECT_NAME}-control-plane:${AGENT_DEPLOYMENT_SHA:-unknown}
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
    volumes:
      - agent-keys:/run/cloud-agent/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [control-plane]

  control-plane:
    # The image `keys` builds; see there.
    image: ${COMPOSE_PROJECT_NAME}-control-plane:${AGENT_DEPLOYMENT_SHA:-unknown}
    pull_policy: never
    restart: unless-stopped
    labels:
      io.hybridinference.deployment.sha: ${AGENT_DEPLOYMENT_SHA:?exact commit this control plane serves}
    ports:
      # Loopback by default. This service terminates no TLS and authenticates
      # sessions with a cookie; putting it on a public interface without a
      # proxy in front would serve that cookie over plain HTTP.
      - "${AGENT_CONTROL_PLANE_BIND:-127.0.0.1}:${AGENT_CONTROL_PLANE_PORT:-8000}:8000"
    environment:
      # Optional pgAdmin service, reached only through the admin-checked API.
      AGENT_PGADMIN_URL: ${AGENT_PGADMIN_URL:-}
      AGENT_PGADMIN_PUBLIC_URL: ${AGENT_PGADMIN_PUBLIC_URL:-}
      AGENT_PGADMIN_BOOTSTRAP_DIR: ${AGENT_PGADMIN_BOOTSTRAP_DIR:-}
      AGENT_PGADMIN_BOOTSTRAP_URL: ${AGENT_PGADMIN_BOOTSTRAP_URL:-}
      AGENT_PGADMIN_BOOTSTRAP_PUBLIC_URL: ${AGENT_PGADMIN_BOOTSTRAP_PUBLIC_URL:-}
      # Where the admin Settings page looks up each agent's latest release.
      # Empty means the public npm registry; hosts download from the same one.
      AGENT_RUNTIME_REGISTRY_URL: ${AGENT_RUNTIME_REGISTRY_URL:-}
      # --- Database ---------------------------------------------------------
      # A database this service owns outright, holding its accounts too.
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}

      # --- Public addresses -------------------------------------------------
      # This API's public address, such as https://agents.example.org/api.
      # MCP sign-in callbacks and compute node registration are built from it
      # unless they have their own address.
      AGENT_PUBLIC_API_URL: ${AGENT_PUBLIC_API_URL:-}
      # The web app's public origin, e.g. https://agents.example.org. Account
      # mail links (verification, password reset, email change) are built
      # from it alone.
      AGENT_WEB_BASE_URL: ${AGENT_WEB_BASE_URL:-}

      # --- This service's own secrets ---------------------------------------
      # Legacy values are imported once. Missing runtime keys are configured
      # through administrator setup; no service uses a default signing secret.
      # AGENT_SESSION_SECRET is only the fallback root for encrypted settings
      # where AGENT_SETTINGS_ENCRYPTION_KEY is unset.
      AGENT_SESSION_SECRET: ${AGENT_SESSION_SECRET:-}
      AGENT_SETTINGS_ENCRYPTION_KEY: ${AGENT_SETTINGS_ENCRYPTION_KEY:-}
      AGENT_CONTROL_TOKEN_SECRET: ${AGENT_CONTROL_TOKEN_SECRET:-}
      AGENT_SOURCE_CONTROL_ENCRYPTION_KEY: ${AGENT_SOURCE_CONTROL_ENCRYPTION_KEY:-}
      # --- Accounts ----------------------------------------------------------
      # The key every session, emailed token and abuse counter is hashed under.
      # Required: at least 32 bytes, and different from AGENT_SESSION_SECRET.
      AGENT_LOCAL_SESSION_SECRET: ${AGENT_LOCAL_SESSION_SECRET:-}
      AGENT_LOCAL_SIGNUP_ENABLED: ${AGENT_LOCAL_SIGNUP_ENABLED:-true}
      AGENT_SMTP_HOST: ${AGENT_SMTP_HOST:-}
      AGENT_SMTP_PORT: ${AGENT_SMTP_PORT:-}
      AGENT_SMTP_SECURITY: ${AGENT_SMTP_SECURITY:-starttls}
      AGENT_SMTP_USERNAME: ${AGENT_SMTP_USERNAME:-}
      AGENT_SMTP_PASSWORD: ${AGENT_SMTP_PASSWORD:-}
      AGENT_SMTP_FROM: ${AGENT_SMTP_FROM:-}
      # Initial values of Admin → Settings → Accounts, imported once.
      AGENT_LOCAL_SIGNUP_REQUIRE_EMAIL_VERIFICATION: ${AGENT_LOCAL_SIGNUP_REQUIRE_EMAIL_VERIFICATION:-true}
      AGENT_LOCAL_SIGNUP_APPROVAL: ${AGENT_LOCAL_SIGNUP_APPROVAL:-manual}
      AGENT_LOCAL_SIGNUP_ADMIN_NOTIFY: ${AGENT_LOCAL_SIGNUP_ADMIN_NOTIFY:-true}
      AGENT_LOCAL_SIGNUP_NOTIFY_EMAILS: ${AGENT_LOCAL_SIGNUP_NOTIFY_EMAILS:-}
      AGENT_LOCAL_TERMS_URL: ${AGENT_LOCAL_TERMS_URL:-}
      AGENT_LOCAL_SMS_ENABLED: ${AGENT_LOCAL_SMS_ENABLED:-false}
      AGENT_LOCAL_SMS_PROVIDER: ${AGENT_LOCAL_SMS_PROVIDER:-none}
      AGENT_LOCAL_SMS_DEFAULT_COUNTRY_CODE: ${AGENT_LOCAL_SMS_DEFAULT_COUNTRY_CODE:-}
      AGENT_LOCAL_SMS_ALLOWED_PREFIXES: ${AGENT_LOCAL_SMS_ALLOWED_PREFIXES:-}
      AGENT_TENCENT_CLOUD_SECRET_ID: ${AGENT_TENCENT_CLOUD_SECRET_ID:-}
      AGENT_TENCENT_CLOUD_SECRET_KEY: ${AGENT_TENCENT_CLOUD_SECRET_KEY:-}
      AGENT_TENCENT_CLOUD_TOKEN: ${AGENT_TENCENT_CLOUD_TOKEN:-}
      AGENT_TENCENT_SMS_REGION: ${AGENT_TENCENT_SMS_REGION:-ap-guangzhou}
      AGENT_TENCENT_SMS_SDK_APP_ID: ${AGENT_TENCENT_SMS_SDK_APP_ID:-}
      AGENT_TENCENT_SMS_SIGN_NAME: ${AGENT_TENCENT_SMS_SIGN_NAME:-}
      AGENT_TENCENT_SMS_TEMPLATE_ID: ${AGENT_TENCENT_SMS_TEMPLATE_ID:-}
      AGENT_TURNSTILE_SITE_KEY: ${AGENT_TURNSTILE_SITE_KEY:-}
      AGENT_TURNSTILE_SECRET_KEY: ${AGENT_TURNSTILE_SECRET_KEY:-}
      AGENT_LOCAL_ADMIN_EMAILS: ${AGENT_LOCAL_ADMIN_EMAILS:-}
      AGENT_LOCAL_TERMS_TEXT: ${AGENT_LOCAL_TERMS_TEXT:-}
      AGENT_LOCAL_SESSION_TTL_DAYS: ${AGENT_LOCAL_SESSION_TTL_DAYS:-30}
      AGENT_LOCAL_LOGIN_RATE_LIMIT_PER_15MIN: ${AGENT_LOCAL_LOGIN_RATE_LIMIT_PER_15MIN:-5}
      AGENT_LOCAL_LOGIN_ACCOUNT_RATE_LIMIT_PER_15MIN: ${AGENT_LOCAL_LOGIN_ACCOUNT_RATE_LIMIT_PER_15MIN:-50}
      AGENT_LOCAL_LOGIN_RATE_LIMIT_PER_HOUR_PER_IP: ${AGENT_LOCAL_LOGIN_RATE_LIMIT_PER_HOUR_PER_IP:-20}
      AGENT_LOCAL_SIGNUP_RATE_LIMIT_PER_HOUR: ${AGENT_LOCAL_SIGNUP_RATE_LIMIT_PER_HOUR:-5}
      AGENT_LOCAL_SIGNUP_RATE_LIMIT_PER_DAY: ${AGENT_LOCAL_SIGNUP_RATE_LIMIT_PER_DAY:-10}
      AGENT_LOCAL_SIGNUP_REQUIRE_RESOLVED_CLIENT_IP: ${AGENT_LOCAL_SIGNUP_REQUIRE_RESOLVED_CLIENT_IP:-false}
      AGENT_LOCAL_UNRESOLVED_SIGNUP_RATE_LIMIT_PER_HOUR: ${AGENT_LOCAL_UNRESOLVED_SIGNUP_RATE_LIMIT_PER_HOUR:-5}
      AGENT_LOCAL_UNRESOLVED_SIGNUP_RATE_LIMIT_PER_DAY: ${AGENT_LOCAL_UNRESOLVED_SIGNUP_RATE_LIMIT_PER_DAY:-10}
      AGENT_LOCAL_EMAIL_PROVIDER: ${AGENT_LOCAL_EMAIL_PROVIDER:-smtp}
      AGENT_TENCENT_SES_REGION: ${AGENT_TENCENT_SES_REGION:-ap-guangzhou}
      AGENT_TENCENT_SES_FROM_EMAIL: ${AGENT_TENCENT_SES_FROM_EMAIL:-}
      AGENT_TENCENT_SES_FROM_NAME: ${AGENT_TENCENT_SES_FROM_NAME:-}
      AGENT_TENCENT_SES_TEMPLATE_VERIFICATION: ${AGENT_TENCENT_SES_TEMPLATE_VERIFICATION:-0}
      AGENT_TENCENT_SES_TEMPLATE_PASSWORD_RESET: ${AGENT_TENCENT_SES_TEMPLATE_PASSWORD_RESET:-0}
      AGENT_TENCENT_SES_TEMPLATE_APPROVAL: ${AGENT_TENCENT_SES_TEMPLATE_APPROVAL:-0}
      AGENT_TENCENT_SES_TEMPLATE_REJECTION: ${AGENT_TENCENT_SES_TEMPLATE_REJECTION:-0}
      AGENT_TENCENT_SES_TEMPLATE_ADMIN_SIGNUP: ${AGENT_TENCENT_SES_TEMPLATE_ADMIN_SIGNUP:-0}
      AGENT_TENCENT_SES_TEMPLATE_NOTICE: ${AGENT_TENCENT_SES_TEMPLATE_NOTICE:-0}
      # The blocks the hosts add to the sandbox's protected space. Checking an
      # owner's SSH server refuses an address in them, as the sandbox would.
      AGENT_EGRESS_PROTECTED_CIDRS: ${AGENT_EGRESS_PROTECTED_CIDRS:-}
      # The API enforces the same exact host-generation capability as the
      # deploy gate. Without this, a pending runner could claim queued work
      # while deploy.sh correctly refused to replace the old API.
      AGENT_DEPLOYMENT_SHA: ${AGENT_DEPLOYMENT_SHA:?exact commit this control plane serves}
      # Editable first-time Server setup defaults. The deployer supplies the
      # physical node's SSH hostname; a container hostname is not an SSH target.
      AGENT_CONTROL_PLANE_SSH_HOST: ${AGENT_CONTROL_PLANE_SSH_HOST:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Imported once into admin Settings; subsequent changes are made there.
      AGENT_WEB_APP_NAME: ${AGENT_WEB_APP_NAME:-}
      AGENT_WEB_ORG_NAME: ${AGENT_WEB_ORG_NAME:-}
      AGENT_WEB_ORG_URL: ${AGENT_WEB_ORG_URL:-}
      AGENT_WEB_STATUS_URL: ${AGENT_WEB_STATUS_URL:-}
      AGENT_WEB_DOCS_URL: ${AGENT_WEB_DOCS_URL:-}
      AGENT_WEB_CONTACT_URL: ${AGENT_WEB_CONTACT_URL:-}
      # Optional compute management runs only on this stable main listener.
      # Mount the operator configuration using docker-compose.compute.yml.
      AGENT_COMPUTE_CONFIG: ${AGENT_COMPUTE_CONFIG:-}
      AGENT_COMPUTE_SECRET_KEY: ${AGENT_COMPUTE_SECRET_KEY:-}
      AGENT_CLOUDLAB_API_URL: ${AGENT_CLOUDLAB_API_URL:-}
      # Imported once; blank derives it from AGENT_PUBLIC_API_URL.
      AGENT_COMPUTE_REGISTRATION_URL: ${AGENT_COMPUTE_REGISTRATION_URL:-}
      # Where automatic setup finds the sandbox image a release published.
      # Unset keeps the default; an explicit empty value turns the lookup off.
      AGENT_COMPUTE_SANDBOX_IMAGE_REPOSITORY: ${AGENT_COMPUTE_SANDBOX_IMAGE_REPOSITORY-ghcr.io/harvardmadsys/cloud-agent-sandbox}
      # How long a member-scoped resident credential lives between runner
      # heartbeats. Chat inactivity is a separate group clock on the host
      # (AGENT_CHAT_IDLE_TIMEOUT_S); refreshing this lease does not keep an
      # otherwise idle container running.
      AGENT_RESIDENCY_TTL_S: ${AGENT_RESIDENCY_TTL_S:-1800}

      # --- Sandbox deletion archives ---------------------------------------
      # Imported once; subsequent bucket/endpoint changes use Admin Settings.
      AGENT_SANDBOX_ARCHIVE_S3_BUCKET: ${AGENT_SANDBOX_ARCHIVE_S3_BUCKET:-}
      AGENT_SANDBOX_ARCHIVE_S3_REGION: ${AGENT_SANDBOX_ARCHIVE_S3_REGION:-}
      AGENT_SANDBOX_ARCHIVE_S3_ENDPOINT: ${AGENT_SANDBOX_ARCHIVE_S3_ENDPOINT:-}
      AGENT_SANDBOX_ARCHIVE_S3_PREFIX: ${AGENT_SANDBOX_ARCHIVE_S3_PREFIX:-sandbox-archives}
      # The standard SDK credential chain prefers an IAM workload role.
      # Configure environment or shared-profile credentials in a private
      # main-service override; never add them to hosts, sandboxes or MCP relay.

      # --- Behaviour switches ----------------------------------------------
      # Both default to the safe answer, so an operator who sets neither gets a
      # Secure cookie and an audit trail that records the peer rather than a
      # header the caller chose.
      AGENT_SESSION_COOKIE_SECURE: ${AGENT_SESSION_COOKIE_SECURE:-true}
      AGENT_TRUST_PROXY_HEADERS: ${AGENT_TRUST_PROXY_HEADERS:-false}
      # Serves the API schema and its docs pages on the main listener; for
      # development only. The MCP-only listener never serves them.
      AGENT_API_DOCS: ${AGENT_API_DOCS:-false}
      # Live-update streams one account may hold open on this process.
      AGENT_MAX_STREAMS_PER_USER: ${AGENT_MAX_STREAMS_PER_USER:-24}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_LOG_FORMAT: ${AGENT_LOG_FORMAT:-text}
      # Opt-in operation profiling. All three values are inert by default;
      # they are explicit here because Compose does not otherwise pass a
      # shell/.env value into the container.
      AGENT_OPERATION_PROFILING_ENABLED: ${AGENT_OPERATION_PROFILING_ENABLED:-false}
      AGENT_OPERATION_PROFILING_RUN: ${AGENT_OPERATION_PROFILING_RUN:-}
      AGENT_OPERATION_PROFILING_SINK: ${AGENT_OPERATION_PROFILING_SINK:-}
      # Who may control collection at runtime. Unset keeps the legacy
      # ENABLED/RUN semantics exactly; `admin` is what makes the Admin page's
      # Start and Stop take effect without a redeploy, and it is the only mode
      # in which the control row below is consulted.
      AGENT_OPERATION_PROFILING_MODE: ${AGENT_OPERATION_PROFILING_MODE:-}
      # Which deployment's control row this process commands. Two deployments
      # sharing one database must not be able to see or stop each other's
      # experiment, so each names itself.
      AGENT_OPERATION_PROFILING_DEPLOYMENT: ${AGENT_OPERATION_PROFILING_DEPLOYMENT:-default}
      AGENT_ALERT_WEBHOOK_URL: ${AGENT_ALERT_WEBHOOK_URL:-}
      AGENT_DEFAULT_EXECUTION_PROFILE: ${AGENT_DEFAULT_EXECUTION_PROFILE:-untrusted-kata-v1}
      # --- Source control ---------------------------------------------------
      AGENT_REPO_ALLOWLIST: ${AGENT_REPO_ALLOWLIST:-}
      # The GitHub App and GitLab OAuth behind Integrations. Optional as a
      # group: a deployment that configures neither simply offers no
      # connections.
      AGENT_GITHUB_API: ${AGENT_GITHUB_API:-https://api.github.com}
      AGENT_GITHUB_APP_ID: ${AGENT_GITHUB_APP_ID:-}
      AGENT_GITHUB_APP_CLIENT_ID: ${AGENT_GITHUB_APP_CLIENT_ID:-}
      AGENT_GITHUB_APP_CLIENT_SECRET: ${AGENT_GITHUB_APP_CLIENT_SECRET:-}
      AGENT_GITHUB_APP_INSTALL_URL: ${AGENT_GITHUB_APP_INSTALL_URL:-}
      AGENT_GITHUB_COAUTHOR: ${AGENT_GITHUB_COAUTHOR:-}
      # Prefer the path form. A private key in an environment variable is
      # readable by anything that can list the process environment, and lands
      # in `docker inspect`, crash dumps and most log shippers.
      AGENT_GITHUB_APP_PRIVATE_KEY_PATH: ${AGENT_GITHUB_APP_PRIVATE_KEY_PATH:-/etc/cloud-agent/github-app.pem}
      AGENT_GITLAB_OAUTH_CLIENT_ID: ${AGENT_GITLAB_OAUTH_CLIENT_ID:-}
      AGENT_GITLAB_OAUTH_CLIENT_SECRET: ${AGENT_GITLAB_OAUTH_CLIENT_SECRET:-}
      AGENT_GITLAB_OAUTH_REDIRECT_URI: ${AGENT_GITLAB_OAUTH_REDIRECT_URI:-}

      # --- MCP --------------------------------------------------------------
      # There is no registry variable here any more: a deployment-configured
      # server list is the team-MCP feature this product does not offer, and
      # its credentials were one identity shared by every user who could create
      # a job. The relay serves the per-user connections that replaced it.
      #
      # Nor is there a relay address. A sandbox reaches the relay through its
      # host's own MCP tunnel, and each host hands its sandboxes that address
      # itself: the one its network rules admit.

      # The browser-facing address this service builds OAuth callbacks from.
      # Configured rather than derived from the request: a redirect URI is
      # registered with the authorization server in advance, so a value taken
      # from whatever host a request arrived on would differ per proxy and fail
      # that registration. Unset means a connection can still use a static
      # credential, and only the browser flow is refused.
      # Optional override; otherwise MCP uses AGENT_PUBLIC_API_URL.
      AGENT_MCP_PUBLIC_BASE_URL: ${AGENT_MCP_PUBLIC_BASE_URL:-}
      # Optional legacy import; configure the managed app in Admin Settings.
      AGENT_MCP_GITHUB_CLIENT_ID: ${AGENT_MCP_GITHUB_CLIENT_ID:-}
      AGENT_MCP_GITHUB_CLIENT_SECRET: ${AGENT_MCP_GITHUB_CLIENT_SECRET:-}

      # Both widen what a user-added MCP connection may dial, and both are off
      # by default. A private address may be this service itself; plain HTTP
      # would put the credential on the wire in the clear. They are separate
      # variables because they are separate risks.
      AGENT_MCP_ALLOW_PRIVATE_TARGETS: ${AGENT_MCP_ALLOW_PRIVATE_TARGETS:-}
      AGENT_MCP_ALLOW_PLAIN_HTTP: ${AGENT_MCP_ALLOW_PLAIN_HTTP:-}
      # Owners' own model connections, the only inference source. On unless
      # set to false for maintenance, which stops every new turn.
      AGENT_MODEL_CONNECTIONS_ENABLED: ${AGENT_MODEL_CONNECTIONS_ENABLED:-}

      # --- Workspaces -------------------------------------------------------
      # Authorizes this service to the hosts' sandbox managers. Per-host
      # sandbox manager addresses come from each host's registration row, not from here.
      # COMPAT(remove-after=2026-12-31): no control plane's .env sets
      # AGENT_WORKSPACE_BROKER_TOKEN; check each deploy root's .env.
      AGENT_SANDBOX_MANAGER_TOKEN: ${AGENT_SANDBOX_MANAGER_TOKEN:-${AGENT_WORKSPACE_BROKER_TOKEN:-}}
      # Which hosts a registering machine may name as its sandbox manager. The token
      # above is shared across the pool, so an address accepted at
      # registration is an address that receives a credential good for every
      # sandbox manager in it. Unset means any host, which is what this did before the
      # check existed — a multi-host pool should name its machines here.
      # COMPAT(remove-after=2026-12-31): no control plane's .env sets
      # AGENT_BROKER_URL_ALLOWED_HOSTS; check each deploy root's .env.
      AGENT_SANDBOX_MANAGER_URL_ALLOWED_HOSTS: ${AGENT_SANDBOX_MANAGER_URL_ALLOWED_HOSTS:-${AGENT_BROKER_URL_ALLOWED_HOSTS:-}}
    volumes:
      - agent-keys:/run/cloud-agent/keys:ro
      - agent-pgadmin-bootstrap:/var/lib/cloud-agent/pgadmin-bootstrap
      # The GitHub App key, read-only, as a file. `AGENT_GITHUB_APP_PRIVATE_KEY_PATH`
      # names a path *inside* this container, so setting it without mounting
      # anything produces a service that starts, offers Integrations, and fails
      # at the first publish. Points at /dev/null when unconfigured so the
      # stack still renders without a key.
      - ${AGENT_GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/etc/cloud-agent/github-app.pem:ro
      # The deployment's own public content, read-only: Terms of Service, the
      # Team page and the source link, kept in the deployment's repository
      # (apps/backend/cloud_agent/deployment/site_content.py lists the files). The
      # recipe's default directory holds none, which configures none of them.
      - ${AGENT_SITE_CONTENT_DIR:-./site-content}:/etc/cloud-agent/site:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  # The one surface a sandbox may reach. Same image, same database, same
  # lifespan — a second listener rather than a second service.
  #
  # It exists because the sandbox's tunnel has to terminate *somewhere*, and
  # terminating it on the control plane's own port put jobs, sessions, host
  # registration and admin one authorization bug away from code nobody here
  # wrote. Those routes all refuse an `mcp`-scoped token; this application
  # simply does not contain them, which is the difference between a policy and
  # a fact.
  mcp-relay:
    # The image `keys` builds; see there.
    image: ${COMPOSE_PROJECT_NAME}-control-plane:${AGENT_DEPLOYMENT_SHA:-unknown}
    pull_policy: never
    command:
      - uvicorn
      - cloud_agent.app:create_mcp_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
    restart: unless-stopped
    ports:
      # Loopback. The remote host's tunnel forwards to this, and nothing else
      # should be able to.
      - "${AGENT_MCP_RELAY_BIND:-127.0.0.1}:${AGENT_MCP_RELAY_PORT:-8001}:8001"
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      # Both listeners decrypt the shared admin settings using the same key.
      AGENT_SESSION_SECRET: ${AGENT_SESSION_SECRET:-}
      # The relay answers owner identity the same way the main API does.
      AGENT_LOCAL_SESSION_SECRET: ${AGENT_LOCAL_SESSION_SECRET:-}
      AGENT_SETTINGS_ENCRYPTION_KEY: ${AGENT_SETTINGS_ENCRYPTION_KEY:-}
      AGENT_CONTROL_TOKEN_SECRET: ${AGENT_CONTROL_TOKEN_SECRET:-}
      # The relay resolves each owner's stored MCP connection and therefore
      # must decrypt it under the same key/domain as the main control-plane
      # listener. Without this, health stays green but every connected server
      # is reported as unavailable at the first tool call.
      AGENT_SOURCE_CONTROL_ENCRYPTION_KEY: ${AGENT_SOURCE_CONTROL_ENCRYPTION_KEY:-}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_LOG_FORMAT: ${AGENT_LOG_FORMAT:-text}
    volumes:
      - agent-keys:/run/cloud-agent/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  # The GitHub relay: git and gh in a sandbox reach GitHub as the
  # conversation's owner, without the owner's token ever entering a sandbox.
  # Same image, database and lifespan, a third listener holding nothing but the
  # relay's catch-all route (`create_github_relay_app`).
  #
  # It terminates TLS for github.com and api.github.com with a certificate
  # this deployment's own CA signs (deploy/control-plane/github-relay-certs.sh);
  # sandboxes trust that CA for those two names only. Behind a profile:
  # `COMPOSE_PROFILES=github-relay` turns it on, together with the host's
  # github-tunnel and AGENT_SANDBOX_GITHUB_RELAY_CA_FILE.
  github-relay:
    profiles: [github-relay]
    # The image `keys` builds; see there.
    image: ${COMPOSE_PROJECT_NAME}-control-plane:${AGENT_DEPLOYMENT_SHA:-unknown}
    pull_policy: never
    command:
      - uvicorn
      - cloud_agent.app:create_github_relay_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8443"
      - --ssl-certfile
      - /etc/cloud-agent/github-relay/relay.pem
      - --ssl-keyfile
      - /etc/cloud-agent/github-relay/relay.key
    restart: unless-stopped
    ports:
      # Loopback, like the MCP relay: only the hosts' github-tunnel reaches it.
      - "${AGENT_GITHUB_RELAY_BIND:-127.0.0.1}:${AGENT_GITHUB_RELAY_PORT:-8443}:8443"
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      AGENT_SESSION_SECRET: ${AGENT_SESSION_SECRET:-}
      AGENT_LOCAL_SESSION_SECRET: ${AGENT_LOCAL_SESSION_SECRET:-}
      AGENT_SETTINGS_ENCRYPTION_KEY: ${AGENT_SETTINGS_ENCRYPTION_KEY:-}
      AGENT_CONTROL_TOKEN_SECRET: ${AGENT_CONTROL_TOKEN_SECRET:-}
      # The owner's GitHub user token is stored encrypted under this key, and
      # renewed with the App's client credentials.
      AGENT_SOURCE_CONTROL_ENCRYPTION_KEY: ${AGENT_SOURCE_CONTROL_ENCRYPTION_KEY:-}
      AGENT_GITHUB_API: ${AGENT_GITHUB_API:-https://api.github.com}
      AGENT_GITHUB_APP_ID: ${AGENT_GITHUB_APP_ID:-}
      AGENT_GITHUB_APP_CLIENT_ID: ${AGENT_GITHUB_APP_CLIENT_ID:-}
      AGENT_GITHUB_APP_CLIENT_SECRET: ${AGENT_GITHUB_APP_CLIENT_SECRET:-}
      AGENT_GITHUB_APP_PRIVATE_KEY_PATH: ${AGENT_GITHUB_APP_PRIVATE_KEY_PATH:-/etc/cloud-agent/github-app.pem}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_LOG_FORMAT: ${AGENT_LOG_FORMAT:-text}
    volumes:
      - agent-keys:/run/cloud-agent/keys:ro
      - ${AGENT_GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/etc/cloud-agent/github-app.pem:ro
      # relay.pem (the leaf for github.com and api.github.com) and relay.key.
      # The CA's own key is not needed here and should not be mounted.
      - ${AGENT_GITHUB_RELAY_TLS_DIR:-./github-relay-tls}:/etc/cloud-agent/github-relay:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  # The model relay: where a turn on a connection the deployment provides
  # sends its model requests. A fourth listener of the same image, containing
  # the model relay's one catch-all route and a health check. It resolves a
  # residency placeholder to the running turn it speaks for, counts the
  # request against its owner's allowance, and forwards it to the provider
  # with the deployment's key, which exists nowhere else. Behind a profile:
  # `COMPOSE_PROFILES=model-relay` turns it on, together with the hosts'
  # model-tunnel and AGENT_SANDBOX_MODEL_RELAY_URL.
  #
  # In-flight caps are kept per process: one replica, unless a cap enforced
  # per replica is what is wanted.
  model-relay:
    profiles: [model-relay]
    # The image `keys` builds; see there.
    image: ${COMPOSE_PROJECT_NAME}-control-plane:${AGENT_DEPLOYMENT_SHA:-unknown}
    pull_policy: never
    command:
      - uvicorn
      - cloud_agent.app:create_model_relay_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
    restart: unless-stopped
    ports:
      # Loopback, like the other relays: only the hosts' model-tunnel reaches it.
      - "${AGENT_MODEL_RELAY_BIND:-127.0.0.1}:${AGENT_MODEL_RELAY_PORT:-8002}:8002"
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:-}
      AGENT_SESSION_SECRET: ${AGENT_SESSION_SECRET:-}
      AGENT_LOCAL_SESSION_SECRET: ${AGENT_LOCAL_SESSION_SECRET:-}
      # A provided connection's key is stored encrypted under this key.
      AGENT_SETTINGS_ENCRYPTION_KEY: ${AGENT_SETTINGS_ENCRYPTION_KEY:-}
      # The placeholder a sandbox presents is signed with this secret.
      AGENT_CONTROL_TOKEN_SECRET: ${AGENT_CONTROL_TOKEN_SECRET:-}
      # Addresses a provider's Base URL may never resolve to, beside the
      # private and special-purpose ranges that are always refused.
      AGENT_EGRESS_PROTECTED_CIDRS: ${AGENT_EGRESS_PROTECTED_CIDRS:-}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_LOG_FORMAT: ${AGENT_LOG_FORMAT:-text}
    volumes:
      - agent-keys:/run/cloud-agent/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  # The browser-facing app. Two classes of configuration meet here, and the
  # difference is deliberate: the browser's API prefix is a property of the
  # image, resolved when the bundle is compiled, so it is a build argument and
  # a change to it is a rebuild. The
  # deployment's identity — name, organisation, status page, contact — is
  # read by the server on every request instead, so it is
  # `environment:` below and changing it restarts the container rather than
  # rebuilding the image.
  web:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile.web
      args:
        # The browser calls the control plane at `/api` on the same origin;
        # the edge in front routes it. The app is served at the root of its
        # own hostname: mounting it under a path prefix was removed.
        NEXT_PUBLIC_AGENT_API_URL: /api
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
    # Read per request by `apps/frontend/src/config/site.server.ts`. Display values only:
    # this container is the one a browser can reach, so a secret in this block
    # is one log line away from being public. Empty optional values are a
    # legitimate configuration and hide the corresponding link; an illegal one
    # is refused at render time rather than silently dropped.
    environment:
      AGENT_CONTROL_PLANE_URL: http://control-plane:8000
      AGENT_WEB_APP_NAME: ${AGENT_WEB_APP_NAME:-}
      AGENT_WEB_ORG_NAME: ${AGENT_WEB_ORG_NAME:-}
      AGENT_WEB_ORG_URL: ${AGENT_WEB_ORG_URL:-}
      AGENT_WEB_STATUS_URL: ${AGENT_WEB_STATUS_URL:-}
      AGENT_WEB_DOCS_URL: ${AGENT_WEB_DOCS_URL:-}
      AGENT_WEB_CONTACT_URL: ${AGENT_WEB_CONTACT_URL:-}
      AGENT_DEPLOYMENT_SHA: ${AGENT_DEPLOYMENT_SHA:-}
      AGENT_WEB_DEPLOYED_AT: ${AGENT_WEB_DEPLOYED_AT:-}
    restart: unless-stopped
    ports:
      # Loopback, like the API: the reverse proxy in front of the host is what
      # terminates TLS and decides who may reach this.
      - "${AGENT_WEB_BIND:-127.0.0.1}:${AGENT_WEB_PORT:-3002}:3000"
    depends_on:
      control-plane:
        condition: service_started
    networks: [control-plane]

  # --- Optional: the edge ----------------------------------------------------
  # Behind a profile, for a deployment whose own reverse proxy does not already
  # split the origin. The tunnel or load balancer in front of the hostname
  # (agents.example.org) points at this one port and nginx splits the origin — `/api/*` to the control plane with
  # the prefix stripped, everything else to the web app. One origin for both
  # is what lets the session cookie travel; two hostnames would not.
  #
  # Enable with `COMPOSE_PROFILES=edge` (or `--profile edge`). Loopback by default, like every other published port here: the tunnel is on this host.
  edge:
    profiles: [edge]
    image: nginx:1.27.5-alpine
    volumes:
      - ${AGENT_EDGE_CONFIG_FILE:-./edge.nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${AGENT_EDGE_BIND:-127.0.0.1}:${AGENT_EDGE_PORT:-3003}:80"
    depends_on:
      - control-plane
      - web
    networks: [control-plane]
    restart: unless-stopped

  # Optional database UI. No host port: every browser request must cross the
  # control plane's current agent.admin check, then pgAdmin's own login.
  pgadmin:
    profiles: [pgadmin]
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    restart: unless-stopped
    entrypoint: ["/venv/bin/python3", "/pgadmin-entrypoint.py"]
    group_add: ["10001"]
    environment:
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: ${AGENT_PGADMIN_COOKIE_SECURE:-True}
    volumes:
      - agent-pgadmin:/var/lib/pgadmin
      - agent-pgadmin-bootstrap:/run/cloud-agent/pgadmin-bootstrap:ro
      - ${AGENT_PGADMIN_ENTRYPOINT_FILE:-./pgadmin-entrypoint.py}:/pgadmin-entrypoint.py:ro
      - ${AGENT_PGADMIN_SERVERS_FILE:-./pgadmin-servers.json}:/pgadmin4/servers.json:ro
    depends_on:
      control-plane:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [control-plane]
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "from pathlib import Path; import urllib.request; (Path('/var/lib/pgadmin/pgadmin4.db').exists() or Path('/run/cloud-agent/pgadmin-bootstrap/email').exists()) and urllib.request.urlopen('http://127.0.0.1:5050/misc/ping', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-cloudagent}
      # Read only when the volume is new: the `keys` service stores the
      # deployment's password, or generates one for a new installation.
      POSTGRES_PASSWORD_FILE: /run/cloud-agent/keys/AGENT_POSTGRES_PASSWORD
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-cloudagent}
    volumes:
      - agent-postgres:/var/lib/postgresql/data
      - agent-keys:/run/cloud-agent/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck:
      # `migrate` gates the API, and `migrate` waits on this. Without a real
      # check both would start against a Postgres that has accepted a TCP
      # connection and is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_POSTGRES_USER:-cloudagent} -d ${AGENT_POSTGRES_DB:-cloudagent}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port. The API reaches it over the compose network; exposing
    # it to the host is a database on the internet one firewall rule later.
    networks: [control-plane]

networks:
  control-plane:
    # **Named, so another stack can join it.** A reverse proxy in another
    # stack has to resolve `web` and `control-plane` by name — and a
    # compose-derived name like `cloudagent_control-plane`
    # depends on the project name whoever ran `up` happened to use.
    name: ${AGENT_NETWORK_NAME:-cloud-agent}
    driver: bridge

volumes:
  # The deployment keys, one file each; see the `keys` service.
  agent-keys:
  agent-postgres:
  agent-pgadmin:
  agent-pgadmin-bootstrap:

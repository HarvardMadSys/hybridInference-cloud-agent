# The control plane and its database — one machine, no runners.
#
# Runners live in `deploy/host/docker-compose.sandbox.yml` and are
# deliberately not here. They are a different trust tier (they execute
# untrusted code and mount a docker socket) and a different scaling unit; a
# single file that started both would make "add a runner host" mean "add a
# second control plane".
#
#   browser ──→ control-plane :8000 ──→ postgres
#                    │
#                    └──HTTPS──→ the FreeInference gateway
#                                (identity, model catalog, inference grants)
#
# **The gateway is reachable over HTTP and nothing else.** No gateway database
# DSN appears here, and neither `API_KEY_SECRET` nor `JWT_SECRET_KEY` may ever
# be set on this machine — a control plane holding either could mint gateway
# credentials for itself, which is the coupling the whole split exists to end.
#
# Start it with:
#   docker compose -f deploy/control-plane/docker-compose.yml up -d
# after filling in an env file; see ENVIRONMENT.md for every variable and
# `docs/smoke.md` for a first run.

services:
  # Runs to completion before the API is allowed to start. Alembic owns the
  # schema — the service creates no tables at startup — so an API container
  # racing an unmigrated database is not a slow start, it is a crash loop
  # against tables that do not exist.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:?Postgres DSN for the agent-owned database}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [control-plane]

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback by default. This service terminates no TLS and authenticates
      # sessions with a cookie; putting it on a public interface without a
      # proxy in front would serve that cookie over plain HTTP.
      - "${AGENT_CONTROL_PLANE_BIND:-127.0.0.1}:${AGENT_CONTROL_PLANE_PORT:-8000}:8000"
    environment:
      # --- Database ---------------------------------------------------------
      # A database this service owns outright. Sharing the gateway's would
      # reintroduce exactly the coupling the split removes.
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:?Postgres DSN for the agent-owned database}

      # --- The gateway, over HTTP only --------------------------------------
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?origin of the FreeInference gateway}
      GATEWAY_JWKS_URL: ${GATEWAY_JWKS_URL:?the gateway origin plus /v1/identity/jwks}
      # Authorizes this service to mint and revoke inference grants. A service
      # credential: it must never reach a sandbox or a browser.
      GATEWAY_GRANT_DISPATCH_TOKEN: ${GATEWAY_GRANT_DISPATCH_TOKEN:?shared with the gateway, distinct per environment}
      # Optional, and optional on purpose: a deployment may front the gateway
      # under a different name than it mints under, and pinning `iss` wrongly
      # locks every user out.
      GATEWAY_ISSUER: ${GATEWAY_ISSUER:-}

      # --- This service's own secrets ---------------------------------------
      # Required, never defaulted. A default here is a deployment that looks
      # configured and is signing with a value in a public git repository.
      AGENT_SESSION_SECRET: ${AGENT_SESSION_SECRET:?32+ random bytes, unique per environment}
      AGENT_CONTROL_TOKEN_SECRET: ${AGENT_CONTROL_TOKEN_SECRET:?32+ random bytes, unique per environment}
      AGENT_SOURCE_CONTROL_ENCRYPTION_KEY: ${AGENT_SOURCE_CONTROL_ENCRYPTION_KEY:?32+ random bytes, unique per environment}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # How long a hot sandbox's residency lease lives between beats (design
      # §7). Also the cap on how long an idle resident process is kept at all.
      AGENT_RESIDENCY_TTL_S: ${AGENT_RESIDENCY_TTL_S:-1800}
      # What a runner presents to claim work. Without it every claim is 401 and
      # the queue simply never drains — with nothing in the control plane's own
      # logs saying why, because the refusal is correct.
      AGENT_DISPATCHER_TOKEN: ${AGENT_DISPATCHER_TOKEN:?the credential runners claim with}
      # The gateway alert relay's door (/v1/agent/service/oncall/*). Optional
      # as a pair: a deployment without on-call sets neither, the door answers
      # 401/503, and nothing else changes. The user id decides whose role and
      # quota every on-call analysis runs under.
      AGENT_ONCALL_DISPATCH_TOKEN: ${AGENT_ONCALL_DISPATCH_TOKEN:-}
      AGENT_ONCALL_USER_ID: ${AGENT_ONCALL_USER_ID:-}

      # --- Behaviour switches ----------------------------------------------
      # Both default to the safe answer, so an operator who sets neither gets a
      # Secure cookie and an audit trail that records the peer rather than a
      # header the caller chose.
      AGENT_SESSION_COOKIE_SECURE: ${AGENT_SESSION_COOKIE_SECURE:-true}
      AGENT_TRUST_PROXY_HEADERS: ${AGENT_TRUST_PROXY_HEADERS:-false}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_DEFAULT_EXECUTION_PROFILE: ${AGENT_DEFAULT_EXECUTION_PROFILE:-trusted-v1}
      # New chats require a host that advertises the complete shared-live
      # protocol; unset/0 preserves the legacy disposable scheduling path.
      AGENT_SHARED_LIVE_SANDBOX: ${AGENT_SHARED_LIVE_SANDBOX:-0}

      # --- Publishing and source control ------------------------------------
      # The only component that holds a git credential, which is precisely what
      # keeps the sandbox credential-free. Unset means this deployment never
      # publishes — it starts anyway rather than refusing.
      AGENT_GITHUB_TOKEN: ${AGENT_GITHUB_TOKEN:-}
      # `:-dev` and not `:-`. Compose passes an empty string as a *set*
      # variable, and `os.getenv(name, "dev")` returns that empty string rather
      # than the default — so a blank here silently means "open the PR against
      # a branch called ''". Same for the API base below.
      AGENT_PUBLISH_BASE_BRANCH: ${AGENT_PUBLISH_BASE_BRANCH:-dev}
      AGENT_GIT_AUTHOR_NAME: ${AGENT_GIT_AUTHOR_NAME:-}
      AGENT_GIT_AUTHOR_EMAIL: ${AGENT_GIT_AUTHOR_EMAIL:-}
      AGENT_REPO_ALLOWLIST: ${AGENT_REPO_ALLOWLIST:-}
      # The GitHub App and GitLab OAuth behind Integrations. Optional as a
      # group: a deployment that configures neither simply offers no
      # connections.
      AGENT_GITHUB_API: ${AGENT_GITHUB_API:-https://api.github.com}
      AGENT_GITHUB_APP_ID: ${AGENT_GITHUB_APP_ID:-}
      AGENT_GITHUB_APP_CLIENT_ID: ${AGENT_GITHUB_APP_CLIENT_ID:-}
      AGENT_GITHUB_APP_CLIENT_SECRET: ${AGENT_GITHUB_APP_CLIENT_SECRET:-}
      AGENT_GITHUB_APP_INSTALL_URL: ${AGENT_GITHUB_APP_INSTALL_URL:-}
      # Prefer the path form. A private key in an environment variable is
      # readable by anything that can list the process environment, and lands
      # in `docker inspect`, crash dumps and most log shippers.
      AGENT_GITHUB_APP_PRIVATE_KEY_PATH: ${AGENT_GITHUB_APP_PRIVATE_KEY_PATH:-/etc/cloud-agent/github-app.pem}
      AGENT_GITLAB_OAUTH_CLIENT_ID: ${AGENT_GITLAB_OAUTH_CLIENT_ID:-}
      AGENT_GITLAB_OAUTH_CLIENT_SECRET: ${AGENT_GITLAB_OAUTH_CLIENT_SECRET:-}
      AGENT_GITLAB_OAUTH_REDIRECT_URI: ${AGENT_GITLAB_OAUTH_REDIRECT_URI:-}

      # --- MCP --------------------------------------------------------------
      # There is no registry variable here any more: a deployment-configured
      # server list is the team-MCP feature this product does not offer, and
      # its credentials were one identity shared by every user who could create
      # a job. The relay below stays for the per-user connections that replace
      # it; until those exist it resolves nothing.
      #
      # Where a *sandbox* reaches the relay — a host-local alias, not this
      # container's own address, which is why it cannot be derived here.
      AGENT_SANDBOX_MCP_URL: ${AGENT_SANDBOX_MCP_URL:-}

      # --- Workspaces -------------------------------------------------------
      # Authorizes this service to the hosts' workspace brokers. Per-host
      # broker addresses come from each host's registration row, not from here.
      AGENT_WORKSPACE_BROKER_TOKEN: ${AGENT_WORKSPACE_BROKER_TOKEN:-}
      # Which hosts a registering machine may name as its broker. The token
      # above is shared across the pool, so an address accepted at
      # registration is an address that receives a credential good for every
      # broker in it. Unset means any host, which is what this did before the
      # check existed — a multi-host pool should name its machines here.
      AGENT_BROKER_URL_ALLOWED_HOSTS: ${AGENT_BROKER_URL_ALLOWED_HOSTS:-}
    volumes:
      # The GitHub App key, read-only, as a file. `AGENT_GITHUB_APP_PRIVATE_KEY_PATH`
      # names a path *inside* this container, so setting it without mounting
      # anything produces a service that starts, offers Integrations, and fails
      # at the first publish. Points at /dev/null when unconfigured so the
      # stack still renders without a key.
      - ${AGENT_GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/etc/cloud-agent/github-app.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  # The one surface a sandbox may reach. Same image, same database, same
  # lifespan — a second listener rather than a second service.
  #
  # It exists because the sandbox's tunnel has to terminate *somewhere*, and
  # terminating it on the control plane's own port put jobs, sessions, host
  # registration and admin one authorization bug away from code nobody here
  # wrote. Those routes all refuse an `mcp`-scoped token; this application
  # simply does not contain them, which is the difference between a policy and
  # a fact.
  mcp-relay:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    command:
      - uvicorn
      - cloud_agent.app:create_mcp_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
    restart: unless-stopped
    ports:
      # Loopback. The remote host's tunnel forwards to this, and nothing else
      # should be able to.
      - "${AGENT_MCP_RELAY_BIND:-127.0.0.1}:${AGENT_MCP_RELAY_PORT:-8001}:8001"
    environment:
      AGENT_DATABASE_URL: ${AGENT_DATABASE_URL:?Postgres DSN for the agent-owned database}
      AGENT_CONTROL_TOKEN_SECRET: ${AGENT_CONTROL_TOKEN_SECRET:?32+ random bytes, unique per environment}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [control-plane]

  # The browser-facing app. Built, not run from source: `basePath` and every
  # `NEXT_PUBLIC_*` value below are resolved when the bundle is compiled, so
  # they are build arguments and a change to any of them is a rebuild.
  web:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile.web
      args:
        # Where this app is mounted. `/agents` serves it under the gateway's
        # own hostname, which keeps the session cookie same-origin and takes
        # CORS out of the deployment entirely. Empty for a deployment that
        # owns its own hostname.
        #
        # **Required, not defaulted to empty**, and the three below with it.
        # Empty is a real answer for one deployment shape and silently wrong
        # for the other, and the wrongness does not show at start: the stack
        # comes up healthy with the app mounted at the wrong path, calling the
        # gateway instead of the control plane, and unable to sign anyone in.
        # `?` (without `:`) requires an explicit choice while still accepting
        # the empty string, which is the value for a deployment that owns its
        # hostname. `:?` would contradict that contract by rejecting empty.
        NEXT_PUBLIC_BASE_PATH: ${AGENT_WEB_BASE_PATH?the prefix this app is mounted under; empty string for a deployment that owns its own hostname}
        # Relative on purpose when mounted under a prefix: a same-origin path
        # means the cookie is sent without `SameSite=None`, and no absolute
        # host has to be known at build time. Under a base path this is that
        # base path plus `/api`, which the reverse proxy strips.
        NEXT_PUBLIC_AGENT_API_URL: ${AGENT_WEB_API_URL:?control-plane base URL as the browser calls it, e.g. /agents/api}
        NEXT_PUBLIC_GATEWAY_AUTHORIZE_URL: ${AGENT_WEB_GATEWAY_AUTHORIZE_URL:?the gateway's consent page; without it this deployment cannot sign anyone in}
        NEXT_PUBLIC_APP_NAME: ${AGENT_WEB_APP_NAME:-}
        # The rest of the header's identity. Optional — empty hides the link or
        # the name rather than rendering a blank one — but they have to be
        # passed to be optional at all: a build argument the compose file never
        # sets is a variable the deployment has no way to reach.
        NEXT_PUBLIC_ORG_NAME: ${AGENT_WEB_ORG_NAME:-}
        NEXT_PUBLIC_ORG_URL: ${AGENT_WEB_ORG_URL:-}
        NEXT_PUBLIC_STATUS_URL: ${AGENT_WEB_STATUS_URL:-}
        NEXT_PUBLIC_FEATURE_RAG: ${AGENT_WEB_FEATURE_RAG:-}
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
    restart: unless-stopped
    ports:
      # Loopback, like the API: the reverse proxy in front of the host is what
      # terminates TLS and decides who may reach this.
      - "${AGENT_WEB_BIND:-127.0.0.1}:${AGENT_WEB_PORT:-3002}:3000"
    depends_on:
      control-plane:
        condition: service_started
    networks: [control-plane]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENT_POSTGRES_USER:-cloudagent}
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?a password for the agent database}
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-cloudagent}
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      # `migrate` gates the API, and `migrate` waits on this. Without a real
      # check both would start against a Postgres that has accepted a TCP
      # connection and is still initialising.
      test: ["CMD-SHELL", "pg_isready -U ${AGENT_POSTGRES_USER:-cloudagent} -d ${AGENT_POSTGRES_DB:-cloudagent}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port. The API reaches it over the compose network; exposing
    # it to the host is a database on the internet one firewall rule later.
    networks: [control-plane]

networks:
  control-plane:
    # **Named, so another stack can join it.** The gateway's frontend proxies
    # `/agents/*` here (its `next.config.js` rewrites are this deployment's
    # routing table), which means it has to resolve `web` and `control-plane`
    # by name — and a compose-derived name like `cloudagent_control-plane`
    # depends on the project name whoever ran `up` happened to use.
    #
    # The gateway's own overlay names its networks the same way and for the
    # same reason; this is that pattern, pointed the other direction.
    name: ${AGENT_NETWORK_NAME:-cloud-agent}
    driver: bridge

volumes:
  agent-postgres:

# Serving the cloud agent under the gateway's own hostname.
#
#   <host>/agents/api/*  → this repository's control plane
#   <host>/agents/*      → this repository's web app
#   everything else      → the gateway (whatever the host already did)
#
# Same origin, which is the point: the session is a cookie, and a cookie that
# never crosses an origin needs no CORS, no `SameSite=None`, and no second DNS
# record. Rolling back is an edit here, not a DNS change waiting out a TTL.
#
# **This file is not applied by any deployment in this repository.** The
# reverse proxy in front of staging and production lives on those hosts and is
# not version-controlled anywhere; this is the reviewed text an operator pastes
# into it. Kept here so the routing can be read and argued with, and so the two
# details below cannot be lost in a shell session.
#
# Include it inside the existing `server { }` block, *above* the catch-all
# `location /` that proxies to the gateway. nginx matches prefix locations
# longest-first, so ordering within the file does not matter — but a
# `location /` declared with `=` or a regex would win, and then none of this
# runs.

# The control plane. Everything the browser calls, plus the SSE stream.
location /agents/api/ {
    # **The trailing slash on both sides is what strips the prefix.**
    # `proxy_pass http://host:8000/` replaces the matched `/agents/api/` with
    # `/`, so `/agents/api/v1/agent/jobs` arrives as `/v1/agent/jobs`. Drop
    # either slash and nginx forwards the prefix intact, which the control
    # plane answers with 404 for every route — the failure looks like the
    # service is down rather than like a proxy misconfiguration.
    proxy_pass http://127.0.0.1:8000/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # **Server-sent events.** Job output streams over SSE, and with buffering
    # on, nginx holds the response until its buffer fills or the request ends
    # — so the agent's output arrives in one lump when the job finishes, or
    # never. The symptom is a run that looks hung while it is working fine,
    # which is indistinguishable from the sandbox being stuck.
    proxy_buffering off;
    proxy_cache off;
    # nginx's own signal for the same thing, honoured even where a downstream
    # module re-enables buffering.
    proxy_set_header X-Accel-Buffering no;
    # A stream is idle between events by design. The default 60s read timeout
    # closes a healthy connection during a long tool call; the client then
    # reconnects and replays, which works but doubles the work every minute.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Include base64 expansion and JSON metadata for the 5 MiB file limit.
    location /agents/api/v1/agent/uploads {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8000/v1/agent/uploads;
    }
}

# The web app. Next.js is mounted at this prefix by `basePath`, so the path is
# forwarded unchanged — the app expects to see `/agents/...` and generates its
# own links and asset URLs with the prefix already on them.
location /agents/ {
    # No trailing slash on the upstream: the prefix must survive.
    proxy_pass http://127.0.0.1:3002;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next's dev overlay and any future websocket transport.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# `/agents` with no trailing slash, which is what a person types and what an
# old bookmark holds. Without this it falls through to the gateway and 404s.
location = /agents {
    return 308 /agents/;
}

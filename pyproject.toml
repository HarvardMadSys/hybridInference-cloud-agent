[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridinference-cloud-agent"
version = "0.1.0"
description = "Cloud coding agents on sandboxed hosts, powered by a HybridInference gateway"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "HarvardMadSys" }]
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "boto3>=1.40.0",
    # Alembic's driver, and a runtime dependency because a deploy runs
    # migrations. The service itself talks asyncpg; alembic goes through
    # SQLAlchemy, which needs a sync DBAPI.
    #
    # This was in the `dev` group, whose comment said "only the dbtest tier and
    # a deploy ever invoke them" — but the deploy runs in an image built with
    # `pip install .`, which does not install that group. So the compose file's
    # `migrate` service could never have worked from a clean build, and did not:
    # `alembic upgrade head` exits 1 on `ModuleNotFoundError: No module named
    # 'psycopg'`, taking control-plane and mcp-relay down with it because they
    # wait on `service_completed_successfully`. Found the first time a deploy
    # ran the whole compose file instead of `up -d web`.
    "psycopg[binary]>=3.2.0",
    "cryptography>=48.0.1",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27.0",
    "google-re2>=1.1.20251105",
    "uritemplate>=4.2.0",
    "email-validator>=2.2",
    # Local accounts (AGENT_AUTH_MODE=local) hash passwords with Argon2id.
    "argon2-cffi>=23.1.0",
    "pillow>=12.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["apps/backend"]
include = [
  "cloud_agent",
  "cloud_agent.*",
  "cloud_agent_host",
  "cloud_agent_host.*",
  "cloud_agent_shared",
  "cloud_agent_shared.*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--maxfail=10",
]
markers = [
  "integration: marks tests as integration tests",
  "external: tests that hit external/local servers",
  "dbtest: tests that require a running PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Where the first-party packages live, for import classification: the three
# of them moved under apps/backend, and `src = ["."]` no longer finds them, so
# every `cloud_agent*` import would be sorted as if it came from a dependency.
src = ["apps/backend"]
exclude = [
  ".venv",
  "apps/frontend",
  "migrations/versions",
]

[tool.ruff.lint]
# Explicit, rather than added to ruff's defaults: a ruff release that turns more
# rules on by default then changes nothing here by itself.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "C90", # mccabe: function complexity (#771)
  "D",   # pydocstyle, for the three service packages (per-file-ignores below)
  "SIM", # flake8-simplify
  "PLR0912", # too many branches (#771)
  "PLR0915", # too many statements (#771)
  "TCH", # flake8-type-checking
  "RUF", # Ruff-specific rules
]
ignore = [
  "E203",  # whitespace before ':' (black/pep8 conflict)
  "E501",  # line too long (handled by formatter)
  "E402",  # module import not at top of file (for now)
  "B008",  # FastAPI Depends pattern is OK
  "D104",  # missing docstring in public package
  "D105",  # magic method docstring not required
  "D107",  # __init__ docstring not required
  # PEP 695 type parameters. Converting a class or function means re-checking its
  # TypeVar's bound and variance by hand, so it happens when that code changes.
  "UP046",
  "UP047",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Docstrings and the complexity ratchet apply to the service packages only.
"!apps/backend/**" = ["D", "C901", "PLR0912", "PLR0915"]

# The complexity ratchet (#771). A function over a limit today carries a
# `noqa` naming the issue, and RUF100 reports that `noqa` once the function is
# back under the limit, so the list only shrinks.
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.format]
# Design records keep the code they were written with: ruff formats Python
# blocks inside Markdown, and rewriting a dated spec's examples serves no one.
exclude = ["docs/**"]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

# Type checking all three packages, and blocking. `follow_imports = "silent"`
# still gives a file checked from outside them (the ports gate's negative
# fixture) their real types, without reporting their errors against it; `skip`
# would substitute `Any` and quietly disable that check. `ignore_missing_
# imports` covers asyncpg, which ships no stubs.
[tool.mypy]
python_version = "3.12"
files = [
  "apps/backend/cloud_agent",
  "apps/backend/cloud_agent_host",
  "apps/backend/cloud_agent_shared",
]
# Where the three packages live. Without this, a file checked from outside that
# tree -- `tests/fixtures/ports_negative/miswired_port.py`, which exists to be
# rejected -- cannot resolve `cloud_agent`, and `ignore_missing_imports` below
# turns every annotation it carries into `Any`, so the negative control passes
# by finding nothing to complain about.
mypy_path = "apps/backend"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_unused_ignores = true
show_error_codes = true

[dependency-groups]
dev = [
  # Validates release manifests against deploy/release/manifest.schema.json —
  # the published contract, checked against the generator that writes it, so
  # the two cannot drift apart. Named here rather than relied on transitively:
  # it arrives today through openapi-spec-validator, and a test that leans on a
  # dependency of a dependency breaks the day that one changes.
  "jsonschema>=4.21",
  "mypy>=1.20.2",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  # Validates gateway_contracts/*.yaml. A dev dependency and not a runtime one: nothing
  # in this service loads those documents — they record what the gateway agreed
  # to, and a wire-level validator would fail closed on a compatible change.
  "openapi-spec-validator>=0.7.1",
  "pytest-timeout>=2.3.0",
  "pytest-xdist>=3.6.0",
  # Pinned: a formatter release can reformat code no one touched, so it is
  # bumped on purpose, in its own change.
  "ruff==0.16.10",
  # Build the developer documentation in docs/developer/ (`make docs`). The
  # site is plain MyST Markdown, so these are the only packages it needs.
  # jieba is the word segmenter Sphinx's Chinese search index uses; without it
  # the zh_CN index holds no Chinese terms and searching that site finds
  # nothing (conf.py refuses to build it).
  "jieba>=0.42.1",
  "myst-parser>=4.0.1",
  "sphinx>=8.1.3",
  "sphinx-rtd-theme>=3.0.2",
]

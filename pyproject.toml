[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridinference-cloud-agent"
version = "0.1.0"
description = "Cloud coding agents on sandboxed hosts, powered by a HybridInference gateway"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "HarvardMadSys" }]
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.28.0",
    # Alembic's driver, and a runtime dependency because a deploy runs
    # migrations. The service itself talks asyncpg; alembic goes through
    # SQLAlchemy, which needs a sync DBAPI.
    #
    # This was in the `dev` group, whose comment said "only the dbtest tier and
    # a deploy ever invoke them" — but the deploy runs in an image built with
    # `pip install .`, which does not install that group. So the compose file's
    # `migrate` service could never have worked from a clean build, and did not:
    # `alembic upgrade head` exits 1 on `ModuleNotFoundError: No module named
    # 'psycopg'`, taking control-plane and mcp-relay down with it because they
    # wait on `service_completed_successfully`. Found the first time a deploy
    # ran the whole compose file instead of `up -d web`.
    "psycopg[binary]>=3.2.0",
    "cryptography>=48.0.1",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.1.1",
    "python-ulid>=2.0.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27.0",
    "google-re2>=1.1.20251105",
    "uritemplate>=4.2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "cloud_agent",
  "cloud_agent.*",
  "cloud_agent_host",
  "cloud_agent_host.*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--maxfail=10",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "external: tests that hit external/local servers",
  "dbtest: tests that require a running PostgreSQL test database",
]

# Ruff config is inherited from HybridInference so that moved files pass
# unchanged (migration rule: imports/paths only, never reformatting). That
# includes target-version: py310 keeps the same rule set the source repo
# checks these files with (py312 would enable e.g. UP042 against them).
# Raise it after the migration completes, as its own PR.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
exclude = [
  ".venv",
  "web",
  "migrations/versions",
]

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # Ruff-specific rules
]
ignore = [
  "E203",  # whitespace before ':' (black/pep8 conflict)
  "E501",  # line too long (handled by formatter)
  "E402",  # module import not at top of file (for now)
  "B008",  # FastAPI Depends pattern is OK
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydocstyle]
convention = "google"
add-ignore = [
  "D104",  # missing docstring in public package
  "D105",  # magic method docstring not required
  "D107",  # __init__ docstring not required
]
match = ".+\\.py"
match-dir = "(?!tests|\\.venv|node_modules|web|migrations|docs).*"

# Type checking the control plane, and blocking. `store.py` is included on
# purpose: a checker that cannot see the class it is validating callers against
# proves nothing about the wiring, which is the whole point of the storage
# ports. `follow_imports = "silent"` keeps `cloud_agent_host` -- outside this
# gate -- out of the report while still giving these files its real types;
# `skip` would substitute `Any` and quietly disable the check. `ignore_missing_
# imports` covers asyncpg, which ships no stubs.
[tool.mypy]
python_version = "3.12"
files = ["cloud_agent", "cloud_agent_host"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_unused_ignores = true
show_error_codes = true

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  # Validates release manifests against deploy/release/manifest.schema.json —
  # the published contract, checked against the generator that writes it, so
  # the two cannot drift apart. Named here rather than relied on transitively:
  # it arrives today through openapi-spec-validator, and a test that leans on a
  # dependency of a dependency breaks the day that one changes.
  "jsonschema>=4.21",
  "mypy>=1.20.2",
  "pre-commit>=3.6.0",
  "pydocstyle>=6.3.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  # Validates contracts/*.yaml. A dev dependency and not a runtime one: nothing
  # in this service loads those documents — they record what the gateway agreed
  # to, and a wire-level validator would fail closed on a compatible change.
  "openapi-spec-validator>=0.7.1",
  "pytest-timeout>=2.3.0",
  "pytest-xdist>=3.6.0",
  # Pinned, deliberately — the source repo's CI checks the files we migrate
  # with this exact version, and "moved files pass unchanged" is only a
  # meaningful acceptance criterion against a fixed formatter. Bump it as its
  # own PR, never as a side effect of a migration task. (0.16 default-enables
  # ISC004, which the migrated sandbox.py trips.)
  "ruff==0.15.12",
]

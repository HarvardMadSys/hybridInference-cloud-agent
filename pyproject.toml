[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridinference-cloud-agent"
version = "0.1.0"
description = "Cloud coding agents on sandboxed hosts, powered by a HybridInference gateway"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "HarvardMadSys" }]
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.28.0",
    # Alembic's driver, and a runtime dependency because a deploy runs
    # migrations. The service itself talks asyncpg; alembic goes through
    # SQLAlchemy, which needs a sync DBAPI.
    #
    # This was in the `dev` group, whose comment said "only the dbtest tier and
    # a deploy ever invoke them" — but the deploy runs in an image built with
    # `pip install .`, which does not install that group. So the compose file's
    # `migrate` service could never have worked from a clean build, and did not:
    # `alembic upgrade head` exits 1 on `ModuleNotFoundError: No module named
    # 'psycopg'`, taking control-plane and mcp-relay down with it because they
    # wait on `service_completed_successfully`. Found the first time a deploy
    # ran the whole compose file instead of `up -d web`.
    "psycopg[binary]>=3.2.0",
    "cryptography>=48.0.1",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.1.1",
    "python-ulid>=2.0.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "cloud_agent",
  "cloud_agent.*",
  "cloud_agent_host",
  "cloud_agent_host.*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--maxfail=10",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "external: tests that hit external/local servers",
  "dbtest: tests that require a running PostgreSQL test database",
]

# Ruff config is inherited from HybridInference so that moved files pass
# unchanged (migration rule: imports/paths only, never reformatting). That
# includes target-version: py310 keeps the same rule set the source repo
# checks these files with (py312 would enable e.g. UP042 against them).
# Raise it after the migration completes, as its own PR.
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
exclude = [
  ".venv",
  "web",
  "migrations/versions",
]

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # Ruff-specific rules
]
ignore = [
  "E203",  # whitespace before ':' (black/pep8 conflict)
  "E501",  # line too long (handled by formatter)
  "E402",  # module import not at top of file (for now)
  "B008",  # FastAPI Depends pattern is OK
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydocstyle]
convention = "google"
add-ignore = [
  "D104",  # missing docstring in public package
  "D105",  # magic method docstring not required
  "D107",  # __init__ docstring not required
]
match = ".+\\.py"
match-dir = "(?!tests|\\.venv|node_modules|web|migrations|docs).*"

# Type checking is scoped to the persistence boundary: the ports, the Postgres
# implementations behind them, the assembly in bootstrap.py, and the tools that
# generate and verify the split. A module joins this list when its callers are
# narrowed to capabilities; widening it further is its own task, because a type
# checker turned on over a codebase that never had one reports thousands of
# findings, and the ignore list that silences them is worse than no checker.
[tool.mypy]
python_version = "3.10"
files = [
  "cloud_agent/domain",
  "cloud_agent/ports",
  "cloud_agent/storage",
  "cloud_agent/bootstrap.py",
  "tools",
]
# ``cloud_agent/storage/store.py`` is the monolith this boundary replaces. It is
# still imported by every caller during the migration and is deleted at the end
# of it, so it is excluded rather than repaired: annotating code that is about to
# disappear is work spent twice.
exclude = ["^cloud_agent/storage/store\\.py$"]
# ``follow_imports = silent`` treats a module outside the checked set as ``Any``
# rather than reporting it, which is what makes a partial rollout possible. It
# does not excuse an error inside a checked module.
follow_imports = "silent"
ignore_missing_imports = true
# A new boundary is worth checking properly: an unannotated function and a bare
# ``dict`` are both errors here. ``warn_unused_ignores`` stops a stale
# ``# type: ignore`` outliving the problem it silenced.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

# asyncpg ships no stubs. Infrastructure converts its rows at the boundary, so
# the gap stays in the modules that touch a connection instead of spreading
# ``Any`` through every repository signature.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "jwt.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.20.2",
  "pre-commit>=3.6.0",
  "pydocstyle>=6.3.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  # Validates contracts/*.yaml. A dev dependency and not a runtime one: nothing
  # in this service loads those documents — they record what the gateway agreed
  # to, and a wire-level validator would fail closed on a compatible change.
  "openapi-spec-validator>=0.7.1",
  "pytest-timeout>=2.3.0",
  "pytest-xdist>=3.6.0",
  # Pinned, deliberately — the source repo's CI checks the files we migrate
  # with this exact version, and "moved files pass unchanged" is only a
  # meaningful acceptance criterion against a fixed formatter. Bump it as its
  # own PR, never as a side effect of a migration task. (0.16 default-enables
  # ISC004, which the migrated sandbox.py trips.)
  "ruff==0.15.12",
]

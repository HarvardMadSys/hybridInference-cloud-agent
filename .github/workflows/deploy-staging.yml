name: Deploy Staging

# Merging to dev deploys. Until now "deployed" and "merged" were unrelated
# facts about this repository — #29 recovered two real fixes from a host whose
# tree had drifted from every commit GitHub had ever seen, and `.deployed-sha`
# named a commit that 404s. This is the thing that stops that recurring.
#
# It runs *on* spark2, because the CI runners are installed there and that is
# also the deployment target, owned by the same user. So there is no SSH key,
# no known_hosts secret and no sudo here. The gateway's equivalent carries
# sixty lines of host-key handling for the sole reason that its runners are on
# a different machine from its target.
#
# **To roll back**, dispatch this workflow with `sha` set to the commit to go
# back to. Rollback is a deploy of an older commit; it is not a separate
# mechanism, and inventing one would mean the emergency path is the one that
# has never been exercised.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to this branch's head). Set it to roll back.
        required: false

concurrency:
  group: cloud-agent-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy control plane + web
    # Both halves start together. The host publishes an exact target-SHA
    # capability only after every runner, broker, tunnel and retained Docker
    # root passes its local checks. deploy.sh waits for a fresh heartbeat and
    # reverse broker probe before replacing the API, so the readiness fence —
    # not serial Actions scheduling — establishes the safe rollout order.
    # `CI` is one workflow with a `CI Gate` job precisely so this condition can
    # be a single conclusion. It was four workflows until #31; gating on one of
    # four would have meant treating "that workflow was filtered out" and "that
    # workflow has not started" as the same thing, and deploying on the second.
    #
    # **The fuse.** `LEGACY_DIRECT_STAGING_DEPLOY` is the migration switch that
    # hands this environment to FreeInference: while it is `true`, merging to
    # `dev` deploys exactly as it always has; `false`, `yes`, an empty value, or
    # no variable at all skips both jobs and touches no host. Fail-closed on
    # purpose: a fuse that fires when it cannot read itself is not a fuse.
    #
    # Case is GitHub's, not ours — its `==` ignores case when comparing
    # strings, so `True` and `TRUE` deploy as well. Recorded rather than fought:
    # the half that matters is the other one, and it fails closed.
    #
    # The gate sits on the job rather than on a step, because a step-level check
    # still allocates the runner and runs every other step of the job.
    #
    # It is a migration artifact, not the terminal architecture: this workflow
    # is deleted once FreeInference deploys staging from its own lock.
    if: >-
      ${{ vars.LEGACY_DIRECT_STAGING_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')) }}
    runs-on: [self-hosted, Linux, deploy-cloud-agent-control-staging]
    # Records the deployment, so staging appears in the repository's
    # Deployments panel beside production instead of being visible only to
    # someone who knows to open the Actions tab — and knows that a
    # `workflow_run` job is filed under the default branch, so filtering the
    # run list by `dev` shows nothing and reads as "it never deployed".
    #
    # Both jobs write to this one environment, matching production. The
    # workflow as a whole succeeds only when both parallel halves succeed.
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${RUN_SHA:-${GITHUB_SHA}}}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "deploying ${sha}"

      # The orchestrator must not roll itself back before it has applied the
      # compatibility fence. The target tree is separate: images/config still
      # come from exactly the requested commit.
      - name: Check out deployment orchestrator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-orchestrator
          fetch-depth: 1

      - name: Check out target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: .deploy-target
          fetch-depth: 0

      # The deploy scripts build images here, and every base image they pull
      # comes from Docker Hub, whose anonymous allowance is per IP and shared
      # with the other repository's CI. A config directory of this job's own,
      # because the runners on this machine share one $HOME and the login's
      # post step logs out of whatever config it used.
      - name: Use a Docker config of this job's own
        env:
          RUNNER_TEMP_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          mkdir -p "${RUNNER_TEMP_CONFIG}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP_CONFIG}" >> "${GITHUB_ENV}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        env:
          # Unset falls back to the script's own default, which is this
          # machine's path. Named here so production and staging are configured
          # the same way rather than one by variable and one by default.
          DEPLOY_ROOT: ${{ vars.STAGING_CONTROL_DEPLOY_ROOT }}
          # Use the same project identity as the status/operations step. If the
          # deployment has a non-default project, omitting this would build and
          # replace `cloudagent` while reporting a different stack as healthy.
          COMPOSE_PROJECT: ${{ vars.STAGING_CONTROL_COMPOSE_PROJECT }}
          SOURCE_REPO: ${{ github.workspace }}/.deploy-target
          # How long this rollout waits for the runner hosts to reach the
          # target commit before failing. It is a compatibility fence, not a
          # health check: with no fallback protocol during a rolling deploy,
          # the control plane must not replace the live API while a host still
          # serves the previous commit. Shortening it does not loosen the
          # fence, it only gives up sooner.
          #
          # 120s against a measured need of about 55: the three rollouts that
          # succeeded on 2026-09-12 finished their host job in 52-54s, and the
          # readiness fence resolved 31s into the one before that. The default
          # of 900 was costing a quarter of an hour per failure -- that day, 10
          # failures spent 176 minutes against 4 minutes for 3 successes, and
          # the deploy slot is single, so everything behind them queued.
          # Staging would rather retry than wait out fifteen minutes of a
          # verdict already decided; production keeps the conservative default.
          # A cold sandbox-image rebuild runs before the host's own checks and
          # so eats into this window -- if one times out here, run it again,
          # which now costs two minutes.
          SHARED_READY_TIMEOUT: "120"
        run: bash .deploy-orchestrator/deploy/control-plane/deploy.sh "${{ steps.target.outputs.sha }}"

      - name: What is running now
        if: always()
        env:
          DEPLOY_ROOT: ${{ vars.STAGING_CONTROL_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.STAGING_CONTROL_COMPOSE_PROJECT }}
        run: |
          root="${DEPLOY_ROOT:-/srv/freeinference-cloud-agent}"
          echo "deployed sha on host: $(cat "${root}/.deployed-sha" 2>/dev/null || echo unknown)"
          docker compose -p "${COMPOSE_PROJECT:-cloudagent}" \
            --env-file "${root}/.env" \
            -f "${root}/deploy/control-plane/docker-compose.yml" \
            ps 2>/dev/null || true

  deploy-host:
    name: Deploy runner host
    # This job may run alongside the control build/migration work. Its exact-SHA
    # ready marker is what lets deploy.sh prove this generation before it
    # replaces the old API.
    #
    # The same fuse as the control job above, and the same variable: an
    # environment is handed over whole, so disabling it must not leave the host
    # half deploying into a control plane that FreeInference now owns.
    if: >-
      ${{ vars.LEGACY_DIRECT_STAGING_DEPLOY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')) }}
    runs-on: [self-hosted, Linux, deploy-cloud-agent-sandbox-staging]
    environment: staging
    timeout-minutes: 45
    concurrency:
      # Serialize staging host rollouts with staging only. Production owns a
      # different Compose project/image/network/state root and may deploy in
      # parallel; the host preflight only checks Kata and never mutates it.
      group: cloud-agent-host-deploy
      cancel-in-progress: false

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${RUN_SHA:-${GITHUB_SHA}}}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "deploying ${sha}"

      - name: Check out deployment orchestrator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-orchestrator
          fetch-depth: 1

      - name: Check out target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: .deploy-target
          fetch-depth: 0

      # The deploy scripts build images here, and every base image they pull
      # comes from Docker Hub, whose anonymous allowance is per IP and shared
      # with the other repository's CI. A config directory of this job's own,
      # because the runners on this machine share one $HOME and the login's
      # post step logs out of whatever config it used.
      - name: Use a Docker config of this job's own
        env:
          RUNNER_TEMP_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          mkdir -p "${RUNNER_TEMP_CONFIG}"
          echo "DOCKER_CONFIG=${RUNNER_TEMP_CONFIG}" >> "${GITHUB_ENV}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        env:
          # A repository variable rather than a literal: this path differs per
          # machine (the host user has no write access to /srv there) and a
          # deployment path does not belong in a repository that is going to be
          # public.
          DEPLOY_ROOT: ${{ vars.STAGING_SANDBOX_DEPLOY_ROOT }}
          # Which stack on that machine. It runs production's too, so this is
          # what says whose containers this deploy owns; `deploy.sh` refuses
          # rather than guessing when it is empty.
          COMPOSE_PROJECT: ${{ vars.STAGING_SANDBOX_COMPOSE_PROJECT }}
          SIBLING_COMPOSE_PROJECTS: ${{ vars.PROD_SANDBOX_COMPOSE_PROJECT }}
          # The same fence, on the side that publishes readiness: `cmd_up`
          # passes this to its own post-rollout check. Bounded here too so the
          # two halves of one deployment cannot disagree about how long the
          # rollout is allowed to take.
          SHARED_READY_TIMEOUT: "120"
          # One capacity value drives both the number of synchronous runner
          # executors and the scheduler slots they advertise. Letting these
          # drift can claim three simultaneous turns with only one process
          # available to execute them, silently serialising fork siblings.
          AGENT_HOST_SLOTS: ${{ vars.STAGING_HOST_SLOTS || '3' }}
          AGENT_RUNNER_REPLICAS: ${{ vars.STAGING_HOST_SLOTS || '3' }}
          AGENT_CHAT_IDLE_TIMEOUT_S: "1800"
          # Docker, not a chat bind mount, owns retained writable layers. Set
          # the repository variable if this daemon uses a non-default data-root.
          AGENT_RETAINED_DOCKER_DATA_ROOT: ${{ vars.STAGING_RETAINED_DOCKER_DATA_ROOT || '/var/lib/docker' }}
          SOURCE_REPO: ${{ github.workspace }}/.deploy-target
        run: bash .deploy-orchestrator/deploy/host/deploy.sh "${{ steps.target.outputs.sha }}"

      - name: What is running now
        if: always()
        env:
          DEPLOY_ROOT: ${{ vars.STAGING_SANDBOX_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.STAGING_SANDBOX_COMPOSE_PROJECT }}
        run: |
          echo "deployed sha on host: $(cat "${DEPLOY_ROOT}/.deployed-sha" 2>/dev/null || echo unknown)"
          docker ps --filter "label=com.docker.compose.project=${COMPOSE_PROJECT}" \
            --format '  {{.Names}}  {{.Status}}' 2>/dev/null || true

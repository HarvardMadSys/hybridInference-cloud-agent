name: Deploy Staging

# Merging to dev deploys. Until now "deployed" and "merged" were unrelated
# facts about this repository — #29 recovered two real fixes from a host whose
# tree had drifted from every commit GitHub had ever seen, and `.deployed-sha`
# named a commit that 404s. This is the thing that stops that recurring.
#
# It runs *on* spark2, because the CI runners are installed there and that is
# also the deployment target, owned by the same user. So there is no SSH key,
# no known_hosts secret and no sudo here. The gateway's equivalent carries
# sixty lines of host-key handling for the sole reason that its runners are on
# a different machine from its target.
#
# **To roll back**, dispatch this workflow with `sha` set to the commit to go
# back to. Rollback is a deploy of an older commit; it is not a separate
# mechanism, and inventing one would mean the emergency path is the one that
# has never been exercised.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to this branch's head). Set it to roll back.
        required: false

concurrency:
  group: cloud-agent-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy control plane + web
    # `CI` is one workflow with a `CI Gate` job precisely so this condition can
    # be a single conclusion. It was four workflows until #31; gating on one of
    # four would have meant treating "that workflow was filtered out" and "that
    # workflow has not started" as the same thing, and deploying on the second.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success') }}
    # Shared-live scheduling is enabled only after the host deployment has
    # proved that every runner locally attests shared-sandbox-v1. The target
    # control-plane script then requires a fresh heartbeat and reverse broker
    # probe before replacing anything. A new host remains backward-compatible
    # with the old control plane; the reverse order parks every new chat on a
    # capability no healthy host may claim.
    needs: deploy-host
    runs-on: [self-hosted, Linux, deploy-cloud-agent-control-staging]
    # Records the deployment, so staging appears in the repository's
    # Deployments panel beside production instead of being visible only to
    # someone who knows to open the Actions tab — and knows that a
    # `workflow_run` job is filed under the default branch, so filtering the
    # run list by `dev` shows nothing and reads as "it never deployed".
    #
    # Both jobs write to this one environment, matching production. The host
    # records first; this job records only after that prerequisite is green, so
    # the final successful deployment represents both halves of shared-live.
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${RUN_SHA:-${GITHUB_SHA}}}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "deploying ${sha}"

      # Checked out at the target commit so the script that runs is the one
      # being shipped: a change to deploy.sh takes effect in the deploy that
      # carries it, rather than one deploy later.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Deploy
        env:
          # Unset falls back to the script's own default, which is this
          # machine's path. Named here so production and staging are configured
          # the same way rather than one by variable and one by default.
          DEPLOY_ROOT: ${{ vars.STAGING_CONTROL_DEPLOY_ROOT }}
          # One rollout value drives both sides of the protocol. The repository
          # variable is the emergency off switch; unset means staging exercises
          # the feature PR #90 added instead of silently staying on legacy.
          DEPLOYMENT_ENVIRONMENT: staging
          STAGING_SHARED_LIVE_SANDBOX: ${{ vars.STAGING_SHARED_LIVE_SANDBOX || '1' }}
          AGENT_SHARED_LIVE_SANDBOX: ${{ vars.STAGING_SHARED_LIVE_SANDBOX || '1' }}
        run: bash deploy/control-plane/deploy.sh "${{ steps.target.outputs.sha }}"

      - name: What is running now
        if: always()
        env:
          DEPLOY_ROOT: ${{ vars.STAGING_CONTROL_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.STAGING_CONTROL_COMPOSE_PROJECT }}
        run: |
          root="${DEPLOY_ROOT:-/srv/freeinference-cloud-agent}"
          echo "deployed sha on host: $(cat "${root}/.deployed-sha" 2>/dev/null || echo unknown)"
          docker compose -p "${COMPOSE_PROJECT:-cloudagent}" \
            --env-file "${root}/.env" \
            -f "${root}/deploy/control-plane/docker-compose.yml" \
            ps 2>/dev/null || true

  deploy-host:
    name: Deploy runner host
    # The other machine. It goes first because it can serve the old control
    # plane while proving the new capability; the control-plane job then turns
    # scheduling on only after this job is green.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success') }}
    runs-on: [self-hosted, Linux, deploy-cloud-agent-sandbox-staging]
    environment: staging
    timeout-minutes: 45
    concurrency:
      group: cloud-agent-host-deploy
      cancel-in-progress: false

    steps:
      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${RUN_SHA:-${GITHUB_SHA}}}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "deploying ${sha}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Deploy
        env:
          # A repository variable rather than a literal: this path differs per
          # machine (the host user has no write access to /srv there) and a
          # deployment path does not belong in a repository that is going to be
          # public.
          DEPLOY_ROOT: ${{ vars.STAGING_SANDBOX_DEPLOY_ROOT }}
          # Which stack on that machine. It runs production's too, so this is
          # what says whose containers this deploy owns; `deploy.sh` refuses
          # rather than guessing when it is empty.
          COMPOSE_PROJECT: ${{ vars.STAGING_SANDBOX_COMPOSE_PROJECT }}
          SIBLING_COMPOSE_PROJECTS: ${{ vars.PROD_SANDBOX_COMPOSE_PROJECT }}
          DEPLOYMENT_ENVIRONMENT: staging
          # Keep the broker, runners and control plane on one rollout value.
          # Setting STAGING_SHARED_LIVE_SANDBOX=0 is the emergency off switch
          # for creation of new groups; durable existing groups remain pinned.
          STAGING_SHARED_LIVE_SANDBOX: ${{ vars.STAGING_SHARED_LIVE_SANDBOX || '1' }}
          AGENT_RESTARTABLE_SANDBOX: ${{ vars.STAGING_SHARED_LIVE_SANDBOX || '1' }}
          AGENT_SHARED_LIVE_SANDBOX: ${{ vars.STAGING_SHARED_LIVE_SANDBOX || '1' }}
          # One capacity value drives both the number of synchronous runner
          # executors and the scheduler slots they advertise. Letting these
          # drift can claim three simultaneous turns with only one process
          # available to execute them, silently serialising fork siblings.
          AGENT_HOST_SLOTS: ${{ vars.STAGING_HOST_SLOTS || '3' }}
          AGENT_RUNNER_REPLICAS: ${{ vars.STAGING_HOST_SLOTS || '3' }}
          AGENT_CHAT_IDLE_TIMEOUT_S: "1800"
          # Docker, not a chat bind mount, owns retained writable layers. Set
          # the repository variable if this daemon uses a non-default data-root.
          AGENT_RETAINED_DOCKER_DATA_ROOT: ${{ vars.STAGING_RETAINED_DOCKER_DATA_ROOT || '/var/lib/docker' }}
        run: bash deploy/host/deploy.sh "${{ steps.target.outputs.sha }}"

      - name: What is running now
        if: always()
        env:
          DEPLOY_ROOT: ${{ vars.STAGING_SANDBOX_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.STAGING_SANDBOX_COMPOSE_PROJECT }}
        run: |
          echo "deployed sha on host: $(cat "${DEPLOY_ROOT}/.deployed-sha" 2>/dev/null || echo unknown)"
          docker ps --filter "label=com.docker.compose.project=${COMPOSE_PROJECT}" \
            --format '  {{.Names}}  {{.Status}}' 2>/dev/null || true

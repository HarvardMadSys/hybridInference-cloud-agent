name: Deploy Prod

# Production deploys by hand, and only by hand.
#
# Staging deploys on every green merge to `dev`, because that is what makes
# "deployed" and "merged" the same fact. Production is the opposite case: the
# cutover plan (task H3) requires that deploy to ride alone — no other change
# shares it — and an automatic trigger would make that isolation a property of
# merge timing rather than of a decision. `sync-main.yml` moves `main`, this
# ships it, and the two stay separate acts.
#
# **Deploy the gateway first, this second.** The contract runs one way: this
# service calls the gateway's identity and `/internal/*` routes, and the gateway
# calls nothing here. A control plane shipped ahead of the gateway that serves
# it is a control plane calling routes that answer 404.
#
# Before the first production deploy, ask the gateway whether it is ready to be
# federated with at all — as of 2026-08-06 it is not, having neither an identity
# key nor a dispatch token:
#
#     GATEWAY_GRANT_DISPATCH_TOKEN=... python deploy/preflight/check_gateway.py https://<production gateway>
#
# It is read-only and exits non-zero unless every precondition passes. It is not
# a step here because it needs `httpx`, and this job runs on a deploy host whose
# Python environment is not this repository's.
#
# Nothing here gates on CI having passed. `main` only ever fast-forwards from
# `dev` (`sync-main.yml`), and every commit on `dev` arrived through a pull
# request that `CI Gate` had to pass. If `main` ever gains a commit some other
# way, this needs a check that the dispatched SHA is green before it deploys.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to the dispatched ref's head). Set it to roll back.
        required: false

concurrency:
  group: cloud-agent-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy control plane + web
    # Both halves start together. The retained executor is the only topology;
    # host deployment publishes exact target-SHA readiness, and deploy.sh waits
    # for a fresh heartbeat plus reverse-broker probe before replacing this
    # stack. The protocol fence preserves host-before-API compatibility without
    # serializing image builds and migrations in Actions.
    #
    # **The fuse.** `LEGACY_DIRECT_PRODUCTION_DEPLOY` is the migration switch
    # that hands production to FreeInference. Fail-closed: `false`, `yes`, an
    # empty value, a deleted variable or no variable at all leaves the hosts
    # untouched rather than shipping on a value nobody meant. GitHub's `==`
    # ignores case when comparing strings, so `True` and `TRUE` deploy as well;
    # that is its semantics rather than a choice made here, and the direction
    # that matters is the one that fails closed.
    #
    # Set it to `true` before this guard lands; set it to `false` as the last
    # step of the production handover, once the private deploy has been
    # exercised and rolled back.
    #
    # A migration artifact, not the terminal architecture: this workflow is
    # deleted with the source checkouts once FreeInference deploys production
    # from its own lock. Until then it is also the rehearsed rollback path, so
    # it is disarmed rather than removed.
    if: ${{ vars.LEGACY_DIRECT_PRODUCTION_DEPLOY == 'true' }}
    runs-on: [self-hosted, Linux, deploy-cloud-agent-control-prod]
    # Records the deployment and gives protection rules somewhere to live.
    # Required-reviewer rules need a public repository or a paid plan, so on
    # this repository today the environment gates nothing by itself — the gate
    # is that this workflow only ever runs because a person dispatched it.
    environment: production
    timeout-minutes: 30

    steps:
      # Fail before touching anything if this deployment has not been told where
      # it lives. `deploy/control-plane/deploy.sh` defaults `DEPLOY_ROOT` to
      # /srv/freeinference-cloud-agent, which is also *staging's* path: letting
      # that default apply here means a mislabelled runner deploys the
      # production commit into the staging checkout, and the first sign of it is
      # staging restarting on a commit nobody sent there.
      - name: Require this deployment's paths
        env:
          DEPLOY_ROOT: ${{ vars.PROD_CONTROL_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ROOT}" ]; then
            echo "::error::Repository variable PROD_CONTROL_DEPLOY_ROOT is unset. Set it to the production control-plane checkout path (see deploy/control-plane/README-cd.md) before deploying."
            exit 1
          fi
          echo "deploy root: ${DEPLOY_ROOT}"

      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${GITHUB_SHA}}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "deploying ${sha}"

      - name: Check out deployment orchestrator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-orchestrator
          fetch-depth: 1

      - name: Check out target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: .deploy-target
          fetch-depth: 0

      - name: Deploy
        env:
          DEPLOY_ROOT: ${{ vars.PROD_CONTROL_DEPLOY_ROOT }}
          # Unset is fine — deploy.sh falls back to its own default. It matters
          # only where production shares a machine with another stack of this
          # service, in which case two deploys under one project name are one
          # deploy.
          COMPOSE_PROJECT: ${{ vars.PROD_CONTROL_COMPOSE_PROJECT }}
          SOURCE_REPO: ${{ github.workspace }}/.deploy-target
        run: bash .deploy-orchestrator/deploy/control-plane/deploy.sh "${{ steps.target.outputs.sha }}"

      - name: What is running now
        if: always()
        env:
          DEPLOY_ROOT: ${{ vars.PROD_CONTROL_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.PROD_CONTROL_COMPOSE_PROJECT }}
        run: |
          [ -n "${DEPLOY_ROOT}" ] || exit 0
          echo "deployed sha on host: $(cat "${DEPLOY_ROOT}/.deployed-sha" 2>/dev/null || echo unknown)"
          docker compose -p "${COMPOSE_PROJECT:-cloudagent}" \
            --env-file "${DEPLOY_ROOT}/.env" \
            -f "${DEPLOY_ROOT}/deploy/control-plane/docker-compose.yml" \
            ps 2>/dev/null || true

  deploy-host:
    name: Deploy sandbox host
    # Runs in parallel with the control build. The control deployment cannot
    # replace its old API until this exact SHA has passed host readiness.
    #
    # The same fuse as the control job above, and the same variable: production
    # is handed over whole, so a switch that left the host half deploying would
    # be a second control plane in everything but name.
    if: ${{ vars.LEGACY_DIRECT_PRODUCTION_DEPLOY == 'true' }}
    runs-on: [self-hosted, Linux, deploy-cloud-agent-sandbox-prod]
    environment: production
    timeout-minutes: 45
    concurrency:
      # Serialize production host rollouts with production only. Staging uses
      # its own namespaced stack and may deploy in parallel; exact-SHA
      # readiness still fences each control-plane rollout against its host.
      group: cloud-agent-prod-host-deploy
      cancel-in-progress: false

    steps:
      # Both are required, and for different reasons. The path differs per
      # machine and `deploy/host/deploy.sh` refuses to run without it. The
      # project name is what keeps this stack apart from staging's on a host
      # that runs both — and sharing it is silent, since compose adopts the
      # other environment's containers rather than refusing them.
      - name: Require this deployment's paths
        env:
          DEPLOY_ROOT: ${{ vars.PROD_SANDBOX_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.PROD_SANDBOX_COMPOSE_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ROOT}" ]; then
            echo "::error::Repository variable PROD_SANDBOX_DEPLOY_ROOT is unset. Set it to the production sandbox host's checkout path (see deploy/control-plane/README-cd.md) before deploying."
            exit 1
          fi
          if [ -z "${COMPOSE_PROJECT}" ]; then
            echo "::error::Repository variable PROD_SANDBOX_COMPOSE_PROJECT is unset. Set it to this stack's compose project (e.g. freeinference-cloud-agent-sandbox-prod)."
            exit 1
          fi
          echo "deploy root: ${DEPLOY_ROOT}  project: ${COMPOSE_PROJECT}"

      - name: Resolve the commit to deploy
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${GITHUB_SHA}}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "deploying ${sha}"

      - name: Check out deployment orchestrator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .deploy-orchestrator
          fetch-depth: 1

      - name: Check out target
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: .deploy-target
          fetch-depth: 0

      - name: Deploy
        env:
          DEPLOY_ROOT: ${{ vars.PROD_SANDBOX_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.PROD_SANDBOX_COMPOSE_PROJECT }}
          # Staging's stack on this same machine is expected company, not a
          # stray. Naming it keeps the guard pointed at what it is actually for:
          # a second copy of *this* stack under a name nobody meant.
          SIBLING_COMPOSE_PROJECTS: ${{ vars.STAGING_SANDBOX_COMPOSE_PROJECT }}
          AGENT_HOST_SLOTS: ${{ vars.PROD_HOST_SLOTS || '3' }}
          AGENT_RUNNER_REPLICAS: ${{ vars.PROD_HOST_SLOTS || '3' }}
          AGENT_CHAT_IDLE_TIMEOUT_S: "1800"
          # Daemon-owned retained state, never a per-chat bind mount.
          AGENT_RETAINED_DOCKER_DATA_ROOT: ${{ vars.PROD_RETAINED_DOCKER_DATA_ROOT || '/var/lib/docker' }}
          SOURCE_REPO: ${{ github.workspace }}/.deploy-target
        run: bash .deploy-orchestrator/deploy/host/deploy.sh "${{ steps.target.outputs.sha }}"

      - name: What is running now
        if: always()
        env:
          DEPLOY_ROOT: ${{ vars.PROD_SANDBOX_DEPLOY_ROOT }}
          COMPOSE_PROJECT: ${{ vars.PROD_SANDBOX_COMPOSE_PROJECT }}
        run: |
          [ -n "${DEPLOY_ROOT}" ] || exit 0
          echo "deployed sha on host: $(cat "${DEPLOY_ROOT}/.deployed-sha" 2>/dev/null || echo unknown)"
          docker ps --filter "label=com.docker.compose.project=${COMPOSE_PROJECT}" \
            --format '  {{.Names}}  {{.Status}}' 2>/dev/null || true

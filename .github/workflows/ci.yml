name: CI

# One workflow, because release publication hangs off it.
#
# This was four — Backend CI, Web CI, Secret Scan, Docker Build — each with its
# own `paths:` filter. That arrangement cannot produce a trustworthy "this
# commit is good" signal, which is exactly what publication needs to gate on. A
# backend-only change does not run Web CI at all, and over the API a workflow
# that was filtered out is indistinguishable from one that has not started yet:
# both are simply absent. A publisher reading that has to treat "absent" as
# "fine", and the first time it is wrong it releases unverified code.
#
# Inside one workflow the same condition is a *state*: a job whose paths did not
# match is `skipped`, which is reported, not missing. `CI Gate` can then assert
# that every job either succeeded or was skipped, and `publish.yml` hangs off
# this workflow alone.
#
# The path filters keep their meaning — they moved from four `on:` blocks into
# the `changes` job below, which is also the only place they now have to agree
# with each other.

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Pull requests execute unreviewed code: tests, package install hooks and
# Dockerfiles. Every PR job, from a fork or from a branch of this repository,
# runs on a disposable GitHub-hosted VM, which a public repository gets without
# a minute quota. Persistent pools are reserved for pushes and manual
# dispatches, which also publish and synchronise. PRs keep a read-only token,
# checkout never persists it, and no PR job receives secrets. A fork can edit
# this file, so these expressions are not the boundary: the runner-group
# restrictions in docs/developer/development.md (#464) are.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.9.7"
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  changes:
    name: Classify Changes
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      web: ${{ steps.classify.outputs.web }}
      docker: ${{ steps.classify.outputs.docker }}
      docs: ${{ steps.classify.outputs.docs }}
      image_scope: ${{ steps.classify.outputs.image_scope }}
      artifacts: ${{ steps.images.outputs.artifacts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: the diff below needs both endpoints, and shallow-clone
          # packs with missing delta bases have been failing random checkouts
          # on this pool.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Fails open: anything this cannot resolve — a dispatch, a push with
          # no release in its history, a base commit the runner does not have —
          # runs everything. A misclassification that skips is a job that
          # silently did not check; one that over-runs costs a minute.
          files=""
          resolved=false
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              if [ -n "${PR_BASE_SHA:-}" ] && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
                files="$(git diff --name-only "${PR_BASE_SHA}" "${GITHUB_SHA}")"
                resolved=true
              fi
              ;;
            push)
              # From the newest release, not from the previous push. This run
              # is what lets publish.yml release this commit, and the previous
              # push may never have passed one: CI cancels a dev run when the
              # next push arrives, and a red run publishes nothing. A release
              # exists only for a commit whose own run passed, so everything
              # since the newest one is what this run has to check. Searched
              # from the parent, so re-running a released commit never compares
              # it with its own release and finds nothing to check.
              if release="$(git describe --tags --first-parent --match 'agent-*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null)"; then
                echo "classifying every change since the newest release, ${release}"
                files="$(git diff --name-only "${release}" "${GITHUB_SHA}")"
                resolved=true
              fi
              ;;
          esac

          if [ "${resolved}" != "true" ]; then
            echo "could not resolve a diff range (${GITHUB_EVENT_NAME}) — running everything"
            {
              echo "backend=true"
              echo "web=true"
              echo "docker=true"
              echo "docs=true"
              echo "image_scope=all"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "--- changed files ---"
          printf '%s\n' "${files}"
          echo "---------------------"

          matches() { printf '%s\n' "${files}" | grep -E "$1" >/dev/null; }

          # Backend: everything that is not purely docs or the web app. This is
          # the old `paths-ignore` inverted, so it stays true by default — a new
          # top-level directory runs the backend checks rather than skipping
          # them unnoticed.
          if printf '%s\n' "${files}" \
             | grep -vE '^(docs/|apps/frontend/)' \
             | grep -vE '(\.md|LICENSE|\.gitignore)$' \
             | grep . >/dev/null; then
            backend=true
          else
            backend=false
          fi

          # Web: the app itself.
          if matches '^apps/frontend/'; then web=true; else web=false; fi

          # Every source input to a release image must select image checks.
          # Tests derive COPY inputs from every artifact's Dockerfile, including
          # control-only code and migrations. .dockerignore changes every build
          # context even though no Dockerfile explicitly COPYs it. External
          # integration tests also select the jobs that provide their images.
          if matches '^(deploy/|apps/backend/|apps/frontend/|migrations/|tests/external/)' \
             || matches '^(pyproject\.toml|uv\.lock|README\.md|LICENSE|alembic\.ini|\.dockerignore)$'; then
            docker=true
          else
            docker=false
          fi

          # Docs: the site's sources, any Markdown file a page includes or
          # links to, and the locked Sphinx toolchain and the target that runs it.
          if matches '\.md$' \
             || matches '^docs/developer/' \
             || matches '^(pyproject\.toml|uv\.lock|Makefile)$'; then
            docs=true
          else
            docs=false
          fi

          # A change to CI itself runs all of it: the thing being changed is the
          # checking, and a filtered CI edit is checked by nothing.
          if matches '^(\.github/workflows/|scripts/ci_image_matrix\.py$)'; then
            backend=true; web=true; docker=true; docs=true
          fi

          # Narrow only source-only image changes. Deployment assets, external
          # tests, locks, workflow edits and the planner itself keep every image.
          # Keep backend's sandbox: MCP parity runs backend/host code against it.
          image_scope=all
          image_files="$(printf '%s\n' "${files}" | grep -E \
            '^(deploy/|apps/backend/|apps/frontend/|migrations/|tests/external/|\.github/workflows/|scripts/ci_image_matrix\.py$|pyproject\.toml$|uv\.lock$|README\.md$|LICENSE$|alembic\.ini$|\.dockerignore$)' || true)"
          if [ "${docker}" = true ] && [ -n "${image_files}" ]; then
            if ! printf '%s\n' "${image_files}" | grep -vE '^apps/frontend/' | grep . >/dev/null; then
              image_scope=web
            elif ! printf '%s\n' "${image_files}" | grep -vE '^(apps/backend/|migrations/|alembic\.ini$)' | grep . >/dev/null; then
              image_scope=backend
            fi
          fi

          {
            echo "image_scope=${image_scope}"
            echo "backend=${backend}"
            echo "web=${web}"
            echo "docker=${docker}"
            echo "docs=${docs}"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Plan image checks
        id: images
        env:
          IMAGE_SCOPE: ${{ steps.classify.outputs.image_scope }}
        run: python3 scripts/ci_image_matrix.py "${IMAGE_SCOPE}" >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------- backend
  # One job, three checks — not a three-cell matrix. Each cell paid for its own
  # checkout, uv install, Python install and `uv sync` in order to run a command
  # that takes about a second: measured over one run, 14s of environment for 1s
  # of linting. Keeping the checks together also avoids occupying several
  # runners with identical setup for one commit.
  #
  # `fail-fast: false` is what the matrix bought, and it is kept below: every
  # check runs even after one fails, and the job is red if any did. This also
  # matches `make lint`, which has run all three as one gate all along.
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas"), which fails
          # random jobs at checkout on this pool. A full fetch is immune.
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate uv cache dir
        # Set via GITHUB_ENV because job-level env cannot use the runner
        # context. The default ~/.cache/uv is shared by every runner process on
        # the machine, and an entry disappearing mid-install fails the job with
        # ENOENT while uv hardlinks into the venv. RUNNER_TEMP belongs to one
        # runner process, which runs one job at a time — that is the whole
        # isolation, so the path carries nothing else.
        #
        # In particular it must NOT carry GITHUB_RUN_ID. The cache service
        # derives an entry's version from the paths being cached, so a
        # per-run path misses on every restore and uploads a fresh copy every
        # time, which is both no cache at all and a fast way through the 10 GB
        # per-repository limit.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Cache pruning adds work after the checks and is unnecessary for
          # this job-local environment.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # `--locked` here and in every other job: a uv.lock that no longer
      # matches pyproject.toml fails instead of being re-resolved for this run.
      # The images install the committed lock as it stands, so checks run
      # against a fresh resolution would vouch for packages no image ships.
      - name: Sync dependencies
        run: uv sync --locked

      # `continue-on-error` on the checks and nowhere else. A setup step that
      # fails still stops the job outright — there is nothing to lint without a
      # venv, and three identical failures would only bury the cause. A *check*
      # that fails records its outcome and lets the others run, which is the
      # property the matrix had.
      - name: Ruff Format
        id: ruff_format
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Ruff Lint
        id: ruff_lint
        continue-on-error: true
        run: uv run ruff check --no-fix .

      - name: Pydocstyle
        id: pydocstyle
        continue-on-error: true
        run: uv run pydocstyle apps/backend/cloud_agent apps/backend/cloud_agent_host apps/backend/cloud_agent_shared

      # Blocking, and the store is inside it on purpose: a checker that cannot
      # see the class it validates callers against proves nothing about the
      # wiring, which is the point of cloud_agent/ports. Scope and strictness
      # live in [tool.mypy]; this only runs it.
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: uv run mypy

      # `continue-on-error` keeps a failed check from failing the job, so
      # without this the job would be green with a red step inside it. Same
      # shape as `CI Gate` below, for the same reason.
      - name: Every check passed
        env:
          RESULTS: >-
            ruff-format=${{ steps.ruff_format.outcome }}
            ruff-lint=${{ steps.ruff_lint.outcome }}
            pydocstyle=${{ steps.pydocstyle.outcome }}
            mypy=${{ steps.mypy.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for entry in ${RESULTS}; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "${result}" in
              success) ;;
              *) echo "::error title=Lint::${name} is ${result}"; failed=1 ;;
            esac
          done
          [ "${failed}" -eq 0 ] || exit 1
          echo "Lint: green"

  # A pull request splits the tier over two hosted VMs: on one, pytest took a
  # median 140s of the job's 174s. Trusted events keep it whole on the fast
  # persistent pool, whose few runners a second job would only queue for.
  # `scripts/ci_shard.py` deals whole files, so `--dist loadfile` and the
  # isolation it buys are unchanged, and the shards cover each file once.
  #
  # Unlike the other backend jobs, this one runs whatever changed: its tests
  # read files the classifier counts as docs or web app. The credential
  # backstop scans every tracked file, the environment inventory reads
  # apps/frontend/ and ENVIRONMENT.md, and the deployment tests read every
  # Markdown file under docs/. Filtered by `backend`, a docs- or frontend-only
  # change that broke one of them passed here and failed the next backend one.
  test:
    name: Tests (${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 1 }})
    needs: changes
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1]') }}
    env:
      SHARD: ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 1 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate uv and npm cache dirs
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked

      # -n 4 --dist loadfile, not a serial run: the four workers split the test
      # files between separate processes, so a file that only passes because
      # another file ran first in the same process fails here. A serial run
      # silently passes on that class of bug.
      - name: Pytest
        run: |
          set -euo pipefail
          # One shard already covers testpaths; avoid collecting the suite twice.
          paths=(tests)
          if [ "${SHARD}" != "1/1" ]; then
            files="$(uv run python scripts/ci_shard.py --shard "${SHARD}" -- -m "not external and not dbtest")"
            mapfile -t paths <<< "${files}"
          fi
          uv run pytest -n 4 --dist loadfile -q -m "not external and not dbtest" "${paths[@]}"

      # The external checks below run once per commit, in the first shard.
      # Each test skips when what this job hands it is missing, and pytest
      # calls a run that only skipped a success, so every external step in this
      # workflow keeps a junit report and `scripts/ci_tests_ran.py` fails the
      # step if any test in it declined to run.
      #
      # A single OS user cannot reproduce a sibling CLI's 0700 process registry.
      # Check the real normalizer across Linux UIDs before allowing deployment.
      - name: Shared member permissions survive a sibling CLI restart
        if: matrix.shard == 1
        timeout-minutes: 5
        env:
          AGENT_PERMISSION_TEST_IMAGE: python:3.12-slim
        run: |
          set -euo pipefail
          docker pull "${AGENT_PERMISSION_TEST_IMAGE}"
          uv run pytest -q -m external tests/external/test_shared_member_permissions.py \
            --junitxml="${RUNNER_TEMP}/shared-member-permissions.xml"
          uv run python scripts/ci_tests_ran.py "${RUNNER_TEMP}/shared-member-permissions.xml"

      # Completion can precede the native CLI's history flush. Unit doubles
      # cannot catch that race; exercise the shipped pin before CI can deploy.
      # Inference is a loopback protocol fixture, with no API key or model cost.
      - name: Set up Node for native CLI regression
        if: matrix.shard == 1
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the sandbox's pinned Claude CLI
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' deploy/sandbox/Dockerfile.agent-sandbox)
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/claude-context" \
            "@anthropic-ai/claude-code@${version}"
          echo "CLOUD_AGENT_TEST_CLAUDE_BINARY=${RUNNER_TEMP}/claude-context/node_modules/.bin/claude" >> "${GITHUB_ENV}"

      - name: Install the sandbox's pinned Claude SDK
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*org\.freeinference\.helper\.claude-agent-sdk\.version="\([^"]*\)".*/\1/p' deploy/sandbox/Dockerfile.agent-sandbox)
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          uv pip install --python .venv/bin/python --target "${RUNNER_TEMP}/claude-context-sdk" \
            "claude-agent-sdk==${version}"

      # `-n 4 --dist load`, deliberately not the `--dist loadfile` the other
      # suites use: loadfile groups by file, and here the file *is* the suite,
      # so it would hand all four tests to a single worker and change nothing.
      # Each test already gets its own tmp_path, its own HOME and config
      # directory (monkeypatched), its own CLI process and its own loopback
      # port — `FakeAnthropicGateway` binds port 0 — so there is nothing for
      # parallel workers to collide over.
      - name: Native history survives close, restore and failed-turn retry
        if: matrix.shard == 1
        timeout-minutes: 10
        env:
          PYTHONPATH: ${{ runner.temp }}/claude-context-sdk
        run: |
          set -euo pipefail
          uv run pytest -q -n 4 --dist load -m external tests/external/test_claude_driver_context.py \
            --junitxml="${RUNNER_TEMP}/claude-driver-context.xml"
          uv run python scripts/ci_tests_ran.py "${RUNNER_TEMP}/claude-driver-context.xml"

  # The other half of that command. `test` above deselects `dbtest`, and until
  # this job existed nothing selected it — 158 tests that were written, green,
  # and never once executed by CI. The cost of that is on the record: a
  # router/test mismatch survived a whole migration, and the xfail that marked
  # it until it was fixed said why — "It was never caught because the dbtest
  # tier does not run in CI."
  #
  # These tests need a real Postgres because what they pin lives in SQL, not in
  # Python: `FOR UPDATE SKIP LOCKED` is the entire guarantee that two workers
  # cannot claim one job, and lease_generation fencing is the entire guarantee
  # that a superseded attempt cannot publish a duplicate PR. A fake store can
  # only restate what its author believed those statements do.
  #
  # A separate job rather than dropping the deselect from `test`: that job is
  # the fast, dependency-free one that every backend change waits on, and it
  # stays that way. The split also matches `make test` / `make test-db`, which
  # is the contract AGENTS.md already documents.
  #
  # Sharded like `test`, and for the same reason: on one hosted VM the tier took
  # a median 218s of a 244s job. Each shard gets a Postgres of its own.
  test-db:
    name: Tests (Postgres, ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 1 }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # This pool can start service containers; postgres:15 supports ARM64.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1]') }}
    env:
      SHARD: ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 1 }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The name the fixtures already default to. They were written against
          # the gateway repo's CI, which provides exactly this; the tests moved
          # here in the split and the database did not.
          POSTGRES_DB: hybridinference_test_db
        ports:
          - 5432/tcp
        # 1s, not the 10s this was copied from. Docker runs the first probe one
        # interval after start, so a 10s interval means the job waits at least
        # ten seconds no matter how fast Postgres is. Measured on this runner:
        # 10.3s to healthy at `10s`, 2.5s at `1s` — the server is ready in
        # about two. `pg_isready` is a connect-and-exit, so probing it every
        # second costs nothing worth counting.
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate uv cache dir
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      # Into GITHUB_ENV from a step, and not a job-level `env:` block, because
      # the `job` context — which is where the mapped host port lives — is not
      # available to `jobs.<id>.env`. A job-level block referencing it does not
      # fail at the step; the whole workflow is rejected before anything runs.
      #
      # The port is looked up rather than fixed at 5432: `ports: - 5432/tcp`
      # asks for an ephemeral host port and avoids coupling the test to runner
      # image internals.
      - name: Point the fixtures at the service container
        run: |
          {
            echo "TEST_DB_HOST=localhost"
            echo "TEST_DB_PORT=${{ job.services.postgres.ports['5432'] }}"
            echo "TEST_DB_NAME=hybridinference_test_db"
            echo "TEST_DB_USER=postgres"
            echo "TEST_DB_PASSWORD=postgres"
          } >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked

      # Before pytest, because every dbtest fixture answers an unreachable
      # database with `pytest.skip`, not a failure. That is right for a laptop
      # with no Postgres and exactly wrong here: it makes "green having run
      # nothing" this job's natural failure mode, which is the same false
      # signal the job exists to remove. So connectivity is asserted where it
      # can still fail loudly.
      - name: The database is actually reachable
        run: |
          uv run python - <<'PY'
          import os, sys
          import asyncpg, asyncio

          async def main():
              conn = await asyncpg.connect(
                  host=os.environ["TEST_DB_HOST"],
                  port=int(os.environ["TEST_DB_PORT"]),
                  database=os.environ["TEST_DB_NAME"],
                  user=os.environ["TEST_DB_USER"],
                  password=os.environ["TEST_DB_PASSWORD"],
              )
              print(await conn.fetchval("SELECT version()"))
              # A throwaway database does not need durability, and this one is
              # asked to give it up hundreds of times a run: the fixtures
              # truncate 25 tables around every test, and each TRUNCATE fsyncs
              # a directory entry. Measured on this runner — 445ms per call
              # with fsync on, 10ms with it off, across 329 tests. The
              # container is deleted with the job; there is nothing to lose.
              await conn.execute("ALTER SYSTEM SET fsync = off")
              await conn.execute("SELECT pg_reload_conf()")
              # The reload is asynchronous. Confirm it landed before pytest
              # opens its own connections, or the saving disappears silently.
              for _ in range(50):
                  if await conn.fetchval("SHOW fsync") == "off":
                      break
                  await asyncio.sleep(0.1)
              print("fsync:", await conn.fetchval("SHOW fsync"))
              # One database per xdist worker. The fixtures already derive their
              # name from PYTEST_XDIST_WORKER and each runs its own
              # `alembic upgrade head`; the service container creates only the
              # base one, so without these the parallel run cannot connect at
              # all — and a fixture that cannot connect skips rather than
              # fails. The "tier actually ran" step below is what would catch
              # that, but creating them here is what makes it not happen.
              for index in range(4):
                  name = f"{os.environ['TEST_DB_NAME']}_gw{index}"
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1", name
                  )
                  if not exists:
                      await conn.execute(f'CREATE DATABASE "{name}"')
                      print(f"created {name}")
              await conn.close()

          asyncio.run(main())
          PY

      # `-n 4 --dist loadfile`, and loadfile is the load-bearing half: the
      # fixtures shard by worker database (`..._gw0`…`..._gw3`, created above),
      # and `reset_agent_tables` empties a whole schema with one
      # `TRUNCATE ... CASCADE`. Sharding finer than a file would let two workers
      # truncate the same database out from under each other; sharding by file
      # also matches how the fixtures are written, since several files import
      # another file's `store` fixture rather than opening their own.
      #
      # Serial until now for exactly one reason: the service container created a
      # single database, so four workers would have failed to connect and
      # skipped, and the guard below would have had to catch it. Measured on
      # spark2 with the worker databases present: 343s serial, 166s this way,
      # the same 329 tests, zero skips.
      - name: Pytest (dbtest tier)
        run: |
          set -euo pipefail
          # One shard already covers testpaths; avoid collecting the suite twice.
          paths=(tests)
          if [ "${SHARD}" != "1/1" ]; then
            files="$(uv run python scripts/ci_shard.py --shard "${SHARD}" -- -m "dbtest")"
            mapfile -t paths <<< "${files}"
          fi
          uv run pytest -q -n 4 --dist loadfile -m "dbtest" --junitxml="${RUNNER_TEMP}/dbtest.xml" "${paths[@]}"

      # Once per commit, not once per shard.
      - name: Previous release survives the candidate migration
        if: matrix.shard == 1
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-${BEFORE_SHA:-HEAD^}}"
          # Published tags follow a successful deployment. This also covers a
          # dev commit whose preceding commit never reached staging. GitHub
          # releases create lightweight tags, so include them with --tags.
          previous="$(git describe --tags --first-parent --match 'agent-*' --abbrev=0 "$base")"
          uv run python scripts/check_rolling_upgrade.py --base "$previous"

      # The second half of the same guard. A fixture that skips on a database
      # it cannot reach turns a broken service container into a passing job,
      # and a `pytest -m` that silently matches nothing exits 0 too. Neither is
      # distinguishable from success in the check list, so assert the shape of
      # the run rather than trusting its exit code.
      - name: The tier actually ran
        run: |
          uv run python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          root = ET.parse(os.environ["RUNNER_TEMP"] + "/dbtest.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          ran = int(suite.get("tests", 0))

          # Per-testcase, not the suite's `skipped` attribute: junit counts an
          # xfail as a skip, although an xfail ran. Only type="pytest.skip" is a
          # test that declined to run, which is what a database-less run
          # produces.
          skipped = [
              tc.get("name")
              for tc in suite.iter("testcase")
              for sk in tc.findall("skipped")
              if sk.get("type") == "pytest.skip"
          ]
          print(f"dbtest: {ran} collected, {len(skipped)} skipped")

          # A floor, not the exact count, so adding tests never fails this. It
          # only has to be high enough that a database-less run cannot clear
          # it — that run skips all of them.
          if ran < 100:
              sys.exit(f"only {ran} dbtests ran; the tier is not being selected")
          if skipped:
              sys.exit(
                  f"{len(skipped)} dbtests skipped — the fixtures skip when Postgres "
                  f"is unreachable, so this job proved nothing: {skipped[:5]}"
              )
          PY
  # -------------------------------------------------------------------- web
  # Two jobs: the checks, and the builds. The checks stay together for the
  # reason spelled out over `lint` above — and more sharply here, because Node
  # costs more to install than uv does. Measured over one run: 55s of setup
  # across five cells for 27s of actual checking, and four of the five spent
  # longer installing than working (Prettier: 10s of setup, 1s of formatting
  # check). The builds are a different size. On a hosted pull-request VM one
  # job took 326s, 116s of it unit tests and 141s the two builds, so `web-build`
  # runs them beside the checks and pays the ~25s of setup a second time rather
  # than waiting for them. The guard builds the one that must fail, and the
  # acceptance builds both web variants. That replaces a plain `npm run build`
  # step rather than adding to it.
  #
  # The unit tests then took a median 142s of `check`'s 208s, so a pull request
  # splits them over two VMs with vitest's own `--shard`, and the first shard
  # also runs the three quick checks. Trusted events keep one shard, as `test`.
  check:
    name: Web (${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 1 }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2]' || '[1]') }}
    env:
      SHARD: ${{ matrix.shard }}/${{ github.event_name == 'pull_request' && 2 || 1 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: shallow-clone packs with missing delta bases have been
          # failing random checkouts on this pool.
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the npm cache dir
        # Off the shared ~/.npm and onto this runner process's own temp, which
        # runs one job at a time. Set before setup-node, which reads
        # `npm config get cache` to decide where to restore into.
        #
        # Stable, with no run id in it: the cache service versions an entry by
        # the paths it covers, so a per-run path would never restore and would
        # upload a new copy of node_modules' cache on all five cells, every
        # run. Same reasoning as UV_CACHE_DIR in backend-ci.
        run: |
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "${GITHUB_ENV}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: npm ci

      # Ordered cheapest-first so a formatting slip is reported in seconds
      # rather than after the build. They no longer run concurrently, so the
      # order is now something a reader can spend.
      - name: ESLint
        id: eslint
        if: matrix.shard == 1
        continue-on-error: true
        working-directory: ./apps/frontend
        run: npm run lint

      - name: Prettier
        id: prettier
        if: matrix.shard == 1
        continue-on-error: true
        working-directory: ./apps/frontend
        run: npm run format:check

      - name: TypeScript
        id: typescript
        if: matrix.shard == 1
        continue-on-error: true
        working-directory: ./apps/frontend
        run: npm run type-check

      - name: Tests
        id: tests
        continue-on-error: true
        working-directory: ./apps/frontend
        run: npm run test -- --shard="${SHARD}"

      # A skipped check is only acceptable in a shard that does not run it.
      - name: Every check passed
        env:
          RESULTS: >-
            eslint=${{ steps.eslint.outcome }}
            prettier=${{ steps.prettier.outcome }}
            typescript=${{ steps.typescript.outcome }}
            tests=${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for entry in ${RESULTS}; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "${result}" in
              success) ;;
              skipped) [ "${SHARD%%/*}" != 1 ] || { echo "::error title=Web::${name} is skipped"; failed=1; } ;;
              *) echo "::error title=Web::${name} is ${result}"; failed=1 ;;
            esac
          done
          [ "${failed}" -eq 0 ] || exit 1
          echo "Web: green"

  web-build:
    name: Web builds
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: shallow-clone packs with missing delta bases have been
          # failing random checkouts on this pool.
          fetch-depth: 0
          persist-credentials: false

      # Same directory, and so the same cache entry, as `check` above.
      - name: Isolate the npm cache dir
        run: |
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "${GITHUB_ENV}"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: npm ci

      # A Client Component importing the server config reader must fail the
      # build, and that is enforced by the bundler rather than by the module,
      # so only a real build proves it. The build is expected to fail; the
      # script exits non-zero when it does not.
      - name: Server-only guard
        id: server-only
        continue-on-error: true
        working-directory: ./apps/frontend
        run: node scripts/check-server-only-guard.mjs

      # Builds both web variants — root and `/agents` — and boots each under
      # two runtime environments. A unit test cannot see this: the failure
      # being guarded against is configuration resolved at `next build` and
      # frozen into the bundle, and only the built server can show whether
      # that happened. See the script's header for the full list of
      # assertions, including the sign-in and asset prefixes per variant.
      - name: Runtime site config
        id: runtime-config
        continue-on-error: true
        working-directory: ./apps/frontend
        run: node scripts/check-runtime-site-config.mjs

      - name: Every check passed
        env:
          RESULTS: >-
            server-only=${{ steps.server-only.outcome }}
            runtime-config=${{ steps.runtime-config.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for entry in ${RESULTS}; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "${result}" in
              success) ;;
              *) echo "::error title=Web builds::${name} is ${result}"; failed=1 ;;
            esac
          done
          [ "${failed}" -eq 0 ] || exit 1
          echo "Web builds: green"
  # ------------------------------------------------------------------ secret
  gitleaks:
    name: Gitleaks
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installing the release binary rather than using gitleaks-action, which
      # requires a paid license for organization repositories.
      #
      # Into RUNNER_TEMP and onto GITHUB_PATH, not `sudo install` into
      # /usr/local/bin: this runner's machine outlives the job and is shared.
      # A system-wide write means the gateway's CI and this one overwrite each
      # other's binary — today at the same version, silently at different ones
      # the moment either bumps GITLEAKS_VERSION, and the scan that runs is
      # then whichever job installed last. Unpacking outside the workspace also
      # keeps the tarball out of the tree the next step scans.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "${bindir}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          install -m 0755 gitleaks "${bindir}/gitleaks"
          echo "${bindir}" >> "${GITHUB_PATH}"
          "${bindir}/gitleaks" version

      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      # This repository is intended to be open-sourced with its history intact,
      # so history is scanned too — a secret removed in a later commit is still
      # published by the commit that introduced it.
      # Scan every ancestor of this checkout, including both parents of a PR
      # merge. The default --all also walks unrelated remote/PR refs retained
      # by a self-hosted runner, so an obsolete commit from another PR can fail
      # this one even after that other branch has been fixed and deleted.
      - name: Scan history
        run: gitleaks detect --source . --redact --verbose --no-banner --log-opts="--full-history HEAD"
  # --------------------------------------------------------------- artifacts
  # One cell per artifact, on the architecture that artifact is deployed to:
  # build it, then start it. Both halves in one job deliberately — a self-hosted
  # runner is a machine, not a shared filesystem, so an image built in one job
  # is not there for the next one, and passing it between jobs would mean a
  # registry, which would put a publishing credential in the pull-request path.
  #
  # Starting it is the half that catches what building cannot. The since-removed
  # egress proxy was the standing example: it built, its config parsed, and it
  # exited on every start for two days because squid opened its logs after
  # dropping to an unprivileged user — and the runner's isolation preflight,
  # correctly refusing to run without it, took three runners down behind it.
  #
  # The checks live in `deploy/release/smoke.py` rather than here, because the
  # publication workflow runs the same script against the images it is about to
  # push. Two copies of "it starts" would drift, and the copy that matters is
  # the one applied to the bytes that get published.
  artifacts:
    name: ${{ matrix.artifact.name }} (${{ matrix.artifact.arch }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (matrix.artifact.arch == 'arm64' && '["ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') || matrix.artifact.runner) }}
    # The builder lives in a config directory belonging to the *runner*, not to
    # this job, because its layer cache is the only thing between a cell and
    # re-downloading hundreds of megabytes. With a builder per job the cache
    # dies with it: the sandbox cell spent 120s of its 162s pulling a single
    # 522MB layer back out of `type=gha` at 4.4MB/s. Measured on spark2 with
    # one builder used twice — 10.3s cold, 0.54s warm.
    #
    # Per runner is safe because a runner executes one job at a time, so
    # nothing races for the pointer, and `RUNNER_NAME` keeps two runners on one
    # host apart. The directory sits under `_work`, which the runner does not
    # clean between jobs, unlike `RUNNER_TEMP`.
    #
    # None of this goes near `$HOME/.docker/buildx`. That pointer records no
    # owner, and on 2026-09-11 a cell finishing while the staging deploy was
    # mid-build deleted the builder out from under it — `target migrate:
    # failed to receive status`, `graceful_stop`.
    #
    # On the persistent pools the builder is the cache, and nothing here
    # imports or exports a GHA cache there. Importing one made a warm runner
    # download 835MB it already held, while retaining only the exporter later
    # spent 154s uploading the same sandbox layers for a cache no build
    # consumed. Under three concurrent sandbox builds on this host, that
    # write-only export took more than 15 minutes. A cold builder rebuilds once
    # and then stays warm.
    #
    # A pull request's VM is always cold, so its sandbox build imports the
    # layers `pr-caches` exports after each push to dev, from a hosted VM whose
    # upload does not compete with these hosts. Pull requests only ever read
    # that cache; nothing in a pull request can write what another one restores.
    strategy:
      fail-fast: false
      matrix:
        # The planner keeps both web mount variants and the release's native
        # architectures. Shared inputs select the complete catalog; source-only
        # edits select the affected images and backend's real-CLI sandbox checks.
        artifact: ${{ fromJSON(needs.changes.outputs.artifacts) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Named per run, so a retry and a concurrent attempt stay independently
      # diagnosable and a run that dies before cleanup leaves something
      # identifiable behind rather than a bare image id.
      - name: Name this cell's artifacts
        run: |
          # Run, attempt *and artifact*: the seven cells of one run share the
          # first two, several of them land on the same Docker host, and the
          # cleanup below removes containers by this label. Without the artifact
          # name, the first cell to finish deletes the others' containers while
          # they are still being tested — which is exactly what the control
          # cell and the since-removed egress cell did, twice, before this.
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.artifact.name }}"
          echo "IMAGE_TAG=${{ matrix.artifact.name }}:ci-${suffix}" >> "${GITHUB_ENV}"
          echo "SUFFIX=${suffix}" >> "${GITHUB_ENV}"
          # Credentials of this job's own. The runners on this machine share
          # one $HOME, and docker/login-action's post step logs *out* at the
          # end of its job — from the shared ~/.docker/config.json. That is
          # where the runner user's persistent Docker Hub login lives, the one
          # the service containers and the `docker pull` in Tests rely on, so
          # every image cell that finished was logging the whole machine out
          # again. (In the publication workflow the same logout stripped the
          # credentials of the cells still running beside it.) A config
          # directory per job makes the logout a no-op for everyone else.
          # Buildx state is unaffected; it lives in BUILDX_CONFIG.
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      # Authenticated pulls. Rate limits are per *account* once logged in and
      # per *IP* when not — and this machine's egress address is shared with the
      # other repository's CI, so the anonymous allowance is spent by two
      # projects. It ran out twice today and took every image cell with it.
      # Authenticated it is 200 pulls an hour, attributed to the account:
      # verified on spark2, `docker-ratelimit-source: realtmxi`,
      # `x-ratelimit-limit: 200;w=3600`.
      #
      # Before the builder step, not before the build: creating a builder pulls
      # `moby/buildkit` from Docker Hub too, and that was the first thing the
      # 429 blocked.
      - name: Log in to Docker Hub
        # PRs use anonymous pulls and receive no registry credential, including
        # same-repository PRs where GitHub would otherwise make secrets available.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The sandbox build and its runtime copies need more space than a
      # private repository's hosted runner leaves free. These preinstalled SDKs
      # are unused by this job; sandbox toolchains are installed inside the
      # image. Deleting them takes about 90s, and a public repository's runner
      # starts with roughly 80GB free, so only a runner under 40GB pays for it.
      - name: Free unused SDKs on the hosted sandbox runner
        if: github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox'
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -dc '0-9')"
          if [ "${available_kib:-0}" -lt $((40 * 1024 * 1024)) ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      # Reused across jobs, and self-healing: a builder whose buildkitd will not
      # start is removed and recreated rather than failing every later cell.
      # `--bootstrap` is what proves it started, so it doubles as the check.
      #
      # The *name* carries the runner too, and that is not decoration. A config
      # directory keeps the builder definitions apart, but buildx names the
      # buildkitd container after the builder alone: two runners whose builder
      # is both called `ci-persistent` share one
      # `buildx_buildkit_ci-persistent0`, and one runner's self-heal deletes the
      # container the other is building through. Verified on spark2 — with a
      # shared name, removing A's builder takes the container with it; with
      # `ci-<runner>` each keeps its own, and B's buildkitd start time does not
      # move while A rebuilds.
      - name: Reuse this runner's builder, or make one
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            builder_scope="$(
              printf '%s-%s' "${GITHUB_REPOSITORY}" "${RUNNER_NAME}" \
                | tr '[:upper:]' '[:lower:]' \
                | tr -c '[:alnum:]_.-' '-'
            )"
            builder_prefix="ci-pr-${builder_scope}-"
            buildx_config="${RUNNER_TEMP}/buildx"
            builder="${builder_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.artifact.name }}"
          else
            buildx_config="$(dirname "${RUNNER_WORKSPACE}")/buildx/${RUNNER_NAME}"
            builder="ci-${RUNNER_NAME}"
          fi
          mkdir -p "${buildx_config}"
          export BUILDX_CONFIG="${buildx_config}"
          echo "BUILDX_CONFIG=${buildx_config}" >> "${GITHUB_ENV}"
          echo "BUILDER=${builder}" >> "${GITHUB_ENV}"
          # A cancelled PR cannot run its final cleanup. On the next job for this
          # repository and runner, remove only that runner's orphaned builders.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            stale_prefix="buildx_buildkit_${builder_prefix}"
            while IFS= read -r container; do
              [ -n "${container}" ] || continue
              [ "${container}" = "buildx_buildkit_${builder}0" ] && continue
              case "${container}" in
                "${stale_prefix}"*)
                  docker rm -fv "${container}" >/dev/null 2>&1 || true
                  docker volume rm "${container}_state" >/dev/null 2>&1 || true
                  ;;
              esac
            done < <(
              docker ps -a --filter "name=${stale_prefix}" --format '{{.Names}}' \
                2>/dev/null || true
            )
          fi
          if ! docker buildx inspect "${builder}" --bootstrap >/dev/null 2>&1; then
            docker buildx rm "${builder}" >/dev/null 2>&1 || true
            docker buildx create --name "${builder}" --driver docker-container --use >/dev/null
            docker buildx inspect "${builder}" --bootstrap >/dev/null
          fi
          docker buildx use "${builder}" >/dev/null
          echo "builder ${builder} ready in ${buildx_config}"

      # `push: false` still: nothing here publishes, and these images carry no
      # credentials. The `docker` output is what puts the image on this
      # runner's daemon, which is where the smoke below starts it. Uncompressed,
      # because the daemon is the only consumer: on a hosted VM the sandbox spent
      # 60s compressing layers that the daemon then decompressed again.
      #
      # `SOURCE_COMMIT` is passed to every artifact because each Dockerfile
      # writes it into `org.opencontainers.image.revision`, and a release whose
      # images cannot name their commit is refused by every resolver. The smoke
      # asserts it arrived.
      - name: Build ${{ matrix.artifact.name }}
        id: build
        # The graceful_stop this retry was written for is not a transient
        # recycle: it is another job on this machine deleting the builder this
        # cell is building through. That is fixed. The retry stays as a
        # backstop, because a build can still fail for reasons of its own and
        # running it once more is cheaper than a red cell.
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ env.BUILDER }}
          context: .
          file: ${{ matrix.artifact.dockerfile }}
          push: false
          outputs: type=docker,compression=uncompressed
          # The docker exporter needs a name to load the image under. Without
          # this the build succeeds and the smoke then finds nothing to start:
          # `docker inspect <tag>` is the first thing it does, and a build that
          # produced an anonymous image reads as a missing one.
          tags: ${{ env.IMAGE_TAG }}
          cache-from: ${{ github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox' && 'type=gha,scope=sandbox-amd64' || '' }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            ${{ matrix.artifact.build_args }}

      # No builder work here: one that would not start was already replaced
      # before the first attempt. What can still fail is the build itself.
      - name: Build ${{ matrix.artifact.name }} (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ env.BUILDER }}
          context: .
          file: ${{ matrix.artifact.dockerfile }}
          push: false
          outputs: type=docker,compression=uncompressed
          # The docker exporter needs a name to load the image under. Without
          # this the build succeeds and the smoke then finds nothing to start:
          # `docker inspect <tag>` is the first thing it does, and a build that
          # produced an anonymous image reads as a missing one.
          tags: ${{ env.IMAGE_TAG }}
          cache-from: ${{ github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox' && 'type=gha,scope=sandbox-amd64' || '' }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            ${{ matrix.artifact.build_args }}

      # The image is loaded into Docker now. On a runner short of space, drop
      # unused intermediate layers from this disposable builder before the
      # retained-runtime tests make writable copies; persistent runner builders
      # keep their warm caches. The threshold is the one the SDK step uses.
      - name: Free the hosted sandbox builder's unused cache
        if: github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox'
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -dc '0-9')"
          if [ "${available_kib:-0}" -lt $((40 * 1024 * 1024)) ]; then
            docker buildx prune --builder "${BUILDER}" --all --force
          fi
          df -h /

      - name: Isolate uv cache dir
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          prune-cache: false

      # On the image this cell just built. Trusted events run all fifteen cases
      # here; a pull request runs the twelve that are not Kilo's, and `mcp`
      # runs Kilo's three on VMs of their own.
      - name: All five CLIs retain MCP through approval, resume and fork
        if: matrix.artifact.name == 'sandbox'
        timeout-minutes: 20
        env:
          MCP_TEST_SANDBOX_IMAGE: ${{ env.IMAGE_TAG }}
          MCP_TEST_RUN_LABEL: ${{ env.SUFFIX }}
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: hybridinference_test_mcp
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: mcp-conformance-only
          MCP_TEST_WORKERS: "3"
          # A pytest `-k` expression; empty selects every case. Test ids end
          # `-<runtime>]`, which no other runtime's ids contain.
          MCP_TEST_SELECTION: ${{ github.event_name == 'pull_request' && 'not kilo]' || '' }}
        run: |
          set -euo pipefail
          database="mcp-db-${SUFFIX}"
          trap 'docker rm -f "${database}" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "${database}" \
            --label "io.hybridinference.smoke.run=${SUFFIX}" \
            -e POSTGRES_DB="${TEST_DB_NAME}" -e POSTGRES_PASSWORD="${TEST_DB_PASSWORD}" \
            -p 127.0.0.1::5432 postgres:16-alpine
          # Probe TCP, not the socket. The image runs initdb against a
          # temporary server started with `listen_addresses=''` — reachable on
          # the unix socket and nowhere else — then stops it and starts the
          # real one. A socket probe answers "accepting connections" for that
          # temporary server, and the createdb below then lands in the shutdown
          # between the two: `FATAL: the database system is shutting down`.
          # TCP is also how the tests reach it, so it is the honest question.
          for attempt in $(seq 1 30); do
            if docker exec "${database}" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "${database}" pg_isready -h 127.0.0.1 -U postgres
          # The test config appends pytest-xdist's worker id to TEST_DB_NAME.
          # Give each worker its own database so migrations and state cannot race;
          # the Postgres container creates only the unsuffixed database.
          for worker in $(seq 0 "$((MCP_TEST_WORKERS - 1))"); do
            docker exec "${database}" createdb \
              -U "${TEST_DB_USER}" "${TEST_DB_NAME}_gw${worker}"
          done
          TEST_DB_PORT=$(docker port "${database}" 5432/tcp | awk -F: '{print $NF}')
          MCP_TEST_HOST=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          export TEST_DB_PORT MCP_TEST_HOST
          # All 15 cases are one parametrized function in one file, so loadfile
          # or loadscope would keep them serial. Dynamic load balances the real
          # CLI processes while the worker databases isolate their storage.
          uv run pytest -q -n "${MCP_TEST_WORKERS}" --dist load \
            -m external -k "${MCP_TEST_SELECTION}" tests/external/test_resident_mcp_parity.py \
            --junitxml="${RUNNER_TEMP}/mcp-parity.xml"
          uv run python scripts/ci_tests_ran.py "${RUNNER_TEMP}/mcp-parity.xml"

      # The smoke harness removes its image, so run it after the CLI matrix.
      - name: Start it, and assert what only starting shows
        run: |
          set -euo pipefail
          uv run --with-editable . python deploy/release/smoke.py \
            ${{ matrix.artifact.smoke_args }} \
            --image "${IMAGE_TAG}" \
            --suffix "${SUFFIX}" \
            --revision "${GITHUB_SHA}"

      # The harness removes what it started; this is the backstop for the paths
      # where it never got that far. Hosted runners are discarded, so it runs on
      # the persistent ones only: without it the machine accumulates a container
      # and an image per attempt until the disk fills, and the symptom lands on
      # whatever job happens to be running then. Containers first — an image with
      # a container still referencing it is not removed even with `-f`.
      - name: Drop this run's containers and image
        if: always() && runner.environment != 'github-hosted'
        run: |
          # Scoped by this cell's label, not by the name prefix: a shared
          # runner hosts several cells at once, so `--filter name=smoke-`
          # reaches into the others and kills their containers mid-check.
          docker ps -aq --filter "label=io.hybridinference.smoke.run=${SUFFIX}" \
            | xargs -r docker rm -f || true
          # Not `-f`. Forced removal untags an image another cell or run may
          # still be starting containers from; a plain `rm` refuses while any
          # container references it, so the worst case is a leftover image
          # rather than a tag pulled out from under somebody else. (It does not
          # delete containers — the removals above are what did that.)
          docker image rm "${IMAGE_TAG}" >/dev/null 2>&1 || true

      # Pull requests use job-local builders even on persistent runners. Remove
      # the buildkit container as well as its temporary configuration. A hosted
      # VM is deleted with both, and removing them first took 20-30s.
      - name: Drop this pull request's builder
        if: always() && github.event_name == 'pull_request' && runner.environment != 'github-hosted'
        run: |
          if [ -n "${BUILDER:-}" ]; then
            docker buildx rm "${BUILDER}" >/dev/null 2>&1 || true
          fi

  # ------------------------------------------------------------------- mcp
  # Kilo's three real-CLI cases, one per VM, for pull requests. Each spends
  # most of the test's 180s turn timeout on a hosted VM even alone (55s, 160s
  # and 176s for the whole case), against 20-40s for three cases of any other
  # runtime. Beside one another they run past it: on 2026-10-11, 25 of 48
  # hosted sandbox cells failed this suite, nearly all on a Kilo case's
  # TimeoutError, and three Kilo cases on one VM did it again in #532. The
  # sandbox cell keeps the other twelve; trusted events still run all fifteen
  # there, on the persistent pool, which this job leaves untouched.
  #
  # Each cell builds the sandbox itself, importing the layers `pr-caches`
  # exports. Everything from the SDK step to the builder removal is copied from
  # `artifacts` verbatim, comments aside — see there for why each step is the
  # way it is. `test_artifacts_workflow.py` fails if the copies diverge, so the
  # image these cases run is the image the sandbox cell builds and starts.
  mcp:
    name: MCP conformance (kilo, ${{ matrix.case }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true' && needs.changes.outputs.image_scope != 'web'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || matrix.artifact.runner) }}
    strategy:
      fail-fast: false
      matrix:
        # Kilo's three policy cases. With the sandbox cell's selection these
        # partition the parity suite; the policy test collects it to prove so.
        case: [allow, confirm, confirm-normalized-name]
        artifact:
          - name: sandbox
            arch: amd64
            smoke_args: --role sandbox
            dockerfile: deploy/sandbox/Dockerfile.agent-sandbox
            runner: '["self-hosted","Linux","X64","image-verify-x64"]'
            build_args: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Per case as well as per run and attempt: the cells share a run id, and
      # cleanup removes containers by this label.
      - name: Name this cell's artifacts
        run: |
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-mcp-kilo-${{ matrix.case }}"
          echo "IMAGE_TAG=${{ matrix.artifact.name }}:ci-${suffix}" >> "${GITHUB_ENV}"
          echo "SUFFIX=${suffix}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "${GITHUB_ENV}"

      - name: Free unused SDKs on the hosted sandbox runner
        if: github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox'
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -dc '0-9')"
          if [ "${available_kib:-0}" -lt $((40 * 1024 * 1024)) ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          df -h /

      - name: Reuse this runner's builder, or make one
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            builder_scope="$(
              printf '%s-%s' "${GITHUB_REPOSITORY}" "${RUNNER_NAME}" \
                | tr '[:upper:]' '[:lower:]' \
                | tr -c '[:alnum:]_.-' '-'
            )"
            builder_prefix="ci-pr-${builder_scope}-"
            buildx_config="${RUNNER_TEMP}/buildx"
            builder="${builder_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.artifact.name }}"
          else
            buildx_config="$(dirname "${RUNNER_WORKSPACE}")/buildx/${RUNNER_NAME}"
            builder="ci-${RUNNER_NAME}"
          fi
          mkdir -p "${buildx_config}"
          export BUILDX_CONFIG="${buildx_config}"
          echo "BUILDX_CONFIG=${buildx_config}" >> "${GITHUB_ENV}"
          echo "BUILDER=${builder}" >> "${GITHUB_ENV}"
          # A cancelled PR cannot run its final cleanup. On the next job for this
          # repository and runner, remove only that runner's orphaned builders.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            stale_prefix="buildx_buildkit_${builder_prefix}"
            while IFS= read -r container; do
              [ -n "${container}" ] || continue
              [ "${container}" = "buildx_buildkit_${builder}0" ] && continue
              case "${container}" in
                "${stale_prefix}"*)
                  docker rm -fv "${container}" >/dev/null 2>&1 || true
                  docker volume rm "${container}_state" >/dev/null 2>&1 || true
                  ;;
              esac
            done < <(
              docker ps -a --filter "name=${stale_prefix}" --format '{{.Names}}' \
                2>/dev/null || true
            )
          fi
          if ! docker buildx inspect "${builder}" --bootstrap >/dev/null 2>&1; then
            docker buildx rm "${builder}" >/dev/null 2>&1 || true
            docker buildx create --name "${builder}" --driver docker-container --use >/dev/null
            docker buildx inspect "${builder}" --bootstrap >/dev/null
          fi
          docker buildx use "${builder}" >/dev/null
          echo "builder ${builder} ready in ${buildx_config}"

      - name: Build ${{ matrix.artifact.name }}
        id: build
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ env.BUILDER }}
          context: .
          file: ${{ matrix.artifact.dockerfile }}
          push: false
          outputs: type=docker,compression=uncompressed
          tags: ${{ env.IMAGE_TAG }}
          cache-from: ${{ github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox' && 'type=gha,scope=sandbox-amd64' || '' }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            ${{ matrix.artifact.build_args }}

      - name: Build ${{ matrix.artifact.name }} (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ env.BUILDER }}
          context: .
          file: ${{ matrix.artifact.dockerfile }}
          push: false
          outputs: type=docker,compression=uncompressed
          tags: ${{ env.IMAGE_TAG }}
          cache-from: ${{ github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox' && 'type=gha,scope=sandbox-amd64' || '' }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            ${{ matrix.artifact.build_args }}

      - name: Free the hosted sandbox builder's unused cache
        if: github.event_name == 'pull_request' && runner.environment == 'github-hosted' && matrix.artifact.name == 'sandbox'
        run: |
          set -euo pipefail
          available_kib="$(df --output=avail -k / | tail -n 1 | tr -dc '0-9')"
          if [ "${available_kib:-0}" -lt $((40 * 1024 * 1024)) ]; then
            docker buildx prune --builder "${BUILDER}" --all --force
          fi
          df -h /

      - name: Isolate uv cache dir
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          prune-cache: false

      - name: Kilo retains MCP through approval, resume and fork (${{ matrix.case }})
        timeout-minutes: 20
        env:
          MCP_TEST_SANDBOX_IMAGE: ${{ env.IMAGE_TAG }}
          MCP_TEST_RUN_LABEL: ${{ env.SUFFIX }}
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: hybridinference_test_mcp
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: mcp-conformance-only
          MCP_TEST_WORKERS: "3"
          # The id `[<case>-kilo]`, which names exactly one case.
          MCP_TEST_SELECTION: "${{ matrix.case }}-kilo]"
        run: |
          set -euo pipefail
          database="mcp-db-${SUFFIX}"
          trap 'docker rm -f "${database}" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "${database}" \
            --label "io.hybridinference.smoke.run=${SUFFIX}" \
            -e POSTGRES_DB="${TEST_DB_NAME}" -e POSTGRES_PASSWORD="${TEST_DB_PASSWORD}" \
            -p 127.0.0.1::5432 postgres:16-alpine
          # Probe TCP, not the socket. The image runs initdb against a
          # temporary server started with `listen_addresses=''` — reachable on
          # the unix socket and nowhere else — then stops it and starts the
          # real one. A socket probe answers "accepting connections" for that
          # temporary server, and the createdb below then lands in the shutdown
          # between the two: `FATAL: the database system is shutting down`.
          # TCP is also how the tests reach it, so it is the honest question.
          for attempt in $(seq 1 30); do
            if docker exec "${database}" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "${database}" pg_isready -h 127.0.0.1 -U postgres
          # The test config appends pytest-xdist's worker id to TEST_DB_NAME.
          # Give each worker its own database so migrations and state cannot race;
          # the Postgres container creates only the unsuffixed database.
          for worker in $(seq 0 "$((MCP_TEST_WORKERS - 1))"); do
            docker exec "${database}" createdb \
              -U "${TEST_DB_USER}" "${TEST_DB_NAME}_gw${worker}"
          done
          TEST_DB_PORT=$(docker port "${database}" 5432/tcp | awk -F: '{print $NF}')
          MCP_TEST_HOST=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          export TEST_DB_PORT MCP_TEST_HOST
          # All 15 cases are one parametrized function in one file, so loadfile
          # or loadscope would keep them serial. Dynamic load balances the real
          # CLI processes while the worker databases isolate their storage.
          uv run pytest -q -n "${MCP_TEST_WORKERS}" --dist load \
            -m external -k "${MCP_TEST_SELECTION}" tests/external/test_resident_mcp_parity.py \
            --junitxml="${RUNNER_TEMP}/mcp-parity.xml"
          uv run python scripts/ci_tests_ran.py "${RUNNER_TEMP}/mcp-parity.xml"

      - name: Drop this run's containers and image
        if: always() && runner.environment != 'github-hosted'
        run: |
          # Scoped by this cell's label, not by the name prefix: a shared
          # runner hosts several cells at once, so `--filter name=smoke-`
          # reaches into the others and kills their containers mid-check.
          docker ps -aq --filter "label=io.hybridinference.smoke.run=${SUFFIX}" \
            | xargs -r docker rm -f || true
          # Not `-f`. Forced removal untags an image another cell or run may
          # still be starting containers from; a plain `rm` refuses while any
          # container references it, so the worst case is a leftover image
          # rather than a tag pulled out from under somebody else. (It does not
          # delete containers — the removals above are what did that.)
          docker image rm "${IMAGE_TAG}" >/dev/null 2>&1 || true

      - name: Drop this pull request's builder
        if: always() && github.event_name == 'pull_request' && runner.environment != 'github-hosted'
        run: |
          if [ -n "${BUILDER:-}" ]; then
            docker buildx rm "${BUILDER}" >/dev/null 2>&1 || true
          fi

  compose:
    name: Compose resolves
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    # The one docker job with no architecture to match: `docker compose config`
    # parses and interpolates, it does not build or start anything. Use the
    # ARM64 pool for trusted events so this does not queue behind x64 builds;
    # pull requests can parse these files on a disposable x64 hosted VM.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ARM64","image-verify-arm64"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate uv cache dir
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          prune-cache: false

      # The images building proves the Dockerfiles; it says nothing about the
      # file that wires them together. `config` is Compose's own parser: it
      # resolves every interpolation, build context and service reference, so a
      # variable that no longer exists or a dockerfile path that moved fails
      # here rather than on a runner host at deploy time.
      - name: Render the standalone stack
        run: |
          set -euo pipefail
          # Values are placeholders — `config` never starts anything. They exist
          # because the compose file requires them (`:?`), which is itself the
          # behaviour being checked: a required variable that stopped being
          # required would silently weaken the deployment.
          cat > .env <<'ENVFILE'
          # Sandbox Manager authorization is distinct from enrollment-issued host
          # credentials. The latter are persisted after one-time enrollment
          # and therefore are not a Compose secret.
          COMPOSE_PROJECT=freeinference-cloud-agent-sandbox-ci
          AGENT_SANDBOX_MANAGER_TOKEN=ci-placeholder-sandbox-manager-token
          AGENT_SANDBOX_IMAGE=cloud-agent-sandbox:ci
          AGENT_GATEWAY_URL=http://agent-gateway:8080
          AGENT_TUNNEL_SSH_DESTINATION=ci@gateway.invalid
          AGENT_TUNNEL_SSH_KEY=/dev/null
          AGENT_TUNNEL_SSH_KNOWN_HOSTS=/dev/null
          AGENT_MCP_TUNNEL_SSH_DESTINATION=ci@control-plane.invalid
          AGENT_MCP_TUNNEL_SSH_KEY=/dev/null
          AGENT_MCP_TUNNEL_SSH_KNOWN_HOSTS=/dev/null
          # The third tunnel: the runner's own path to the control plane's main
          # listener. Its own key, like the other two — one key opening both
          # this and the MCP tunnel would make the 8000/8001 split cosmetic.
          AGENT_CONTROL_PLANE_TUNNEL_SSH_DESTINATION=ci@control-plane.invalid
          AGENT_CONTROL_PLANE_TUNNEL_SSH_KEY=/dev/null
          AGENT_CONTROL_PLANE_TUNNEL_SSH_KNOWN_HOSTS=/dev/null
          # The one sandbox network's two deployment facts. Neither has a
          # default, so both are part of what this render proves.
          AGENT_EGRESS_CHAT_NETWORK_POOL=10.240.0.0/16
          AGENT_EGRESS_DNS_SERVER=192.0.2.53
          ENVFILE
          docker compose \
            -f deploy/host/docker-compose.sandbox.yml \
            --env-file .env \
            config > ${RUNNER_TEMP}/rendered.yml
          echo "--- rendered services ---"
          docker compose -f ${RUNNER_TEMP}/rendered.yml config --services

      # The control plane accepts legacy runtime values for a one-time import.
      # Database/bootstrap requirements are still checked separately below.
      - name: Render the control-plane stack
        run: |
          set -euo pipefail
          cat > .env.control-plane <<'ENVFILE'
          AGENT_DATABASE_URL=postgresql://cloudagent:ci@postgres:5432/cloudagent
          GATEWAY_BASE_URL=https://gateway.invalid
          GATEWAY_ISSUER=https://gateway.invalid
          GATEWAY_JWKS_URL=https://gateway.invalid/v1/identity/jwks
          GATEWAY_GRANT_DISPATCH_TOKEN=ci-placeholder-dispatch-token-not-a-real-secret
          AGENT_SESSION_SECRET=ci-placeholder-value-not-a-real-secret
          AGENT_SETTINGS_ENCRYPTION_KEY=ci-settings-root-key-not-a-real-secret
          ADMIN_TOKEN=ci-administrator-recovery-not-a-real-secret
          AGENT_CONTROL_TOKEN_SECRET=ci-placeholder-value-not-a-real-secret
          AGENT_SOURCE_CONTROL_ENCRYPTION_KEY=ci-placeholder-encryption-key-not-a-real-secret
          AGENT_DEPLOYMENT_SHA=ci-deployment-sha
          AGENT_POSTGRES_PASSWORD=ci-placeholder
          AGENT_SANDBOX_MANAGER_TOKEN=ci-placeholder-sandbox-manager-token
          # Sign-in is assembled server-side now, so the control plane needs
          # the consent page, its own callback as the gateway must see it
          # (byte-identical to an IDENTITY_ALLOWED_REDIRECTS entry there),
          # and where to land the browser afterwards.
          GATEWAY_AUTHORIZE_URL=https://gateway.invalid/authorize
          AGENT_SESSION_REDIRECT_URI=https://agents.invalid/agents/api/v1/session/callback
          AGENT_WEB_BASE_URL=https://agents.invalid/agents
          # The web build arguments are required rather than defaulted to
          # empty: empty is a real answer for a deployment that owns its
          # hostname and silently wrong for one mounted under a prefix, and
          # the difference does not show at start. Their presence here is
          # part of what this step checks.
          AGENT_WEB_BASE_PATH=/agents
          AGENT_WEB_API_URL=/agents/api
          AGENT_WEB_GATEWAY_URL=https://gateway.invalid
          ENVFILE
          docker compose \
            -f deploy/control-plane/docker-compose.yml \
            --env-file .env.control-plane \
            config > ${RUNNER_TEMP}/control-plane.yml
          docker compose -f ${RUNNER_TEMP}/control-plane.yml config --services

      # Runtime signing keys can be configured through administrator setup.
      # Database access and the actual host's credentials/network stay bootstrap.
      - name: Missing bootstrap configuration still refuses to render
        run: |
          set -euo pipefail
          check() {
            local stack="$1" envfile="$2" required="$3"
            grep -v "^${required}=" "$envfile" > .env.missing
            if docker compose -f "$stack" --env-file .env.missing config >/dev/null 2>&1; then
              echo "$stack rendered without $required" >&2
              exit 1
            fi
            echo "a missing $required still refuses to render ($stack)"
          }

          CP=deploy/control-plane/docker-compose.yml
          HOST=deploy/host/docker-compose.sandbox.yml
          for required in AGENT_DATABASE_URL AGENT_POSTGRES_PASSWORD AGENT_DEPLOYMENT_SHA; do
            check "$CP" .env.control-plane "$required"
          done
          for required in AGENT_SANDBOX_MANAGER_TOKEN AGENT_EGRESS_CHAT_NETWORK_POOL AGENT_EGRESS_DNS_SERVER; do
            check "$HOST" .env "$required"
          done

      - name: Missing runtime keys permit administrator setup without default secrets
        run: |
          set -euo pipefail
          cp .env.control-plane .env.setup
          for imported in AGENT_SESSION_SECRET AGENT_CONTROL_TOKEN_SECRET AGENT_SOURCE_CONTROL_ENCRYPTION_KEY AGENT_SANDBOX_MANAGER_TOKEN GATEWAY_ISSUER GATEWAY_JWKS_URL; do
            sed -i "/^${imported}=/d" .env.setup
          done
          docker compose -f deploy/control-plane/docker-compose.yml \
            --env-file .env.setup config > "${RUNNER_TEMP}/setup.yml"
          uv run --no-project --with pyyaml python - <<'PY'
          import os, yaml
          stack = yaml.safe_load(open(os.environ["RUNNER_TEMP"] + "/setup.yml"))
          for name in ("control-plane", "mcp-relay"):
              env = stack["services"][name]["environment"]
              for key in ("AGENT_SESSION_SECRET", "AGENT_CONTROL_TOKEN_SECRET",
                          "AGENT_SOURCE_CONTROL_ENCRYPTION_KEY", "AGENT_SANDBOX_MANAGER_TOKEN",
                          "GATEWAY_ISSUER", "GATEWAY_JWKS_URL"):
                  assert not env.get(key), f"{name} supplied a default for {key}"
              assert env["AGENT_SETTINGS_ENCRYPTION_KEY"]
          print("setup can start without runtime keys; no default credentials are supplied")
          PY

      - name: The rendered stack keeps its security properties
        run: |
          set -euo pipefail
          # `uv run --with pyyaml`, not a bare python3: incidental packages in
          # the runner environment are not a dependency guarantee. The heredoc is
          # quoted, so the path comes through the environment rather than shell
          # interpolation.
          uv run --no-project --with pyyaml python - <<'PY'
          import os, sys, yaml
          stack = yaml.safe_load(open(os.environ["RUNNER_TEMP"] + "/rendered.yml"))
          failures = []

          relays = stack["networks"].get("agent-relays", {})
          if not relays.get("internal"):
              failures.append("agent-relays is not internal — the discovery network would have a route out")

          # Named, not counted. Lifecycle attaches every relay it finds here to
          # each sandbox group's bridge; a check that only counted them would
          # pass on a stack where one had been swapped for something broader.
          on_relays = {
              name
              for name, svc in stack["services"].items()
              if "agent-relays" in (svc.get("networks") or {})
          }
          if on_relays != {"gateway-tunnel", "mcp-tunnel"}:
              failures.append(f"unexpected services on the relay network: {sorted(on_relays)}")

          # Either process may build or wake a group, so both must build the
          # same network, and find the relays where Compose put them.
          runner = stack["services"]["runner"]["environment"]
          sandbox_manager = stack["services"]["sandbox-manager"]["environment"]
          for key in ("AGENT_SANDBOX_NAMESPACE", "AGENT_RELAY_NETWORK",
                      "AGENT_EGRESS_CHAT_NETWORK_POOL", "AGENT_EGRESS_DNS_SERVER",
                      "AGENT_EGRESS_PROTECTED_CIDRS"):
              if runner.get(key) != sandbox_manager.get(key):
                  failures.append(f"runner and sandbox_manager disagree on {key}")
          if runner.get("AGENT_RELAY_NETWORK") != relays.get("name"):
              failures.append("the runner looks for its relays on a network Compose does not create")

          # One network: nothing may select another, and no proxy remains.
          retired = ("AGENT_EGRESS_SETUP_TIER", "AGENT_EGRESS_AGENT_TIER",
                     "AGENT_EGRESS_NETWORK_", "AGENT_EGRESS_PROXY", "AGENT_EGRESS_ALLOWLIST",
                     "AGENT_SANDBOX_ALLOW_OPEN_NETWORK", "AGENT_SANDBOX_NETWORK")
          for name, svc in stack["services"].items():
              if "proxy" in name:
                  failures.append(f"a proxy service remains: {name}")
              for key in svc.get("environment") or {}:
                  if key.startswith(retired):
                      failures.append(f"{name} still passes the retired {key}")

          # The Docker socket is the host's authority. `:ro` on the bind mount
          # does not narrow the API: whatever can connect can start a privileged
          # container with the host's root mounted. What this check can pin is
          # who holds it — the runner, which starts each sandbox, and the
          # sandbox manager, which execs into one — named, like the relays. Read-only
          # stays their mount convention, and is not presented as more.
          holders = set()
          for name, svc in stack["services"].items():
              for mount in svc.get("volumes") or []:
                  if isinstance(mount, dict):
                      paths = f"{mount.get('source', '')} {mount.get('target', '')}"
                      ro = mount.get("read_only")
                  else:
                      paths, ro = str(mount), ":ro" in str(mount)
                  if "docker.sock" in paths:
                      holders.add(name)
                      if not ro:
                          failures.append(f"{name} mounts the docker socket without the holders' :ro convention")
          if holders != {"runner", "sandbox-manager"}:
              failures.append(
                  "the docker socket is the host's authority; only runner and sandbox-manager "
                  f"may hold it, not {sorted(holders)}"
              )

          if failures:
              print("\n".join(failures)); sys.exit(1)
          print("rendered stack: one sandbox network, relays discoverable only, docker socket held by runner and sandbox manager only")
          PY

      - name: Upload limits match encoded attachments through nginx
        timeout-minutes: 5
        env:
          AGENT_UPLOAD_TEST_NGINX_IMAGE: nginx:1.27.5-alpine
        run: |
          set -euo pipefail
          docker --host=unix:///var/run/docker.sock pull "${AGENT_UPLOAD_TEST_NGINX_IMAGE}"
          uv run --frozen pytest -q -m external tests/external/test_upload_edge_limits.py \
            --junitxml="${RUNNER_TEMP}/upload-edge-limits.xml"
          uv run --frozen python scripts/ci_tests_ran.py "${RUNNER_TEMP}/upload-edge-limits.xml"

      - name: Retained commands clean up Docker siblings at execution limits
        timeout-minutes: 5
        env:
          AGENT_COMMAND_TEST_IMAGE: postgres:15
        run: |
          set -euo pipefail
          docker --host=unix:///var/run/docker.sock pull "${AGENT_COMMAND_TEST_IMAGE}"
          uv run --frozen pytest -q -m external tests/external/test_retained_command_limits.py \
            --junitxml="${RUNNER_TEMP}/retained-command-limits.xml"
          uv run --frozen python scripts/ci_tests_ran.py "${RUNNER_TEMP}/retained-command-limits.xml"

  # -------------------------------------------------------------------- gate
  kata:
    name: Candidate on real Kata
    needs: changes
    # This is the real sandbox machine. Only reviewed dev commits may execute
    # here; pull requests remain excluded regardless of their runner routing.
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.docker == 'true')
    runs-on: [self-hosted, Linux, X64, image-verify-x64]
    timeout-minutes: 30
    concurrency:
      group: cloud-agent-kata-ci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Isolate build configuration
        run: |
          mkdir -p "${RUNNER_TEMP}/kata-docker" "${RUNNER_TEMP}/kata-buildx"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/kata-docker" >> "$GITHUB_ENV"
          echo "BUILDX_CONFIG=${RUNNER_TEMP}/kata-buildx" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate candidate without touching the deployed stack
        run: |
          set -euo pipefail
          sandbox="cloud-agent-kata-check:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-sandbox"
          runner="cloud-agent-kata-check:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runner"
          trap 'docker image rm "$sandbox" "$runner" >/dev/null 2>&1 || true' EXIT
          docker build --provenance=false -f deploy/sandbox/Dockerfile.agent-sandbox -t "$sandbox" .
          docker build --provenance=false -f deploy/host/Dockerfile.agent-runner -t "$runner" .
          docker run --rm --network none \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -e AGENT_SANDBOX_BACKEND=kata -e "AGENT_SANDBOX_IMAGE=$sandbox" \
            "$runner" python -m cloud_agent_host.candidate_check

  # ------------------------------------------------------------------- docs
  # The developer documentation in docs/developer/ builds with warnings as
  # errors, so a broken link, a missing anchor or a page left out of the table
  # of contents fails here rather than on the published site.
  docs-build:
    name: Docs Build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    # A dependency install and one sphinx-build that takes seconds; without a
    # limit a hung step would hold a runner for the 360-minute default.
    timeout-minutes: 10
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch, for the same checkout reliability reason as Lint.
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate uv cache dir
        # Off the shared ~/.cache/uv; see the note on this step in Lint.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # --only-group: the build needs Sphinx, myst-parser and the theme from
      # the `dev` group, never the application or its runtime dependencies.
      - name: Sync dependencies
        run: uv sync --locked --only-group dev

      # Through the Makefile, so this job and a contributor's `make docs` run
      # the same command. --no-sync keeps `uv run` from re-syncing the full
      # project closure the step above deliberately left out.
      - name: Build developer docs
        run: make docs UV_RUN="uv run --no-sync"

  ci-gate:
    name: CI Gate
    # The single job that says whether this commit is good. `publish.yml` keys
    # on this workflow's conclusion, so this is what stands between a merge to
    # dev and a consumable release.
    if: always()
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","ci-general"]') }}
    needs:
      - changes
      - lint
      - test
      - test-db
      - check
      - web-build
      - gitleaks
      - artifacts
      - mcp
      - compose
      - kata
      - docs-build
    steps:
      - name: Report the pull request qualification boundary
        if: github.event_name == 'pull_request'
        run: |
          echo "Kata host qualification is skipped for pull requests. It requires a trusted push or manual dispatch on dev; PR checks do not qualify a deployment host." >> "${GITHUB_STEP_SUMMARY}"

      - name: Every job succeeded or was deliberately skipped
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            test-db=${{ needs.test-db.result }}
            web=${{ needs.check.result }}
            web-build=${{ needs.web-build.result }}
            gitleaks=${{ needs.gitleaks.result }}
            artifacts=${{ needs.artifacts.result }}
            mcp=${{ needs.mcp.result }}
            compose=${{ needs.compose.result }}
            kata=${{ needs.kata.result }}
            docs-build=${{ needs.docs-build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | tr ' ' '\n' | sed '/^$/d'

          # `skipped` is ambiguous on its own: a job skipped by its `if` and a
          # job skipped because something it needed failed report the same
          # word. The classifier is the only thing every other job needs, so
          # requiring it to have succeeded is what makes the rest of the
          # skipped/success test meaningful.
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error title=CI Gate::the change classifier did not succeed (${CHANGES_RESULT}); every downstream skip is unexplained"
            exit 1
          fi

          failed=0
          for entry in ${RESULTS}; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "${result}" in
              success|skipped) ;;
              *) echo "::error title=CI Gate::${name} is ${result}"; failed=1 ;;
            esac
          done
          [ "${failed}" -eq 0 ] || exit 1
          echo "CI Gate: green"

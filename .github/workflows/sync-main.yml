name: Sync dev to main

# `main` is the default branch and the trusted copy of workflow definitions
# used by `workflow_run`. Nothing lands on it directly — it only ever
# fast-forwards to `dev`, and only when somebody asks.
#
# **Manual on purpose.** Advancing the default branch changes which publication
# workflow future green `dev` commits execute. Keep that release-control change
# explicit rather than making it a side effect of merge timing.
#
# Fast-forward only. A failure here saying the merge is not possible means
# `main` carries a commit `dev` does not, which is a thing to go and look at
# rather than a thing to force past.
#
# The push uses `GITHUB_TOKEN`, and GitHub raises no workflow events for pushes
# made with it. So this moves `main` and starts nothing. Deployments belong to
# downstream distributions and are not triggered from this repository.

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize dispatches so two runs cannot both fast-forward from the same old
# main. Runs queue rather than cancel, so an in-flight sync always finishes.
concurrency:
  group: sync-dev-to-main
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward main to dev
    # Self-hosted, like the rest of this repository's CI: GitHub-hosted jobs are
    # refused outright when the account's Actions billing lapses or hits its
    # spending limit, and a sync that silently stops running leaves `main`
    # arbitrarily far behind without ever going red. The gateway lost 29 commits
    # that way before moving this job off hosted runners.
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to dev
        run: |
          set -euo pipefail
          # -B rather than a plain checkout: these runners reuse their
          # workspace, so a local `main` left behind by an earlier run would be
          # checked out at that run's commit instead of the freshly fetched
          # remote tip.
          git checkout -B main origin/main
          before="$(git rev-parse HEAD)"
          git merge --ff-only origin/dev
          git push origin main
          after="$(git rev-parse HEAD)"
          if [ "${before}" = "${after}" ]; then
            echo "main was already at ${after}; nothing to do."
          else
            echo "main: ${before} -> ${after}"
          fi
          {
            echo "### main is now \`${after}\`"
            echo
            echo "No environment was deployed; this repository only publishes releases."
          } >> "${GITHUB_STEP_SUMMARY}"

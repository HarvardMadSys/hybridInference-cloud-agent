# Alembic configuration for the agent-owned database.
#
# The DSN is deliberately absent: env.py reads AGENT_DATABASE_URL. A URL in a
# committed file is a URL someone eventually migrates the wrong database with.

[alembic]
script_location = migrations
prepend_sys_path = apps/backend

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

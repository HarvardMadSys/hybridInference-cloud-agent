openapi: 3.1.0

info:
  title: HybridInference gateway — inference grants
  version: "1.1.0"
  x-source:
    repo: HarvardMadSys/hybridInference
    branch: murphy/claude/agent-grant-usage-window
    commit: 0a2513b6ff7d33312755bffe72e41d789f2596e1
    files:
      - apps/backend/serving/servers/routers/agent_grants.py
      - apps/backend/serving/grants.py
      - apps/backend/serving/grant_auth.py
      - apps/backend/serving/storage/postgres_log.py
    tasks: [C5, C6, C7]
  description: |
    How a sandbox gets the right to call models, when the service running that
    sandbox has no user table and no model registry. It asks; the gateway
    decides; the answer is a short-lived bearer token the sandbox carries.

    **Scope, never spend.** A grant says *what* an attempt may call. How much it
    may spend is the account's existing daily quota, enforced on the inference
    path for grant-authenticated calls exactly as it is for API keys. There is
    deliberately **no per-task dollar budget** — an earlier design had one, and
    removing it is only safe because the quota gate covers grant traffic too.

    **Short TTL and renewal, not long TTL and revocation.** A grant lives 300
    seconds by default (900 maximum) and the control plane renews it on a
    30-second loop while the attempt is genuinely still running. Revocation is
    an *acceleration* of that expiry, never the mechanism — which is why a
    failed revoke needs no durable outbox and why a control plane that dies
    mid-attempt leaks capability for at most one TTL.

    **The fence is the control plane's, not the gateway's.** The gateway holds
    no attempt or lease state after the split, so it cannot refuse a renewal on
    the grounds that the attempt was superseded thirty seconds ago; it renews
    what it is asked to renew. The consumer's renewal loop re-reads its own
    store every pass, which is what stops a zombie sandbox.

    **Models are clamped, and models are all of it.** A request for more than
    the user's role can reach comes back narrowed; a narrower agent still runs.
    A grant carried an MCP scope until the ownership amendment moved the
    registry, its credentials and its proxy to the consumer — which is where
    the job, its requested tools and the attempt fence already live. A sandbox
    reaches tools with a separate credential this gateway neither mints nor
    accepts, so a leaked grant buys models and no tools.

servers:
  - url: https://gateway.example.org
    description: Production
  - url: https://staging.gateway.example.org
    description: Staging

tags:
  - name: internal
    description: |
      Not public API. Behind a shared service credential, and absent entirely
      on deployments that do not federate capability.

paths:
  /internal/agent-grants:
    post:
      tags: [internal]
      operationId: mintGrant
      summary: Mint (or return) the grant for one attempt
      description: |
        **Idempotent per attempt.** A retry for the same
        `external_job_id` + `external_attempt_id` returns the existing grant
        rather than a second one, so a control plane that retries a timed-out
        mint does not leave a live orphan behind it that nothing renews and
        nothing revokes.

        The response carries the **effective** scope, which may be narrower
        than the request. Build the job around what came back, not around what
        was sent: an agent pointed at a model its grant does not carry fails at
        its first call.
      security:
        - dispatchToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, external_job_id, external_attempt_id]
              properties:
                user_id:
                  type: string
                  maxLength: 128
                  description: The gateway user the capability belongs to.
                external_job_id:
                  type: string
                  maxLength: 128
                  description: The consumer's job id. Half the idempotency key.
                external_attempt_id:
                  type: string
                  maxLength: 128
                  description: The consumer's attempt id. The other half.
                allowed_models:
                  type: [array, "null"]
                  items: { type: string }
                  description: |
                    Clamped to what the user's role can reach. `null` means
                    "everything this role can reach".
                ttl_seconds:
                  type: [integer, "null"]
                  description: |
                    Clamped to 900. `null` means 300. **The clamp is silent**,
                    so read `expires_at` rather than assuming what was asked
                    for — a consumer sizing its renewal cadence against the
                    number it sent will lose a capability mid-run.
      responses:
        "200":
          description: The effective grant, with its bearer token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Grant"
                  - type: object
                    required: [token]
                    properties:
                      token:
                        type: string
                        description: |
                          The `agr.`-prefixed HMAC bearer token. **Returned
                          only here** — renew does not re-issue it, because the
                          caller already has it and a token that travels twice
                          is a token logged twice. This is the only credential
                          that enters a sandbox.
        "401":
          description: Wrong or missing dispatch token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { type: unauthorized, message: Invalid dispatch token. }
        "403":
          description: |
            The subject is unknown or not active. **One message for both**:
            whether a given user id exists is not something an internal caller
            needs, and answering differently enumerates accounts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: subject_unavailable
                  message: That user cannot be granted capability.
        "404":
          description: |
            This deployment does not expose internal capability endpoints (no
            dispatch token set), or has no user database.

            **404 rather than 401 for the unconfigured case**: "this gateway
            does not federate capability" and "you got the password wrong" are
            different facts, and an unconfigured deployment should not look
            like a guarded one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: internal_api_not_configured
                  message: This deployment does not expose internal capability endpoints.

  /internal/agent-grants/{grant_id}/renew:
    post:
      tags: [internal]
      operationId: renewGrant
      summary: Extend a live grant by one step
      description: |
        Buys the gateway's own renewal step **from now**, whatever was asked
        for at mint. After the first renewal it is that number, not the
        consumer's, that its cadence has to stay inside.

        The subject is re-checked on every renewal: a user suspended mid-job
        must stop being able to spend, and renewal is the only recurring moment
        the gateway gets to notice.

        Carries no token: the caller already has it.
      security:
        - dispatchToken: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
      responses:
        "200":
          description: The renewed grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "401":
          description: Wrong or missing dispatch token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            The subject was suspended since the grant was minted.
            **A verdict on this grant** — a consumer may stop the attempt on it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: subject_unavailable
                  message: That user cannot be granted capability.
        "404":
          description: |
            Three different facts share this status, and a consumer that reacts
            destructively **must branch on `error.type`, not on the 404**:

            * `unknown_grant` / `grant_not_live` — a verdict on this grant. It
              is gone, revoked, or expired past renewal.
            * `internal_api_not_configured` — a verdict on the *gateway's*
              configuration, and true of every grant at once. Treating it as
              the first would abandon an entire fleet of running attempts over
              one unset environment variable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: grant_not_live
                  message: That grant is revoked or expired and cannot be renewed.

  /internal/agent-grants/{grant_id}/revoke:
    post:
      tags: [internal]
      operationId: revokeGrant
      summary: Withdraw a grant now rather than at its TTL
      description: |
        An acceleration of the expiry, never the mechanism. A consumer that
        cannot reach the gateway to revoke has lost lateness, not safety — the
        TTL still retires the capability — which is why the reference consumer
        reports a failed revoke rather than raising, and keeps no retry queue
        for it.

        Idempotent: revoking twice is not an error, and the second call says so.
      security:
        - dispatchToken: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
      responses:
        "200":
          description: The grant is revoked, whether or not this call did it.
          content:
            application/json:
              schema:
                type: object
                required: [grant_id, revoked, already_revoked]
                properties:
                  grant_id: { type: string }
                  revoked: { type: boolean, const: true }
                  already_revoked:
                    type: boolean
                    description: True when a previous call had already done it.
        "401":
          description: Wrong or missing dispatch token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such grant, or internal endpoints are not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /internal/agent-grants/{grant_id}/usage:
    get:
      tags: [internal]
      operationId: grantUsage
      summary: Read grant usage over a request-start window, or legacy job totals
      description: |
        **Informational attribution, not a limit.** Nothing consults this to
        decide whether a call may proceed — that is the account's daily quota.
        Reading it as a ceiling would reintroduce the per-job budget this
        design removed, and would do so in a component that cannot enforce one.

        With no query parameters, this retains the legacy flat response:
        lifetime totals keyed by the grant's `external_job_id`. With any new
        parameter, `since` and `detail` are required and select the versioned
        response. This consumer uses `detail=totals` and always sends both
        window bounds. It rejects legacy responses from older deployments
        that ignore unknown query parameters.

        Windowed results match the exact authenticated grant ID and use
        `[since, until)` over `request_started_at`. Logging-time boundaries
        would lose long requests recorded after a turn ends. Only newly
        attributed request logs carry this identity/start-time metadata;
        this operation does not reconstruct historical missing attribution.

        Each total sums the rows that reported it; `unknown_rows` counts the
        missing rows beside that partial sum. A metric is null when no row
        reports it, including an empty window (calls=0). Input tokens include
        cache reads/writes, and reasoning tokens are a subset of output.
        `spent_usd` is the recorded platform `cost_usd` as a fixed-point
        decimal string, not an upstream supplier invoice. `estimated_calls`
        counts requests whose usage was estimated. Calls count request-log
        rows, not internal upstream retries or unlogged authentication failures.

        Logs arrive asynchronously. `finalized` is always false and `as_of`
        records the read time, not a settlement watermark. Totals cover the
        full window independently of request pagination. Pages use ascending
        `(request_started_at, request_id)` keyset order. Cursor scope includes
        the grant and both normalized bounds: carry the echoed `until` on
        every continuation (omitting it recomputes now and invalidates the
        cursor). Cross-page reads are not frozen; late rows can land behind
        a cursor. To refresh, start from page one and deduplicate request IDs.

        The service credential may read a revoked or expired grant's history.
        Grant possession is not authorization to read this endpoint. The
        gateway origin and grant prefix come from control-plane configuration;
        future installation ownership checks must not change this payload.
      security:
        - dispatchToken: []
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - name: since
          in: query
          description: Inclusive ISO 8601 bound with explicit UTC offset; required with detail.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Exclusive offset-aware bound; defaults to now and is echoed back.
          schema: { type: string, format: date-time }
        - name: detail
          in: query
          description: Required for windowed reports; requests adds paginated detail rows.
          schema: { type: string, enum: [totals, requests] }
        - name: limit
          in: query
          description: Valid only with detail=requests.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: Opaque continuation bound to grant, since, until and sort order.
          schema: { type: string }
      responses:
        "200":
          description: Legacy job totals or one grant's versioned windowed report.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LegacyUsage"
                  - $ref: "#/components/schemas/WindowedUsage"
        "401":
          description: Wrong or missing dispatch token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such grant, or internal endpoints are not configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            `invalid_usage_query` for missing/invalid bounds, detail, or page
            size; `invalid_cursor` for malformed or mismatched continuation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            No billing ledger is available. **Not an empty report** — "this job
            spent nothing" is a different and much more reassuring claim than
            "we cannot tell".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: ledger_unavailable
                  message: Usage cannot be reported right now.

components:
  parameters:
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    dispatchToken:
      type: http
      scheme: bearer
      description: |
        `GATEWAY_GRANT_DISPATCH_TOKEN`, shared between the gateway and the
        control plane and compared in constant time. A **service** credential:
        it travels on this path only, and never toward a sandbox or a browser.

        A deployment that has not set it offers no internal endpoints at all
        and answers 404 to every path in this document.

  schemas:
    NonnegativeCount:
      type: integer
      minimum: 0

    NullableCount:
      type: [integer, "null"]
      minimum: 0

    NullableMoney:
      type: [string, "null"]
      pattern: '^[0-9]+(?:\.[0-9]+)?$'
      description: Fixed-point USD decimal string; null when no row reports a cost.

    LegacyUsage:
      type: object
      required: [grant_id, external_job_id, spent_usd, request_count, tokens_in, tokens_out]
      properties:
        grant_id: { type: string }
        external_job_id: { type: string }
        spent_usd: { type: number }
        request_count: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }

    UsageTotals:
      type: object
      required: [calls, tokens_in, tokens_out, cache_read, cache_write, reasoning, spent_usd]
      properties:
        calls: { $ref: "#/components/schemas/NonnegativeCount" }
        tokens_in: { $ref: "#/components/schemas/NullableCount" }
        tokens_out: { $ref: "#/components/schemas/NullableCount" }
        cache_read: { $ref: "#/components/schemas/NullableCount" }
        cache_write: { $ref: "#/components/schemas/NullableCount" }
        reasoning: { $ref: "#/components/schemas/NullableCount" }
        spent_usd: { $ref: "#/components/schemas/NullableMoney" }

    UsageUnknownRows:
      type: object
      required: [tokens_in, tokens_out, cache_read, cache_write, reasoning, spent_usd]
      description: Missing-row counts per metric; each must be at most totals.calls.
      properties:
        tokens_in: { $ref: "#/components/schemas/NonnegativeCount" }
        tokens_out: { $ref: "#/components/schemas/NonnegativeCount" }
        cache_read: { $ref: "#/components/schemas/NonnegativeCount" }
        cache_write: { $ref: "#/components/schemas/NonnegativeCount" }
        reasoning: { $ref: "#/components/schemas/NonnegativeCount" }
        spent_usd: { $ref: "#/components/schemas/NonnegativeCount" }

    UsageRequest:
      type: object
      required:
        [request_id, request_started_at, logged_at, model, served_model_id,
         tokens_in, tokens_out, cache_read, cache_write, reasoning, spent_usd,
         ttft_ms, latency_ms, status_code, usage_estimated]
      description: Safe request metadata only; no prompt, response, raw metadata or credentials.
      properties:
        request_id: { type: string }
        request_started_at: { type: string, format: date-time }
        logged_at: { type: string, format: date-time }
        model: { type: [string, "null"] }
        served_model_id: { type: [string, "null"] }
        tokens_in: { $ref: "#/components/schemas/NullableCount" }
        tokens_out: { $ref: "#/components/schemas/NullableCount" }
        cache_read: { $ref: "#/components/schemas/NullableCount" }
        cache_write: { $ref: "#/components/schemas/NullableCount" }
        reasoning: { $ref: "#/components/schemas/NullableCount" }
        spent_usd: { $ref: "#/components/schemas/NullableMoney" }
        ttft_ms: { $ref: "#/components/schemas/NullableCount" }
        latency_ms: { $ref: "#/components/schemas/NullableCount" }
        status_code: { type: [integer, "null"] }
        usage_estimated: { type: boolean }

    WindowedUsage:
      type: object
      required:
        [schema_version, source, grant_id, external_job_id, attribution, window,
         as_of, finalized, totals, unknown_rows, estimated_calls]
      properties:
        schema_version: { type: integer, const: 1 }
        source: { type: string, const: gateway_api_logs }
        grant_id: { type: string }
        external_job_id: { type: string }
        attribution: { type: string, const: grant_time_window }
        window:
          type: object
          required: [since, until, basis]
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
            basis: { type: string, const: request_started_at }
        as_of: { type: string, format: date-time }
        finalized: { type: boolean, const: false }
        totals: { $ref: "#/components/schemas/UsageTotals" }
        unknown_rows: { $ref: "#/components/schemas/UsageUnknownRows" }
        estimated_calls: { $ref: "#/components/schemas/NonnegativeCount" }
        requests:
          type: array
          description: Present only for detail=requests; totals still cover the whole window.
          items: { $ref: "#/components/schemas/UsageRequest" }
        next_cursor:
          type: [string, "null"]
          description: Present only for detail=requests; null at the current end of the result.

    Grant:
      type: object
      required:
        - grant_id
        - user_id
        - external_job_id
        - external_attempt_id
        - allowed_models
        - expires_at
        - revoked_at
      properties:
        grant_id: { type: string }
        user_id: { type: string }
        external_job_id: { type: string }
        external_attempt_id: { type: string }
        allowed_models:
          type: array
          items: { type: string }
          description: The **effective** models, after the role clamp.
        expires_at:
          type: string
          format: date-time
          description: |
            The effective expiry after the TTL clamp. **The number to size a
            renewal cadence against**, since a requested TTL above the maximum
            is shortened without saying so.
        revoked_at:
          type: [string, "null"]
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              description: |
                Machine-readable, and **the field to branch on**. Statuses here
                are overloaded across causes — see the 404 on `/renew`.
            message: { type: string }

x-constants:
  DEFAULT_GRANT_TTL_S: 300
  MAX_GRANT_TTL_S: 900
  token_prefix: "agr."
  signing_context: "agent-inference-grant:v1"

x-pinned-by:
  gateway:
    - tests/unit/test_agent_grants.py
    - tests/unit/test_grant_model_auth.py
  consumer:
    - tests/unit/test_grant_client.py
    - tests/unit/test_grant_usage_client.py
    - tests/unit/test_grant_usage_contract.py
    - tests/unit/test_grant_lifecycle.py
    - tests/servers/test_grant_at_claim.py
    - tests/integration/storage/test_agent_grant_store.py

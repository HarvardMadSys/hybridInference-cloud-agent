openapi: 3.1.0

info:
  title: HybridInference gateway — cross-service identity
  version: "2.0.0"
  x-source:
    repo: HarvardMadSys/hybridInference
    branch: murphy/codex/gateway-minimal-agent-identity
    files:
      - apps/backend/serving/servers/routers/identity.py
      - apps/backend/serving/utils/identity_tokens.py
      - apps/backend/serving/utils/identity_keys.py
    tasks: [C1, C2, C3]
  description: |
    How a detached service learns who a gateway user is **without holding any
    secret of the gateway's**. OAuth 2.0 authorization code with PKCE, RS256,
    and a published verification key.

    Three properties are the whole design, and each is load-bearing:

    * **Asymmetric signatures.** The gateway signs with a private key and
      publishes the public half. A symmetric key cannot be published, so a
      shared HS256 secret would mean every consuming service could also *mint*
      identities — the compromise of any one of them would be the compromise
      of gateway sign-in itself.
    * **PKCE, and no client secret.** The consuming service's frontend is
      public code; a secret shipped to a browser is not a secret. The proof of
      possession is the verifier, generated per flow and never transmitted
      until redemption.
    * **No refresh token.** The identity token is short-lived (10 minutes) and
      is exchanged once, for the consuming service's own session. Nothing here
      is a long-lived credential, so nothing here needs revocation
      infrastructure — expiry is the mechanism.

    The `/code` call is made by the **gateway's own frontend** on behalf of a
    user who is already signed in there; the `/token` call is made by the
    **consuming service's backend**, unauthenticated, bound to the code only by
    PKCE. That asymmetry is why `/code` requires a session and `/token` does
    not.

servers:
  - url: https://gateway.example.org
    description: Production
  - url: https://staging.gateway.example.org
    description: Staging

tags:
  - name: identity
    description: Cross-service single sign-on.

paths:
  /v1/identity/jwks:
    get:
      tags: [identity]
      operationId: identityJwks
      summary: The public key identity tokens are verified with
      description: |
        Unauthenticated by design: a public verification key is public.

        Consumers cache this and re-fetch on an **unknown `kid`**, so a
        rotation is picked up by the cache miss rather than by waiting out an
        expiry. `Cache-Control: public, max-age=300` bounds how long a
        withdrawn key can still be trusted.

        The key set carries the current signing key first, then any retiring
        keys still published for verification, so a token minted just before a
        rotation still verifies.
      security: []
      responses:
        "200":
          description: A JWKS document.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `public, max-age=300`.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, use, alg, kid, "n", e]
                      properties:
                        kty: { type: string, const: RSA }
                        use: { type: string, const: sig }
                        alg: { type: string, const: RS256 }
                        kid:
                          type: string
                          description: |
                            The RFC 7638 JWK thumbprint. Derived from the key
                            rather than assigned, so two deployments cannot
                            disagree about what a `kid` names and a rotation
                            cannot accidentally reuse one.
                        "n": { type: string, description: Modulus, base64url. }
                        e: { type: string, description: Exponent, base64url. }
        "404":
          description: |
            This deployment has no identity key. **Not a 500** — a gateway with
            cross-service identity switched off is a valid deployment, and a
            consumer must be able to tell "not offered here" from "offered but
            broken".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: identity_not_configured
                  message: Cross-service identity is not configured on this deployment.
        "500":
          description: |
            A key is configured and unusable — a mangled PEM, a key too small.
            The other half of the distinction above: answering 404 here would
            let a broken production deploy pass for a feature nobody enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: identity_key_misconfigured
                  message: The configured identity signing key could not be loaded.

  /v1/identity/code:
    post:
      tags: [identity]
      operationId: identityCreateCode
      summary: Issue a one-time authorization code for the signed-in user
      description: |
        Called by the **gateway's own frontend**, from the `/authorize` page,
        for a user who is already signed in to the gateway. The response's
        `code` is handed to the consuming service through the redirect.

        Everything issuance needs is checked *before* a code exists — including
        that a usable signing key is present. A redirect allowlist without a
        key would otherwise mint a code that `/token` consumes and then cannot
        redeem, and the failed exchange burns it, so the caller retries into
        the same wall with nothing to go on.
      security:
        - gatewaySession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri, code_challenge]
              properties:
                client_id:
                  type: string
                  maxLength: 128
                  description: |
                    Must be a registered client. `cloud-agent` is this
                    service's.
                redirect_uri:
                  type: string
                  maxLength: 2048
                  description: |
                    Matched **exactly** against `IDENTITY_ALLOWED_REDIRECTS` —
                    not by prefix and not by origin. A prefix match is how open
                    redirectors are built.
                code_challenge:
                  type: string
                  minLength: 43
                  maxLength: 128
                  description: base64url SHA-256 of the verifier.
                code_challenge_method:
                  type: string
                  maxLength: 16
                  default: S256
                  description: |
                    **`S256` only.** `plain` is accepted by the OAuth spec and
                    is not accepted here: it makes the challenge and the
                    verifier the same string, so anything that can intercept
                    the code can also complete the exchange, which is the exact
                    attack PKCE exists to stop.
      responses:
        "200":
          description: The code and its lifetime.
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_in]
                properties:
                  code: { type: string }
                  expires_in:
                    type: integer
                    const: 60
                    description: |
                      Sixty seconds. The code crosses one redirect and is
                      redeemed immediately; anything longer is only a longer
                      window for a leaked URL to be replayed.
        "400":
          description: Unregistered client, unlisted redirect, or a method other than S256.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { type: invalid_request, message: Unsupported code challenge method. }
        "401":
          description: No gateway session.
        "404":
          description: Identity is not configured on this deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Identity is configured and unusable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/identity/token:
    post:
      tags: [identity]
      operationId: identityExchangeCode
      summary: Exchange a one-time code for an identity token
      description: |
        Called by the **consuming service's backend**. Unauthenticated: there
        is no client secret, and possession of the verifier is the proof.

        **The code is claimed before the caller's own inputs are checked**, and
        deliberately so. A failed exchange must not leave the code usable for a
        second attempt — that is precisely what turns an intercepted code into
        a working one. The legitimate client simply restarts the flow.

        Every mismatch below answers the same `invalid_grant`: telling a caller
        which part of its guess was right is an oracle.

        The account is re-read at exchange time. The code was issued up to a
        minute ago, and a suspension in between takes effect now rather than
        after the identity token expires downstream.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier, client_id, redirect_uri]
              properties:
                code: { type: string, maxLength: 512 }
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
                  description: The verifier whose SHA-256 was sent as the challenge.
                client_id:
                  type: string
                  maxLength: 128
                  description: Must equal the one the code was issued to.
                redirect_uri:
                  type: string
                  maxLength: 2048
                  description: Must equal the one the code was issued for.
      responses:
        "200":
          description: The identity token.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in]
                properties:
                  access_token:
                    type: string
                    description: |
                      An RS256 JWT. Claims: `sub` (the gateway user id),
                      `iss`, `aud`, `iat`, `exp`. No account profile is included. Verified against
                      `/v1/identity/jwks`; **no gateway secret is needed to do
                      so, and that is the point of the whole flow.**

                      It carries no display name. A consumer that reports one
                      must source it elsewhere or report null.
                  token_type: { type: string, const: Bearer }
                  expires_in:
                    type: integer
                    const: 600
                    description: |
                      Ten minutes, and not renewable. It is exchanged once for
                      the consuming service's own session; it is not a
                      credential anything holds on to.
        "400":
          description: |
            The code is invalid, expired, already used, or does not match the
            client, redirect or verifier presented. **One error for all of
            them**, on purpose.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error:
                  type: invalid_grant
                  message: The authorization code is invalid, expired, or already used.
        "403":
          description: The account may no longer sign in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: { type: account_unavailable, message: This account may not sign in. }
        "404":
          description: |
            Identity is not configured. Checked **before the code is touched**:
            burning a code is the price of getting the exchange wrong, and must
            not also be the price of this deployment being misconfigured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Identity is configured and unusable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    gatewaySession:
      type: http
      scheme: bearer
      description: |
        A gateway session token, for a user signed in to the gateway. Used only
        by `/code`, and only by the gateway's own frontend.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message]
          properties:
            type:
              type: string
              description: |
                Machine-readable. Callers whose reaction is destructive should
                branch on this rather than on the status code — statuses here
                are overloaded across causes.
            message: { type: string }

